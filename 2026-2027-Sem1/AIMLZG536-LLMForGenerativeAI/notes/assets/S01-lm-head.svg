<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Language modelling head and weight tying</title>
  <desc id="desc">A tied language model uses the same embedding matrix for input lookup and output scoring. Token IDs gather rows from E; the final hidden vector is multiplied by E transposed to produce logits and probabilities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2a44"/>
    </marker>
    <marker id="tieArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6400"/>
    </marker>
    <style>
      .page { fill: #fffdf7; stroke: #c5b47c; stroke-width: 2.2; }
      .title { font: 700 32px Georgia, serif; fill: #182033; }
      .subtitle { font: 18px Georgia, serif; fill: #33405c; }
      .section { font: 700 20px Georgia, serif; fill: #725100; letter-spacing: .5px; }
      .label { font: 700 22px Georgia, serif; fill: #182033; }
      .body { font: 18px Georgia, serif; fill: #253047; }
      .small { font: 15px Georgia, serif; fill: #253047; }
      .tiny { font: 13px Georgia, serif; fill: #253047; }
      .box { fill: #ffffff; stroke: #253047; stroke-width: 2.2; }
      .blue { fill: #eaf2ff; stroke: #315a99; stroke-width: 2.2; }
      .teal { fill: #e4f2f4; stroke: #1e6572; stroke-width: 2.2; }
      .rose { fill: #f7e4e7; stroke: #914252; stroke-width: 2.2; }
      .gold { fill: #fff2bd; stroke: #8a6400; stroke-width: 2.2; }
      .arrow { stroke: #1d2a44; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .tie { stroke: #8a6400; stroke-width: 2.8; fill: none; stroke-dasharray: 8 7; marker-end: url(#tieArrow); }
    </style>
  </defs>

  <rect x="30" y="28" width="1140" height="704" rx="22" class="page"/>
  <text x="600" y="76" text-anchor="middle" class="title">Language modelling head and weight tying</text>
  <text x="600" y="108" text-anchor="middle" class="subtitle">One learned vocabulary table can be used twice: lookup on input, classifier on output.</text>

  <text x="84" y="160" class="section">INPUT SIDE: TOKEN ID TO VECTOR</text>

  <rect x="80" y="190" width="205" height="92" rx="14" class="box"/>
  <text x="182" y="226" text-anchor="middle" class="label">Token IDs</text>
  <text x="182" y="256" text-anchor="middle" class="body">[2, 3, 5, 1]</text>

  <rect x="390" y="174" width="250" height="124" rx="14" class="teal"/>
  <text x="515" y="210" text-anchor="middle" class="label">Embedding table E</text>
  <text x="515" y="238" text-anchor="middle" class="body">shape |V| x d</text>
  <rect x="440" y="258" width="150" height="14" fill="#c5e3e8" stroke="#1e6572"/>
  <rect x="440" y="272" width="150" height="14" fill="#d9eef1" stroke="#1e6572"/>
  <rect x="440" y="286" width="150" height="14" fill="#c5e3e8" stroke="#1e6572"/>

  <rect x="745" y="190" width="205" height="92" rx="14" class="box"/>
  <text x="848" y="226" text-anchor="middle" class="label">Input vectors</text>
  <text x="848" y="256" text-anchor="middle" class="body">rows from E</text>

  <line x1="285" y1="236" x2="376" y2="236" class="arrow"/>
  <text x="330" y="222" text-anchor="middle" class="small">gather rows</text>
  <line x1="640" y1="236" x2="731" y2="236" class="arrow"/>

  <rect x="80" y="354" width="1070" height="1.6" fill="#d7c895"/>

  <text x="84" y="390" class="section">OUTPUT SIDE</text>

  <rect x="80" y="456" width="205" height="96" rx="14" class="blue"/>
  <text x="182" y="492" text-anchor="middle" class="label">Final hidden h</text>
  <text x="182" y="522" text-anchor="middle" class="body">shape 1 x d</text>

  <rect x="390" y="440" width="250" height="128" rx="14" class="rose"/>
  <text x="515" y="474" text-anchor="middle" class="label">LM head U</text>
  <text x="515" y="502" text-anchor="middle" class="body">shape d x |V|</text>
  <text x="515" y="532" text-anchor="middle" class="body">tied: U = E<tspan baseline-shift="super" font-size="13">T</tspan></text>

  <rect x="745" y="456" width="205" height="96" rx="14" class="box"/>
  <text x="848" y="492" text-anchor="middle" class="label">Logits u</text>
  <text x="848" y="522" text-anchor="middle" class="body">1 score per token</text>

  <rect x="990" y="430" width="130" height="148" rx="14" class="gold"/>
  <text x="1055" y="464" text-anchor="middle" class="label">Softmax</text>
  <text x="1055" y="492" text-anchor="middle" class="small">probabilities</text>
  <rect x="1020" y="516" width="38" height="13" fill="#f2ccd2" stroke="#914252"/>
  <rect x="1020" y="538" width="62" height="13" fill="#f2ccd2" stroke="#914252"/>
  <rect x="1020" y="560" width="86" height="13" fill="#d84c62" stroke="#914252"/>

  <line x1="285" y1="504" x2="376" y2="504" class="arrow"/>
  <text x="330" y="490" text-anchor="middle" class="small">multiply</text>
  <line x1="640" y1="504" x2="731" y2="504" class="arrow"/>
  <text x="692" y="490" text-anchor="middle" class="small">h x U</text>
  <line x1="950" y1="504" x2="976" y2="504" class="arrow"/>

  <path d="M 515 302 L 515 426" class="tie"/>
  <rect x="658" y="331" width="365" height="50" rx="10" fill="#fff8dc" stroke="#c5b47c" stroke-width="1.6"/>
  <text x="840" y="354" text-anchor="middle" class="small">Weight tying reuses the same learned numbers.</text>
  <text x="840" y="374" text-anchor="middle" class="small">Untied model learns a separate output matrix W<tspan baseline-shift="sub" font-size="11">out</tspan>.</text>

  <rect x="290" y="630" width="620" height="58" rx="12" fill="#ffffff" stroke="#c5b47c" stroke-width="1.8"/>
  <text x="600" y="654" text-anchor="middle" class="body">Tying saves one |V| x d matrix.</text>
  <text x="600" y="678" text-anchor="middle" class="body">Untying costs more parameters but gives the output classifier more freedom.</text>
</svg>
