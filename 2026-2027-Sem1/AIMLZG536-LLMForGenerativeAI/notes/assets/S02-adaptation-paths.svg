<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Adaptation paths after pretraining</title>
  <desc id="desc">A decision-style diagram comparing continued pretraining, retraining on combined data, and domain-specific training from scratch.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .panel { fill: #fffef9; stroke: #ccbfa0; stroke-width: 2; rx: 18; }
      .start { fill: #f8efe1; stroke: #b47c2a; stroke-width: 2; rx: 16; }
      .safe { fill: #eaf4e8; stroke: #5d8a47; stroke-width: 2; rx: 16; }
      .warn { fill: #eef3fb; stroke: #4e78a6; stroke-width: 2; rx: 16; }
      .cost { fill: #f8e9ef; stroke: #9a5572; stroke-width: 2; rx: 16; }
      .text { font-family: Arial, sans-serif; fill: #2a2418; font-size: 18px; }
      .small { font-size: 15px; }
      .label { font-size: 21px; font-weight: 700; }
      .arrow { stroke: #6b5327; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b5327"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="400"/>
  <rect class="panel" x="24" y="24" width="912" height="352"/>

  <rect class="start" x="364" y="48" width="232" height="78"/>
  <text class="text label" x="480" y="82" text-anchor="middle">Starting Point</text>
  <text class="text small" x="480" y="108" text-anchor="middle">Do we already have a good pretrained checkpoint?</text>

  <rect class="warn" x="58" y="186" width="250" height="112"/>
  <text class="text label" x="183" y="220" text-anchor="middle">Retrain on D1 union D2</text>
  <text class="text small" x="183" y="248" text-anchor="middle">best preservation of both domains</text>
  <text class="text small" x="183" y="272" text-anchor="middle">but you pay full pretraining cost again</text>

  <rect class="safe" x="354" y="186" width="252" height="112"/>
  <text class="text label" x="480" y="220" text-anchor="middle">Continued Pretraining</text>
  <text class="text small" x="480" y="248" text-anchor="middle">cheapest practical path</text>
  <text class="text small" x="480" y="272" text-anchor="middle">main risk: catastrophic forgetting</text>

  <rect class="cost" x="654" y="186" width="248" height="112"/>
  <text class="text label" x="778" y="220" text-anchor="middle">Domain-Specific Scratch</text>
  <text class="text small" x="778" y="248" text-anchor="middle">full control over a narrow corpus</text>
  <text class="text small" x="778" y="272" text-anchor="middle">but no inherited general knowledge</text>

  <path class="arrow" d="M430 126 C380 154, 280 166, 216 186"/>
  <path class="arrow" d="M480 126 V186"/>
  <path class="arrow" d="M530 126 C580 154, 680 166, 746 186"/>

  <text class="text small" x="166" y="164">No checkpoint, need both domains strong</text>
  <text class="text small" x="498" y="164">Have checkpoint already</text>
  <text class="text small" x="756" y="164">No checkpoint, domain is narrow</text>

  <text class="text" x="52" y="336">This is the adaptation choice the deck keeps returning to: preserve, extend, or rebuild.</text>
</svg>
