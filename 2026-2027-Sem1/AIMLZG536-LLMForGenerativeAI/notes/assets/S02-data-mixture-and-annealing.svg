<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Data mixture and annealing</title>
  <desc id="desc">A left-to-right flow from raw corpora to global mixture, stage-wise reweighting, and final annealing on a tiny high-quality subset.</desc>
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .panel { fill: #fffdf8; stroke: #d8c7a5; stroke-width: 2; rx: 18; }
      .box1 { fill: #f7efe0; stroke: #b07d2f; stroke-width: 2; rx: 16; }
      .box2 { fill: #eef6ea; stroke: #5f8a48; stroke-width: 2; rx: 16; }
      .box3 { fill: #eaf2fb; stroke: #4e78a7; stroke-width: 2; rx: 16; }
      .box4 { fill: #f8eaf0; stroke: #9a5572; stroke-width: 2; rx: 16; }
      .text { font-family: Arial, sans-serif; fill: #2a2418; font-size: 18px; }
      .small { font-size: 15px; }
      .label { font-size: 21px; font-weight: 700; }
      .arrow { stroke: #745421; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#745421"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="360"/>
  <rect class="panel" x="24" y="24" width="912" height="312"/>

  <rect class="box1" x="44" y="96" width="180" height="132"/>
  <text class="text label" x="134" y="128" text-anchor="middle">Raw Sources</text>
  <text class="text small" x="134" y="158" text-anchor="middle">web</text>
  <text class="text small" x="134" y="180" text-anchor="middle">books</text>
  <text class="text small" x="134" y="202" text-anchor="middle">code</text>
  <text class="text small" x="134" y="224" text-anchor="middle">academic + dialogue</text>

  <rect class="box2" x="270" y="78" width="180" height="168"/>
  <text class="text label" x="360" y="112" text-anchor="middle">Global Mixture</text>
  <text class="text small" x="360" y="145" text-anchor="middle">set the overall recipe</text>
  <text class="text small" x="360" y="175" text-anchor="middle">example:</text>
  <text class="text small" x="360" y="199" text-anchor="middle">40% web, 20% code,</text>
  <text class="text small" x="360" y="223" text-anchor="middle">20% books, 20% others</text>

  <rect class="box3" x="496" y="78" width="190" height="168"/>
  <text class="text label" x="591" y="112" text-anchor="middle">Stage Reweighting</text>
  <text class="text small" x="591" y="145" text-anchor="middle">change proportions by phase</text>
  <text class="text small" x="591" y="176" text-anchor="middle">more stability early</text>
  <text class="text small" x="591" y="200" text-anchor="middle">more useful data later</text>
  <text class="text small" x="591" y="224" text-anchor="middle">Llama 3: data annealing setup</text>

  <rect class="box4" x="732" y="78" width="180" height="168"/>
  <text class="text label" x="822" y="112" text-anchor="middle">Final Annealing</text>
  <text class="text small" x="822" y="145" text-anchor="middle">tiny high-quality subset</text>
  <text class="text small" x="822" y="176" text-anchor="middle">learning rate decays</text>
  <text class="text small" x="822" y="200" text-anchor="middle">quality improves at the end</text>
  <text class="text small" x="822" y="224" text-anchor="middle">best payoff on smaller models</text>

  <path class="arrow" d="M224 162 H270"/>
  <path class="arrow" d="M450 162 H496"/>
  <path class="arrow" d="M686 162 H732"/>

  <text class="text" x="44" y="62">The deck's core picture: data choice is not one decision, but a sequence of narrower decisions ending in a deliberately tiny high-quality finish.</text>
</svg>
