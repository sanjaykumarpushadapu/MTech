<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only LLM forward pass loop</title>
  <desc id="desc">A decoder-only LLM turns text into token IDs, embeddings, transformer blocks, final hidden states, LM-head probabilities, then samples and appends the next token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b4b9d"/>
    </marker>
  </defs>
  <rect width="1320" height="760" fill="#fff"/>
  <text x="660" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">One Forward Pass, Then Append and Repeat</text>
  <g font-family="Georgia, serif" font-size="20" text-anchor="middle">
    <rect x="70" y="150" width="150" height="70" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="145" y="192">text</text>
    <rect x="270" y="130" width="170" height="110" rx="12" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="355" y="174" font-weight="700">tokenizer</text>
    <text x="355" y="204" font-size="17">sec 12</text>
    <rect x="490" y="150" width="165" height="70" rx="12" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="572" y="192">token IDs</text>
    <rect x="705" y="130" width="205" height="110" rx="12" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="808" y="172" font-weight="700">embeddings</text>
    <text x="808" y="202" font-size="17">token + position</text>
    <rect x="960" y="120" width="260" height="130" rx="12" fill="#edf5fa" stroke="#00a2df" stroke-width="3"/>
    <text x="1090" y="162" font-weight="700">N x transformer block</text>
    <text x="1090" y="194" font-size="17">attention + FFN</text>
    <text x="1090" y="222" font-size="17">sec 4-6</text>
    <line x1="220" y1="185" x2="270" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="440" y1="185" x2="490" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="655" y1="185" x2="705" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="910" y1="185" x2="960" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, serif" font-size="20" text-anchor="middle">
    <rect x="960" y="360" width="260" height="80" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="1090" y="392" font-weight="700">final hidden state</text>
    <text x="1090" y="418" font-size="17">last position</text>
    <rect x="705" y="345" width="205" height="110" rx="12" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="808" y="388" font-weight="700">LM head</text>
    <text x="808" y="418" font-size="17">unembedding</text>
    <rect x="430" y="345" width="225" height="110" rx="12" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="542" y="382" font-weight="700">vocabulary</text>
    <text x="542" y="410" font-size="17">probabilities</text>
    <text x="542" y="436" font-size="17">P(next token)</text>
    <rect x="160" y="345" width="205" height="110" rx="12" fill="#f4e6ff" stroke="#222" stroke-width="2"/>
    <text x="262" y="388" font-weight="700">sample token</text>
    <text x="262" y="418" font-size="17">append to IDs</text>
    <line x1="1090" y1="250" x2="1090" y2="360" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="960" y1="400" x2="910" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="705" y1="400" x2="655" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="430" y1="400" x2="365" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 262 345 C 262 280, 572 280, 572 220" fill="none" stroke="#7b4b9d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#dashArrow)"/>
  </g>
  <rect x="110" y="590" width="1100" height="80" rx="10" fill="#f7f1fb" stroke="#c8b3d8" stroke-width="2"/>
  <text x="660" y="624" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic">
    One pass predicts one next-token distribution.
  </text>
  <text x="660" y="654" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic">
    Generation is the dashed loop: sample, append, run the model again.
  </text>
</svg>
