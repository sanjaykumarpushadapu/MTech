<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Language AI and language models</title>
  <desc id="desc">Language AI uses text as input. A language-model backbone can support generation, embeddings, or classification through different output heads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263247"/>
    </marker>
    <style>
      .title { font: 700 36px Georgia, serif; fill: #182033; }
      .subtitle { font: 20px Georgia, serif; fill: #4c5870; }
      .h { font: 700 24px Georgia, serif; fill: #182033; }
      .body { font: 18px Georgia, serif; fill: #273349; }
      .small { font: 15px Georgia, serif; fill: #4d5a6d; }
      .tiny { font: 13px Georgia, serif; fill: #526074; }
      .shell { fill: #fffaf0; stroke: #c6a14d; stroke-width: 2.4; }
      .card { fill: #ffffff; stroke: #2c3448; stroke-width: 2.2; }
      .model { fill: #fff1bf; stroke: #9f7820; stroke-width: 2.6; }
      .gen { fill: #f8e4e9; stroke: #9b4357; stroke-width: 2.4; }
      .emb { fill: #e4f4ee; stroke: #30734d; stroke-width: 2.4; }
      .cls { fill: #e7f0ff; stroke: #3869ad; stroke-width: 2.4; }
      .note { fill: #edf2f7; stroke: #b9c6d4; stroke-width: 1.8; }
      .arrow { stroke: #263247; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#fffdf8"/>

  <text x="640" y="58" text-anchor="middle" class="title">Language AI and Language Models</text>
  <text x="640" y="92" text-anchor="middle" class="subtitle">One text backbone can be used for understanding, representation, or generation.</text>

  <rect x="52" y="126" width="1176" height="506" rx="26" class="shell"/>
  <text x="92" y="166" class="h">Language AI / NLP</text>
  <text x="92" y="194" class="small">Systems that process human language as data.</text>

  <rect x="94" y="262" width="210" height="136" rx="18" class="card"/>
  <text x="199" y="303" text-anchor="middle" class="h">Text input</text>
  <text x="199" y="334" text-anchor="middle" class="body">document</text>
  <text x="199" y="360" text-anchor="middle" class="body">prompt</text>
  <text x="199" y="386" text-anchor="middle" class="body">conversation</text>

  <line x1="304" y1="330" x2="418" y2="330" class="arrow"/>

  <rect x="418" y="230" width="342" height="200" rx="24" class="model"/>
  <text x="589" y="274" text-anchor="middle" class="h">Language model</text>
  <text x="589" y="306" text-anchor="middle" class="body">learns patterns in text</text>
  <text x="589" y="334" text-anchor="middle" class="body">scores likely continuations</text>
  <rect x="474" y="366" width="230" height="38" rx="19" fill="#fff8df" stroke="#9f7820" stroke-width="1.6"/>
  <text x="589" y="390" text-anchor="middle" class="small">P(next token | context)</text>

  <path d="M 760 330 L 848 330 L 848 214 L 900 214" class="arrow"/>
  <path d="M 760 330 L 900 330" class="arrow"/>
  <path d="M 760 330 L 848 330 L 848 446 L 900 446" class="arrow"/>

  <rect x="896" y="164" width="270" height="100" rx="18" class="gen"/>
  <text x="1031" y="200" text-anchor="middle" class="h">NLG output</text>
  <text x="1031" y="230" text-anchor="middle" class="body">new text, code, answer</text>

  <rect x="896" y="280" width="270" height="100" rx="18" class="emb"/>
  <text x="1031" y="316" text-anchor="middle" class="h">Embedding output</text>
  <text x="1031" y="346" text-anchor="middle" class="body">vector for search/retrieval</text>

  <rect x="896" y="396" width="270" height="100" rx="18" class="cls"/>
  <text x="1031" y="432" text-anchor="middle" class="h">NLU output</text>
  <text x="1031" y="462" text-anchor="middle" class="body">label, intent, entity</text>

  <rect x="130" y="534" width="1020" height="62" rx="16" class="note"/>
  <text x="640" y="560" text-anchor="middle" class="body">In this course, the main path is NLG: the LM head converts hidden vectors into next-token probabilities.</text>
  <text x="640" y="586" text-anchor="middle" class="small">The same backbone idea also explains embedding models and classifiers.</text>

  <text x="94" y="690" class="tiny">Read left to right: text enters a language model; the output head decides whether the product generates, embeds, or classifies.</text>
</svg>
