<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
  <title id="title">Llama 3's three-stage pretraining pipeline</title>
  <desc id="desc">Stage one is initial pretraining across three phases of increasing batch size and sequence length for stability. Stage two extends context length gradually across six stages from 8K to 128K tokens using about 800 billion tokens. Stage three anneals on a small, ultra-high-quality data subset while decaying the learning rate to zero.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="920" fill="#fff"/>
  <text x="500" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700">Llama 3: Three-Stage Pretraining</text>

  <!-- Stage 1 -->
  <rect x="60" y="80" width="880" height="250" rx="16" fill="#fff7c8" stroke="#222" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700">Stage 1 &#183; Initial pre-training — stability through gradual scaling</text>

  <g font-family="Georgia, serif" font-size="16">
    <rect x="100" y="140" width="250" height="90" rx="10" fill="#fffdf0" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="225" y="165" text-anchor="middle" font-weight="700">Phase 1</text>
    <text x="225" y="188" text-anchor="middle">4M-token batch</text>
    <text x="225" y="208" text-anchor="middle">4,096 seq length</text>

    <rect x="375" y="140" width="250" height="90" rx="10" fill="#fffdf0" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="500" y="165" text-anchor="middle" font-weight="700">Phase 2</text>
    <text x="500" y="188" text-anchor="middle">8M-token batch</text>
    <text x="500" y="208" text-anchor="middle">8,192 seq length</text>

    <rect x="650" y="140" width="250" height="90" rx="10" fill="#fffdf0" stroke="#8a6d00" stroke-width="1.5"/>
    <text x="775" y="165" text-anchor="middle" font-weight="700">Phase 3</text>
    <text x="775" y="188" text-anchor="middle">16M-token batch</text>
    <text x="775" y="208" text-anchor="middle">8,192 seq length</text>

    <line x1="350" y1="185" x2="375" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="625" y1="185" x2="650" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic">early stability &#8594; scaling up &#8594; final throughput</text>
  <text x="500" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="15">Standard AdamW optimizer throughout — not a more aggressive alternative</text>
  <text x="500" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="15">(again favouring stability over raw speed)</text>

  <line x1="500" y1="330" x2="500" y2="380" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="60" y="385" width="880" height="180" rx="16" fill="#e8eefc" stroke="#222" stroke-width="2"/>
  <text x="500" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700">Stage 2 &#183; Long-context pre-training</text>
  <text x="500" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="17">Context length grows gradually across six stages</text>
  <text x="500" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700">8,192 tokens &#8594; 128,000 tokens</text>
  <text x="500" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic">using approximately 800 billion training tokens</text>
  <text x="500" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic">dedicated specifically to this extension</text>

  <line x1="500" y1="565" x2="500" y2="615" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="60" y="620" width="880" height="270" rx="16" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
  <text x="500" y="655" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700">Stage 3 &#183; Annealing</text>
  <text x="500" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="17">Train on a small, ultra-high-quality subset</text>
  <text x="500" y="714" text-anchor="middle" font-family="Georgia, serif" font-size="17">while decaying the learning rate toward zero</text>

  <line x1="120" y1="735" x2="880" y2="735" stroke="#999" stroke-width="1"/>

  <text x="500" y="765" text-anchor="middle" font-family="Georgia, serif" font-size="16">Annealing dataset: 40B tokens (0.02% of total) — used partly just to assess quality</text>
  <text x="500" y="792" text-anchor="middle" font-family="Georgia, serif" font-size="16">Actual annealing trained on only 40M tokens (0.1% of that 40B subset)</text>

  <line x1="120" y1="812" x2="880" y2="812" stroke="#999" stroke-width="1"/>

  <text x="500" y="842" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">Improved the 8B model measurably —</text>
  <text x="500" y="866" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">improvement on the 405B model was negligible</text>
</svg>
