<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Emergent abilities: a sharp jump, or a metric artifact</title>
  <desc id="desc">On an all-or-nothing metric, task performance stays near random until a scale threshold then jumps sharply, looking like a genuinely emergent ability. On a partial-credit metric measuring the same underlying model, performance instead rises smoothly with scale, suggesting the sharp jump may be an artifact of the chosen metric rather than a fundamental property of scaling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fff"/>
  <text x="600" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700">Emergent Ability, or Metric Artifact?</text>

  <rect x="60" y="80" width="1080" height="360" rx="14" fill="#fff" stroke="#222" stroke-width="2"/>

  <line x1="130" y1="390" x2="1080" y2="390" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="390" x2="130" y2="110" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="605" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="17">model scale &#8594;</text>
  <text x="100" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="17" transform="rotate(-90 100 250)">task performance &#8594;</text>

  <path d="M 150 380 L 550 378 C 620 375 640 130 700 128 L 1050 126" fill="none" stroke="#c0392b" stroke-width="4"/>
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c0392b" font-weight="700">all-or-nothing metric:</text>
  <text x="450" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c0392b">looks like a sharp, unpredictable jump</text>

  <path d="M 150 380 C 400 350 700 220 1050 130" fill="none" stroke="#2a6bb0" stroke-width="4" stroke-dasharray="9 6"/>
  <text x="820" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2a6bb0" font-weight="700">partial-credit metric:</text>
  <text x="820" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#2a6bb0">same model, smooth rise underneath</text>

  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic">Sharpness + unpredictability define "emergent" — but Schaeffer et al. (2023) show the sharpness</text>
  <text x="600" y="505" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic">can evaporate under a different metric on the exact same model.</text>
</svg>
