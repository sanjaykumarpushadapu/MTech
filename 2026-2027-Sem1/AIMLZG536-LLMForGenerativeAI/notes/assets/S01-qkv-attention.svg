<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Q, K, V attention worked step</title>
  <desc id="desc">Query, key, and value vectors form attention scores, softmax weights, and a weighted sum output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <text x="750" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="54" font-weight="700">The three vectors</text>
  <g font-family="Georgia, serif">
    <rect x="60" y="88" width="48" height="48" rx="7" fill="#fff6ef" stroke="#e2623a" stroke-width="2"/>
    <text x="84" y="121" text-anchor="middle" font-size="28" font-weight="700" fill="#9d3b24">Q</text>
    <text x="128" y="121" font-size="24" font-weight="700" fill="#9d3b24">Query</text>
    <text x="240" y="121" font-size="23">"What am I looking for?"</text>
    <text x="520" y="121" font-size="23" font-style="italic" fill="#666">current token asking a question</text>
    <rect x="60" y="150" width="48" height="48" rx="7" fill="#fff7e6" stroke="#ce8a2b" stroke-width="2"/>
    <text x="84" y="183" text-anchor="middle" font-size="28" font-weight="700" fill="#8b5a15">K</text>
    <text x="128" y="183" font-size="24" font-weight="700" fill="#8b5a15">Key</text>
    <text x="240" y="183" font-size="23">"What do I contain?"</text>
    <text x="520" y="183" font-size="23" font-style="italic" fill="#666">past tokens advertising relevance</text>
    <rect x="60" y="212" width="48" height="48" rx="7" fill="#eff7ff" stroke="#2f80d2" stroke-width="2"/>
    <text x="84" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#1c62a6">V</text>
    <text x="128" y="245" font-size="24" font-weight="700" fill="#1c62a6">Value</text>
    <text x="240" y="245" font-size="23">"What do I contribute?"</text>
    <text x="520" y="245" font-size="23" font-style="italic" fill="#666">content pulled once relevance is decided</text>
  </g>
  <line x1="42" y1="286" x2="1458" y2="286" stroke="#ddd" stroke-width="2"/>

  <text x="42" y="332" font-family="Georgia, serif" font-size="28" font-weight="700">A worked step</text>
  <rect x="210" y="350" width="230" height="44" rx="22" fill="#fff1ea" stroke="#e2623a" stroke-width="2"/>
  <text x="325" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="23">new token "mat"</text>
  <g font-family="Georgia, serif" font-size="21" text-anchor="middle">
    <rect x="250" y="420" width="42" height="42" rx="6" fill="#fff6ef" stroke="#e2623a" stroke-width="2"/><text x="271" y="448">Q</text>
    <rect x="324" y="420" width="42" height="42" rx="6" fill="#fff7e6" stroke="#ce8a2b" stroke-width="2"/><text x="345" y="448">K</text>
    <rect x="398" y="420" width="42" height="42" rx="6" fill="#eff7ff" stroke="#2f80d2" stroke-width="2"/><text x="419" y="448">V</text>
  </g>
  <line x1="345" y1="462" x2="345" y2="490" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Georgia, serif" font-size="22">
    <rect x="120" y="490" width="450" height="38" rx="4" fill="#f6f4ef" stroke="#ccc"/><text x="140" y="516">1</text><text x="190" y="516" font-weight="700">Q · Kᵀ</text><text x="280" y="516">→ attention scores</text>
    <rect x="120" y="538" width="450" height="38" rx="4" fill="#f6f4ef" stroke="#ccc"/><text x="140" y="564">2</text><text x="190" y="564" font-weight="700">softmax</text><text x="300" y="564">→ attention weights</text>
    <rect x="120" y="586" width="450" height="38" rx="4" fill="#f6f4ef" stroke="#ccc"/><text x="140" y="612">3</text><text x="190" y="612" font-weight="700">weights × V</text><text x="342" y="612">→ weighted sum</text>
  </g>
  <line x1="345" y1="528" x2="345" y2="538" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="576" x2="345" y2="586" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="650" width="520" height="38" rx="19" fill="#e4f7ef" stroke="#00a374" stroke-width="2"/>
  <text x="360" y="675" text-anchor="middle" font-family="Georgia, serif" font-size="22">
    Output · context-aware representation of "mat"
  </text>
  <rect x="780" y="352" width="610" height="58" fill="#f7f3ec"/>
  <text x="1085" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic">Attention(Q,K,V) = softmax(QKᵀ/√dₖ) V</text>
  <rect x="780" y="438" width="145" height="50" fill="#f3dede"/>
  <text x="852" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#9d3b24">Q · Kᵀ</text>
  <text x="955" y="466" font-family="Georgia, serif" font-size="27">dot product: how similar is the query</text>
  <text x="955" y="500" font-family="Georgia, serif" font-size="27">to each key?</text>
  <rect x="780" y="528" width="145" height="50" fill="#edeadf"/>
  <text x="852" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700">√dₖ</text>
  <text x="955" y="558" font-family="Georgia, serif" font-size="27">scale: keeps scores from blowing up</text>
  <text x="955" y="592" font-family="Georgia, serif" font-size="27">and destabilising softmax</text>
  <rect x="780" y="642" width="145" height="50" fill="#d8e8fb"/>
  <text x="852" y="676" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1c62a6">· V</text>
  <text x="955" y="672" font-family="Georgia, serif" font-size="27">weighted sum: blend the values by</text>
  <text x="955" y="706" font-family="Georgia, serif" font-size="27">how much attention each token deserves</text>
</svg>
