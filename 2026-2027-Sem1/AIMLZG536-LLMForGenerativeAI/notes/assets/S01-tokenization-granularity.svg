<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">Tokenization granularities</title>
  <desc id="desc">Word, subword, character, and byte tokenization trade vocabulary size against sequence length and out-of-vocabulary robustness.</desc>
  <rect width="1260" height="760" fill="#fff"/>
  <text x="630" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">Four Ways to Break Text Into Tokens</text>
  <text x="630" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="23">Text: Have the musical bards who preceded...</text>
  <g font-family="Georgia, serif" font-size="20">
    <rect x="80" y="150" width="1100" height="100" rx="14" fill="#fde8f1" stroke="#222" stroke-width="2"/>
    <text x="120" y="185" font-size="25" font-weight="700">Word tokens</text>
    <text x="120" y="222">Have | the | musical | bards | who | preceded</text>
    <text x="860" y="185" text-anchor="middle">huge vocabulary</text>
    <text x="860" y="222" text-anchor="middle">fails on new words</text>
    <rect x="80" y="285" width="1100" height="100" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="120" y="320" font-size="25" font-weight="700">Subword tokens</text>
    <text x="120" y="357">Have | the | music | al | bard | s | who | preced | ed</text>
    <text x="860" y="320" text-anchor="middle">moderate vocabulary</text>
    <text x="860" y="357" text-anchor="middle">standard LLM choice</text>
    <rect x="80" y="420" width="1100" height="100" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="120" y="455" font-size="25" font-weight="700">Character tokens</text>
    <text x="120" y="492">H | a | v | e | t | h | e | m | u | s | i | c | a | l ...</text>
    <text x="860" y="455" text-anchor="middle">tiny vocabulary</text>
    <text x="860" y="492" text-anchor="middle">very long sequences</text>
    <rect x="80" y="555" width="1100" height="100" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="120" y="590" font-size="25" font-weight="700">Byte tokens</text>
    <text x="120" y="627">UTF-8 bytes, 256-entry vocabulary; any text can be represented</text>
    <text x="860" y="590" text-anchor="middle">no OOV ever</text>
    <text x="860" y="627" text-anchor="middle">longest sequences</text>
  </g>
  <text x="630" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-style="italic">
    Smaller vocabulary usually means longer sequences; attention cost then rises with n squared.
  </text>
</svg>
