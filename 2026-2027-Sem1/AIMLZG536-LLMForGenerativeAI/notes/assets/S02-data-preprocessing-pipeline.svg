<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" role="img" aria-labelledby="title desc">
  <title id="title">Pretraining data preprocessing pipeline</title>
  <desc id="desc">Raw crawled text passes through deduplication, quality filtering, and safety filtering, then gets packed with end-of-text tokens into fixed-length training batches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1300" height="520" fill="#fff"/>
  <text x="650" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700">Pretraining Data Preprocessing Pipeline</text>

  <g font-family="Georgia, serif" text-anchor="middle">
    <rect x="60" y="110" width="280" height="120" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="200" y="150" font-size="21" font-weight="700">1. Raw crawled text</text>
    <text x="200" y="177" font-size="15">Common Crawl, web,</text>
    <text x="200" y="200" font-size="15">books, code, academic</text>

    <rect x="400" y="110" width="280" height="120" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="540" y="150" font-size="21" font-weight="700">2. Deduplication</text>
    <text x="540" y="177" font-size="15">remove repeated docs /</text>
    <text x="540" y="200" font-size="15">overlapping n-grams</text>

    <rect x="740" y="110" width="280" height="120" rx="14" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="880" y="150" font-size="21" font-weight="700">3. Quality filtering</text>
    <text x="880" y="177" font-size="15">perplexity filter:</text>
    <text x="880" y="200" font-size="15">keep the middle band</text>

    <line x1="340" y1="170" x2="400" y2="170" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="680" y1="170" x2="740" y2="170" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- snake down: 3 (top right) -> 4 (bottom right) -->
    <line x1="880" y1="230" x2="880" y2="340" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="740" y="340" width="280" height="120" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="880" y="380" font-size="21" font-weight="700">4. Safety filtering</text>
    <text x="880" y="407" font-size="15">toxicity classifiers</text>
    <text x="880" y="430" font-size="15">(dialect-bias caveat)</text>

    <!-- 4 -> 5, leftward -->
    <line x1="740" y1="400" x2="680" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="400" y="340" width="280" height="120" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="540" y="380" font-size="21" font-weight="700">5. Packing</text>
    <text x="540" y="407" font-size="15">concat docs, separated</text>
    <text x="540" y="430" font-size="15">by &lt;|endoftext|&gt;</text>

    <!-- 5 -> 6, leftward -->
    <line x1="400" y1="400" x2="340" y2="400" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="340" width="280" height="120" rx="14" fill="#f4e6ff" stroke="#222" stroke-width="2"/>
    <text x="200" y="380" font-size="21" font-weight="700">6. Training batches</text>
    <text x="200" y="407" font-size="15">fixed-length windows,</text>
    <text x="200" y="430" font-size="15">no wasted padding</text>
  </g>
</svg>
