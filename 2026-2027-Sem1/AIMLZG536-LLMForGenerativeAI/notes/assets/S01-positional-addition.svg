<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Token embeddings plus positional embeddings</title>
  <desc id="desc">The same token embedding receives different positional vectors at different positions, and the vectors are added elementwise rather than concatenated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#fff"/>
  <text x="560" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700">Position Is Added to Token Meaning</text>
  <g font-family="Georgia, serif" font-size="21" text-anchor="middle">
    <rect x="90" y="130" width="260" height="70" rx="10" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="220" y="158" font-weight="700">token embedding</text>
    <text x="220" y="184">[1, 1, 1]</text>
    <rect x="90" y="275" width="260" height="70" rx="10" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="220" y="303" font-weight="700">positional emb, pos 0</text>
    <text x="220" y="329">[1.1, 1.2, 1.3]</text>
    <circle cx="430" cy="235" r="28" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="430" y="243" font-size="30" font-weight="700">+</text>
    <rect x="505" y="200" width="260" height="70" rx="10" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="635" y="228" font-weight="700">input embedding</text>
    <text x="635" y="254">[2.1, 2.2, 2.3]</text>
    <line x1="350" y1="165" x2="407" y2="216" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="350" y1="310" x2="407" y2="254" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="458" y1="235" x2="505" y2="235" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, serif" font-size="21" text-anchor="middle">
    <rect x="90" y="410" width="260" height="70" rx="10" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="220" y="438" font-weight="700">same token embedding</text>
    <text x="220" y="464">[1, 1, 1]</text>
    <rect x="505" y="410" width="260" height="70" rx="10" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="635" y="438" font-weight="700">different input vector</text>
    <text x="635" y="464">[3.1, 3.2, 3.3]</text>
    <rect x="90" y="510" width="260" height="56" rx="10" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="220" y="545">pos 1 adds [2.1, 2.2, 2.3]</text>
    <line x1="350" y1="445" x2="505" y2="445" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text x="920" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700">Addition, not concatenation</text>
  <text x="920" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="21">the vector stays width d</text>
  <text x="920" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="21">position and meaning share capacity</text>
</svg>
