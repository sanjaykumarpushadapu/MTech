<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 480" role="img" aria-labelledby="title desc">
  <title id="title">Three eras of scaling wisdom</title>
  <desc id="desc">Kaplan in 2020 recommended scaling model size faster than data, exemplified by GPT-3. Chinchilla in 2022 recommended scaling both at the same rate at about twenty tokens per parameter, exemplified by Chinchilla 70B. The modern era from 2024 onward overtrains smaller models because inference cost dominates at scale, exemplified by Llama 3 8B.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1300" height="480" fill="#fff"/>
  <text x="650" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700">Three Eras of Scaling Wisdom</text>

  <line x1="80" y1="90" x2="1220" y2="90" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1150" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic">time</text>

  <g font-family="Georgia, serif" text-anchor="middle">
    <rect x="60" y="130" width="360" height="300" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="240" y="168" font-size="22" font-weight="700">Kaplan &#183; 2020</text>
    <text x="240" y="200" font-size="16">Scale model faster</text>
    <text x="240" y="222" font-size="16">than data</text>
    <line x1="90" y1="240" x2="390" y2="240" stroke="#999" stroke-width="1"/>
    <text x="240" y="270" font-size="17" font-weight="700">GPT-3</text>
    <text x="240" y="296" font-size="15">175B params</text>
    <text x="240" y="318" font-size="15">300B tokens</text>
    <text x="240" y="344" font-size="14" font-style="italic">~1.7 tokens/param</text>

    <rect x="470" y="130" width="360" height="300" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="650" y="168" font-size="22" font-weight="700">Chinchilla &#183; 2022</text>
    <text x="650" y="200" font-size="16">Scale model AND data</text>
    <text x="650" y="222" font-size="16">at the same rate</text>
    <line x1="500" y1="240" x2="800" y2="240" stroke="#999" stroke-width="1"/>
    <text x="650" y="270" font-size="17" font-weight="700">Chinchilla</text>
    <text x="650" y="296" font-size="15">70B params</text>
    <text x="650" y="318" font-size="15">1.4T tokens</text>
    <text x="650" y="344" font-size="14" font-style="italic">~20 tokens/param</text>

    <rect x="880" y="130" width="360" height="300" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="1060" y="168" font-size="22" font-weight="700">Modern &#183; 2024+</text>
    <text x="1060" y="200" font-size="16">Overtrain a smaller model</text>
    <text x="1060" y="222" font-size="16">— inference cost dominates</text>
    <line x1="910" y1="240" x2="1210" y2="240" stroke="#999" stroke-width="1"/>
    <text x="1060" y="270" font-size="17" font-weight="700">Llama 3 8B</text>
    <text x="1060" y="296" font-size="15">8B params</text>
    <text x="1060" y="318" font-size="15">15T tokens</text>
    <text x="1060" y="344" font-size="14" font-style="italic">~1,875 tokens/param</text>
    <text x="1060" y="366" font-size="14" font-style="italic">(~90&#215; Chinchilla ratio)</text>
  </g>

  <text x="650" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic">New axis on top of all three: test-time compute (o1, DeepSeek-R1) — spend compute at inference too, not just training.</text>
</svg>
