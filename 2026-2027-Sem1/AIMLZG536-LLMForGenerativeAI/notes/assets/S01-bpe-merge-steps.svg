<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="580" viewBox="0 0 1340 580" role="img" aria-labelledby="title desc">
  <title id="title">BPE merges the most frequent pair, every round</title>
  <desc id="desc">Four BPE merge iterations on the corpus hug 10, pug 5, pun 12, bun 4, hugs 5: first ug at count 20, then un at count 16, then hug at count 15, with a callout explaining why h-ug at count 15 does not win the second merge even though it looks obvious.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1340" height="580" fill="#fff"/>
  <text x="670" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700">BPE Merges the Most Frequent Pair — Every Round, Not Just the First</text>
  <text x="670" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="19">corpus: hug×10, pug×5, pun×12, bun×4, hugs×5 — the first four merges</text>

  <g font-family="Georgia, serif" text-anchor="middle">
    <!-- arrows + merge labels, drawn first so cards sit on top -->
    <line x1="320" y1="215" x2="380" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="640" y1="215" x2="700" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="960" y1="215" x2="1020" y2="215" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="350" y="116" font-size="16" font-weight="700">merge (u,g)=20</text>
    <text x="350" y="136" font-size="15">→ new token "ug"</text>
    <text x="670" y="116" font-size="16" font-weight="700">merge (u,n)=16</text>
    <text x="670" y="136" font-size="15">→ new token "un"</text>
    <text x="990" y="116" font-size="16" font-weight="700">merge (h,ug)=15</text>
    <text x="990" y="136" font-size="15">→ new token "hug"</text>

    <!-- card 1 -->
    <rect x="60" y="140" width="260" height="150" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="190" y="177" font-size="22" font-weight="700">Iter 1 — start</text>
    <text x="190" y="207" font-size="16">vocab: b g h n p s u (7)</text>
    <text x="190" y="237" font-size="17" font-style="italic">hug → h · u · g</text>
    <text x="190" y="262" font-size="13">uni-character baseline</text>

    <!-- card 2 -->
    <rect x="380" y="140" width="260" height="150" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="510" y="177" font-size="22" font-weight="700">Iter 2 — +ug</text>
    <text x="510" y="207" font-size="16">vocab grows to 8 tokens</text>
    <text x="510" y="237" font-size="17" font-style="italic">hug → h · ug</text>
    <text x="510" y="262" font-size="13">pug, hugs also gain "ug"</text>

    <!-- card 3 -->
    <rect x="700" y="140" width="260" height="150" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="830" y="177" font-size="22" font-weight="700">Iter 3 — +un</text>
    <text x="830" y="207" font-size="16">vocab grows to 9 tokens</text>
    <text x="830" y="237" font-size="17" font-style="italic">pun → p · un</text>
    <text x="830" y="262" font-size="13">bun also gains "un"</text>

    <!-- card 4 -->
    <rect x="1020" y="140" width="260" height="150" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="1150" y="177" font-size="22" font-weight="700">Iter 4 — +hug</text>
    <text x="1150" y="207" font-size="16">vocab grows to 10 tokens</text>
    <text x="1150" y="237" font-size="17" font-style="italic">hug → hug (done)</text>
    <text x="1150" y="262" font-size="13">hugs → hug · s</text>
  </g>

  <rect x="380" y="330" width="580" height="110" rx="14" fill="#ffe9c7" stroke="#b8860b" stroke-width="2"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="670" y="360" font-size="18" font-weight="700">The trap, between merges 2 and 3</text>
    <text x="670" y="386" font-size="15">Once "ug" exists, (h, ug) = 15 looks like the obvious next merge —</text>
    <text x="670" y="409" font-size="15">but (u, n) = pun(12) + bun(4) = 16 still wins. Recount every pair, every round.</text>
  </g>

  <rect x="110" y="460" width="1120" height="90" rx="10" fill="#f7f1fb" stroke="#c8b3d8" stroke-width="2"/>
  <text x="670" y="494" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic">
    Vocabulary grows by exactly one merged token per round — 7 unigrams become 10 tokens in four merges.
  </text>
  <text x="670" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic">
    The winner each round is whichever pair has the highest count right now — never whichever pair you just created.
  </text>
</svg>
