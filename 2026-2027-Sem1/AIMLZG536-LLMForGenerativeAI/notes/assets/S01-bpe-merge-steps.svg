<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">BPE merge steps</title>
  <desc id="desc">Byte-pair encoding learns a subword vocabulary by repeatedly counting adjacent pairs, merging the most frequent pair, and updating the corpus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263247"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #182033; }
      .sub { font: 18px Georgia, serif; fill: #4e5b70; }
      .h { font: 700 22px Georgia, serif; fill: #182033; }
      .body { font: 18px Georgia, serif; fill: #263247; }
      .small { font: 15px Georgia, serif; fill: #465469; }
      .tiny { font: 13px Georgia, serif; fill: #526074; }
      .box { fill: #ffffff; stroke: #273047; stroke-width: 2.1; }
      .gold { fill: #fff2bf; stroke: #9f7820; stroke-width: 2.2; }
      .blue { fill: #e8f0ff; stroke: #416caf; stroke-width: 2.2; }
      .green { fill: #e7f6ec; stroke: #32744f; stroke-width: 2.2; }
      .warn { fill: #fff1dc; stroke: #b27619; stroke-width: 2.2; }
      .arrow { stroke: #263247; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#fffdf8"/>
  <text x="640" y="56" text-anchor="middle" class="title">Byte-Pair Encoding: Merge the Most Frequent Pair</text>
  <text x="640" y="88" text-anchor="middle" class="sub">Corpus: hug x10, pug x5, pun x12, bun x4, hugs x5</text>

  <rect x="72" y="128" width="1136" height="170" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="164" text-anchor="middle" class="h">The learner loop</text>

  <rect x="112" y="198" width="190" height="60" rx="14" class="box"/>
  <text x="207" y="224" text-anchor="middle" class="body">Start with</text>
  <text x="207" y="248" text-anchor="middle" class="body">characters</text>

  <line x1="302" y1="228" x2="372" y2="228" class="arrow"/>
  <rect x="372" y="198" width="190" height="60" rx="14" class="blue"/>
  <text x="467" y="224" text-anchor="middle" class="body">Count adjacent</text>
  <text x="467" y="248" text-anchor="middle" class="body">pairs</text>

  <line x1="562" y1="228" x2="632" y2="228" class="arrow"/>
  <rect x="632" y="198" width="190" height="60" rx="14" class="gold"/>
  <text x="727" y="224" text-anchor="middle" class="body">Merge highest</text>
  <text x="727" y="248" text-anchor="middle" class="body">count pair</text>

  <line x1="822" y1="228" x2="892" y2="228" class="arrow"/>
  <rect x="892" y="198" width="190" height="60" rx="14" class="green"/>
  <text x="987" y="224" text-anchor="middle" class="body">Update corpus</text>
  <text x="987" y="248" text-anchor="middle" class="body">and repeat</text>

  <path d="M 987 198 C 987 150, 467 150, 467 198" class="arrow" stroke-dasharray="8 8"/>
  <text x="742" y="142" text-anchor="middle" class="tiny">repeat until target vocabulary size</text>

  <rect x="72" y="332" width="1136" height="300" rx="22" class="box"/>
  <text x="640" y="372" text-anchor="middle" class="h">Worked rounds on the corpus</text>

  <g class="body">
    <text x="128" y="424" font-weight="700">Round</text>
    <text x="262" y="424" font-weight="700">Winner</text>
    <text x="456" y="424" font-weight="700">Why it wins</text>
    <text x="846" y="424" font-weight="700">Corpus after merge</text>
  </g>
  <line x1="112" y1="442" x2="1168" y2="442" stroke="#cbd5e1" stroke-width="2"/>

  <g class="body">
    <text x="140" y="480">1</text>
    <text x="260" y="480">u + g -> ug</text>
    <text x="456" y="480">hug(10) + pug(5) + hugs(5) = 20</text>
    <text x="846" y="480">hug -> h ug; pug -> p ug; hugs -> h ug s</text>

    <text x="140" y="530">2</text>
    <text x="260" y="530">u + n -> un</text>
    <text x="456" y="530">pun(12) + bun(4) = 16</text>
    <text x="846" y="530">pun -> p un; bun -> b un</text>

    <text x="140" y="580">3</text>
    <text x="260" y="580">h + ug -> hug</text>
    <text x="456" y="580">hug(10) + hugs(5) = 15</text>
    <text x="846" y="580">hug -> hug; hugs -> hug s</text>
  </g>

  <rect x="218" y="660" width="844" height="62" rx="16" class="warn"/>
  <text x="640" y="686" text-anchor="middle" class="body">Trap: after "ug", h + ug looks tempting, but u + n still wins 16 to 15.</text>
  <text x="640" y="710" text-anchor="middle" class="small">BPE recounts pair frequencies after every merge; it does not just extend the latest token.</text>
</svg>
