<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Self-attention compares tokens with earlier tokens</title>
  <desc id="desc">A causal self-attention matrix compares each token with every earlier token, using darker cells for higher attention and blank cells for masked future tokens.</desc>

  <rect width="1600" height="900" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="150" y="184" text-anchor="middle" font-size="34" fill="#111">My</text>
    <text x="288" y="184" text-anchor="middle" font-size="34" fill="#111">name</text>
    <text x="426" y="184" text-anchor="middle" font-size="34" fill="#111">is</text>
    <text x="564" y="184" text-anchor="middle" font-size="34" fill="#111">Maarten</text>

    <text x="68" y="272" text-anchor="middle" font-size="34" fill="#111">My</text>
    <text x="68" y="410" text-anchor="middle" font-size="34" fill="#111">name</text>
    <text x="68" y="548" text-anchor="middle" font-size="34" fill="#111">is</text>
    <text x="68" y="686" text-anchor="middle" font-size="34" fill="#111">Maarten</text>
  </g>

  <g stroke="#777777" stroke-width="4">
    <rect x="115" y="208" width="138" height="138" fill="#963f40"/>
    <rect x="253" y="208" width="138" height="138" fill="#eeeeee"/>
    <rect x="391" y="208" width="138" height="138" fill="#eeeeee"/>
    <rect x="529" y="208" width="138" height="138" fill="#eeeeee"/>

    <rect x="115" y="346" width="138" height="138" fill="#caa7a7"/>
    <rect x="253" y="346" width="138" height="138" fill="#963f40"/>
    <rect x="391" y="346" width="138" height="138" fill="#eeeeee"/>
    <rect x="529" y="346" width="138" height="138" fill="#eeeeee"/>

    <rect x="115" y="484" width="138" height="138" fill="#f1e8e8"/>
    <rect x="253" y="484" width="138" height="138" fill="#f1e8e8"/>
    <rect x="391" y="484" width="138" height="138" fill="#963f40"/>
    <rect x="529" y="484" width="138" height="138" fill="#eeeeee"/>

    <rect x="115" y="622" width="138" height="138" fill="#f1e8e8"/>
    <rect x="253" y="622" width="138" height="138" fill="#a76767"/>
    <rect x="391" y="622" width="138" height="138" fill="#f1e8e8"/>
    <rect x="529" y="622" width="138" height="138" fill="#963f40"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="870" y="184" text-anchor="middle" font-size="34" fill="#555555">high attention</text>
    <rect x="836" y="210" width="72" height="350" fill="#f1e8e8" stroke="#777777" stroke-width="4" stroke-dasharray="8 10"/>
    <rect x="836" y="210" width="72" height="96" fill="#963f40"/>
    <rect x="836" y="306" width="72" height="86" fill="#caa7a7"/>
    <rect x="836" y="392" width="72" height="78" fill="#f1e8e8"/>
    <rect x="836" y="470" width="72" height="90" fill="#ffffff" opacity="0.82"/>
    <text x="870" y="612" text-anchor="middle" font-size="34" fill="#555555">low attention</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#333333" font-size="31">
    <text x="990" y="210">• Each row = current token.</text>
    <text x="1042" y="260">It attends only to earlier</text>
    <text x="1042" y="306">allowed tokens.</text>

    <text x="990" y="392">• Darker cell = stronger</text>
    <text x="1042" y="438">attention weight.</text>
    <text x="1042" y="484">Future cells are masked.</text>

    <text x="990" y="570">• Training computes the full</text>
    <text x="1042" y="616">matrix in parallel.</text>

    <text x="990" y="700">• That parallelism makes</text>
    <text x="1042" y="746">Transformer training fast.</text>
  </g>

  <rect x="64" y="802" width="1456" height="58" fill="#cfc4dc"/>
  <text x="792" y="840" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#333333">
    Self-attention gives every token a weighted view of the sequence while preserving fast parallel training.
  </text>
</svg>
