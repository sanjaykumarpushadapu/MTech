<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Dense versus sparse MoE routing, worked example</title>
  <desc id="desc">The token "What is 1 + 1 ?" enters a router that scores four experts: Punctuation, Verbs, Conjunctions, Numbers. Only the Numbers expert lights up and processes the token to produce the output 2; the other three experts stay idle for this token, illustrating sparse activation versus a dense layer where all four would run.</desc>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbb"/>
    </marker>
  </defs>
  <rect width="1300" height="560" fill="#fff"/>
  <text x="650" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700">Sparse MoE Routing — "What is 1 + 1 ?"</text>

  <rect x="500" y="70" width="300" height="55" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="650" y="103" text-anchor="middle" font-family="Georgia, serif" font-size="16">token: "1"</text>

  <line x1="650" y1="125" x2="650" y2="160" stroke="#333" stroke-width="2.5" marker-end="url(#arrow5)"/>

  <rect x="500" y="165" width="300" height="60" rx="12" fill="#fff7c8" stroke="#222" stroke-width="2"/>
  <text x="650" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">Router</text>
  <text x="650" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="12">scores every expert, picks top-k</text>

  <!-- four experts -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <line x1="560" y1="225" x2="150" y2="290" stroke="#bbb" stroke-width="2" marker-end="url(#arrowdim)"/>
    <rect x="60" y="295" width="180" height="80" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <text x="150" y="330" font-size="15" fill="#999">Punctuation</text>
    <text x="150" y="352" font-size="12" fill="#999">idle for this token</text>

    <line x1="600" y1="225" x2="420" y2="290" stroke="#bbb" stroke-width="2" marker-end="url(#arrowdim)"/>
    <rect x="330" y="295" width="180" height="80" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <text x="420" y="330" font-size="15" fill="#999">Verbs</text>
    <text x="420" y="352" font-size="12" fill="#999">idle for this token</text>

    <line x1="700" y1="225" x2="880" y2="290" stroke="#bbb" stroke-width="2" marker-end="url(#arrowdim)"/>
    <rect x="790" y="295" width="180" height="80" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <text x="880" y="330" font-size="15" fill="#999">Conjunctions</text>
    <text x="880" y="352" font-size="12" fill="#999">idle for this token</text>

    <line x1="740" y1="225" x2="1150" y2="290" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow5)"/>
    <rect x="1060" y="295" width="180" height="80" rx="12" fill="#e9f7e7" stroke="#1f5fbf" stroke-width="3"/>
    <text x="1150" y="330" font-size="16" font-weight="700" fill="#1f5fbf">Numbers</text>
    <text x="1150" y="352" font-size="12" fill="#1f5fbf">ACTIVE — routed here</text>
  </g>

  <line x1="1150" y1="375" x2="1150" y2="440" stroke="#1f5fbf" stroke-width="3"/>
  <line x1="1150" y1="440" x2="805" y2="470" stroke="#1f5fbf" stroke-width="3" marker-end="url(#arrow5)"/>

  <rect x="500" y="460" width="300" height="55" rx="12" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
  <text x="650" y="493" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">output: "2"</text>

  <text x="650" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic">Only 1 of 4 experts runs (25% active) — a dense layer would have run all four for this one token.</text>
</svg>
