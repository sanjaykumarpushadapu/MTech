<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Cross-entropy loss pipeline</title>
  <desc id="desc">A true token history passes through the model, the model predicts vocabulary probabilities, and cross-entropy scores the probability assigned to the true next token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#263238"/>
    </marker>
    <style>
      .bg{fill:#f7f3e8}.box{fill:#fffdf7;stroke:#b99d63;stroke-width:2;rx:20}.h{fill:#1f3340;font:700 25px Georgia,serif}.t{fill:#40545e;font:500 14px Georgia,serif}.b{fill:#1f3340;font:700 15px Georgia,serif}.arr{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#arrow)}.accent{fill:#f1e5c8;stroke:#b99d63;stroke-width:1.5;rx:14}
    </style>
  </defs>
  <rect class="bg" width="1120" height="420"/>
  <text class="h" x="560" y="48" text-anchor="middle">Cross-entropy asks: how much probability did the model give the true next token?</text>
  <rect class="box" x="45" y="135" width="170" height="100"/>
  <text class="b" x="130" y="170" text-anchor="middle">True history</text>
  <text class="t" x="130" y="198" text-anchor="middle">tokens before t</text>
  <path class="arr" d="M225 185 H300"/>
  <rect class="box" x="310" y="135" width="170" height="100"/>
  <text class="b" x="395" y="170" text-anchor="middle">Forward pass</text>
  <text class="t" x="395" y="198" text-anchor="middle">one prediction</text>
  <path class="arr" d="M490 185 H565"/>
  <rect class="box" x="575" y="125" width="210" height="120"/>
  <text class="b" x="680" y="160" text-anchor="middle">Vocabulary distribution</text>
  <text class="t" x="680" y="188" text-anchor="middle">P(each possible token)</text>
  <rect class="accent" x="620" y="205" width="120" height="28"/>
  <text class="t" x="680" y="225" text-anchor="middle">P(true token)</text>
  <path class="arr" d="M795 185 H870"/>
  <rect class="box" x="880" y="135" width="195" height="100"/>
  <text class="b" x="977" y="170" text-anchor="middle">Loss</text>
  <text class="t" x="977" y="198" text-anchor="middle">-log P(true token)</text>
  <path class="arr" d="M680 250 V305"/>
  <rect class="accent" x="420" y="305" width="520" height="55"/>
  <text class="b" x="680" y="328" text-anchor="middle">Average over all positions in the sequence or batch</text>
  <text class="t" x="680" y="349" text-anchor="middle">low probability for the correct token creates a large penalty</text>
</svg>
