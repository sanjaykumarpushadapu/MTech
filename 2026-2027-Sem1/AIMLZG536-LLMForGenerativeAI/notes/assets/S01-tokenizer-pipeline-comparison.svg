<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">SentencePiece versus tiktoken</title>
  <desc id="desc">A side-by-side comparison showing SentencePiece learning directly from raw Unicode text and tiktoken using regex chunks over bytes.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .panel { fill: #fffef9; stroke: #cdbf9c; stroke-width: 2; rx: 18; }
      .left { fill: #eef7ea; stroke: #5d8a47; stroke-width: 2; rx: 16; }
      .right { fill: #eef4fb; stroke: #4e78a6; stroke-width: 2; rx: 16; }
      .chipL { fill: #dcefd2; stroke: #5d8a47; stroke-width: 1.5; rx: 12; }
      .chipR { fill: #dbe9f8; stroke: #4e78a6; stroke-width: 1.5; rx: 12; }
      .text { font-family: Arial, sans-serif; fill: #25221a; font-size: 18px; }
      .small { font-size: 15px; }
      .label { font-size: 22px; font-weight: 700; }
      .mono { font-family: 'Courier New', monospace; font-size: 16px; fill: #25221a; }
      .arrowL { stroke: #5d8a47; stroke-width: 3; fill: none; marker-end: url(#mL); }
      .arrowR { stroke: #4e78a6; stroke-width: 3; fill: none; marker-end: url(#mR); }
    </style>
    <marker id="mL" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d8a47"/>
    </marker>
    <marker id="mR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4e78a6"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="430"/>
  <rect class="panel" x="20" y="20" width="920" height="390"/>

  <text class="text label" x="240" y="58" text-anchor="middle">SentencePiece</text>
  <text class="text label" x="720" y="58" text-anchor="middle">tiktoken-style byte BPE</text>

  <rect class="left" x="46" y="82" width="388" height="258"/>
  <rect class="right" x="526" y="82" width="388" height="258"/>

  <text class="mono" x="240" y="118" text-anchor="middle">Raw text: "Hello, world!"</text>
  <path class="arrowL" d="M240 132 V158"/>
  <rect class="chipL" x="118" y="164" width="244" height="36"/>
  <text class="mono" x="240" y="187" text-anchor="middle">no regex pre-split</text>
  <path class="arrowL" d="M240 200 V226"/>
  <rect class="chipL" x="92" y="232" width="296" height="44"/>
  <text class="mono" x="240" y="259" text-anchor="middle">whitespace marked: ▁Hello,▁world!</text>
  <path class="arrowL" d="M240 276 V300"/>
  <rect class="chipL" x="80" y="306" width="320" height="36"/>
  <text class="mono" x="240" y="329" text-anchor="middle">tokens: [▁Hello, ,, ▁world, !]</text>

  <text class="mono" x="720" y="118" text-anchor="middle">Raw text: "Hello, world!"</text>
  <path class="arrowR" d="M720 132 V158"/>
  <rect class="chipR" x="594" y="164" width="252" height="36"/>
  <text class="mono" x="720" y="187" text-anchor="middle">regex pretokenize first</text>
  <path class="arrowR" d="M720 200 V226"/>
  <rect class="chipR" x="562" y="232" width="316" height="44"/>
  <text class="mono" x="720" y="259" text-anchor="middle">chunks: [Hello, ,,  world, !]</text>
  <path class="arrowR" d="M720 276 V300"/>
  <rect class="chipR" x="544" y="306" width="352" height="36"/>
  <text class="mono" x="720" y="329" text-anchor="middle">tokens: [Hello, ,, ' world', !]</text>

  <rect class="panel" x="46" y="354" width="868" height="36"/>
  <text class="text small" x="62" y="377">SentencePiece learns directly over Unicode text and marks whitespace explicitly. tiktoken works over bytes, keeps exact reversibility, and usually compresses English and code into fewer tokens.</text>
</svg>
