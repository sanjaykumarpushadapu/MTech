<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 480" role="img" aria-labelledby="title desc">
  <title id="title">LayerNorm versus RMSNorm on the same inputs</title>
  <desc id="desc">The same six layer-output values, mean 17.47 and variance 207.91, normalized two ways: LayerNorm forces mean 0.00 and variance 1.00; RMSNorm skips mean-centering, landing at mean 0.77 but still collapsing variance to 0.41.</desc>
  <rect width="1300" height="480" fill="#fff"/>
  <text x="650" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700">LayerNorm vs RMSNorm: Same Inputs, Two Paths</text>

  <rect x="450" y="75" width="400" height="70" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="650" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">Layer outputs (6 values)</text>
  <text x="650" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="13">mean = 17.47   variance = 207.91</text>

  <line x1="580" y1="145" x2="330" y2="205" stroke="#333" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <line x1="720" y1="145" x2="970" y2="205" stroke="#333" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="60" y="205" width="540" height="220" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
  <text x="330" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700">LayerNorm</text>
  <text x="330" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic">(x - mean) / sqrt(var + eps)</text>
  <text x="90" y="295" font-family="Georgia, serif" font-size="14">mean-centers AND rescales</text>
  <rect x="90" y="310" width="480" height="46" rx="8" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="330" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="14">[-0.82, -0.22, -1.21, 1.21, 1.47, -0.43]</text>
  <text x="330" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">mean = 0.00   variance = 1.00</text>
  <text x="330" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="13">exact targets hit, at the cost of a mean pass</text>

  <rect x="700" y="205" width="540" height="220" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
  <text x="970" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700">RMSNorm</text>
  <text x="970" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic">x / sqrt(mean(x^2) + eps)</text>
  <text x="730" y="295" font-family="Georgia, serif" font-size="14">rescales only — no mean-centering</text>
  <rect x="730" y="310" width="480" height="46" rx="8" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="970" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="14">[0.25, 0.63, 0.00, 1.54, 1.71, 0.50]</text>
  <text x="970" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700">mean = 0.77   variance = 0.41</text>
  <text x="970" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="13">not centered, but scale is controlled — ~7-15% faster</text>

  <text x="650" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic">Both tame the scale (207.91 to ~1); only LayerNorm also forces the mean to exactly zero.</text>
</svg>
