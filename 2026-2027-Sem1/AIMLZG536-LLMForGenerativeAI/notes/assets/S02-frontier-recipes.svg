<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Frontier pretraining recipes</title>
  <desc id="desc">A four-column comparison of Qwen 2, Qwen 3, Gemma 2, and Gemma 4 pretraining strategies.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .panel { fill: #fffef9; stroke: #cdbf9d; stroke-width: 2; rx: 18; }
      .col1 { fill: #f7efe0; stroke: #b07c2e; stroke-width: 2; rx: 16; }
      .col2 { fill: #eaf3fb; stroke: #4e78a7; stroke-width: 2; rx: 16; }
      .col3 { fill: #eef6ea; stroke: #5e8a47; stroke-width: 2; rx: 16; }
      .col4 { fill: #f7eaf0; stroke: #9a5672; stroke-width: 2; rx: 16; }
      .text { font-family: Arial, sans-serif; fill: #2a2418; font-size: 17px; }
      .small { font-size: 14px; }
      .label { font-size: 21px; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="960" height="420"/>
  <rect class="panel" x="20" y="20" width="920" height="380"/>

  <rect class="col1" x="42" y="82" width="202" height="270"/>
  <text class="text label" x="143" y="116" text-anchor="middle">Qwen 2</text>
  <text class="text small" x="143" y="150" text-anchor="middle">self-generated pretraining data</text>
  <text class="text small" x="143" y="178" text-anchor="middle">two stages</text>
  <text class="text small" x="143" y="202" text-anchor="middle">regular pretraining</text>
  <text class="text small" x="143" y="226" text-anchor="middle">then long-context extension</text>
  <text class="text small" x="143" y="266" text-anchor="middle">risk: model blind spots</text>
  <text class="text small" x="143" y="290" text-anchor="middle">can echo into new data</text>

  <rect class="col2" x="268" y="82" width="202" height="270"/>
  <text class="text label" x="369" y="116" text-anchor="middle">Qwen 3</text>
  <text class="text small" x="369" y="150" text-anchor="middle">long-context-weighted corpus</text>
  <text class="text small" x="369" y="178" text-anchor="middle">three stages</text>
  <text class="text small" x="369" y="202" text-anchor="middle">75% very long documents</text>
  <text class="text small" x="369" y="226" text-anchor="middle">25% medium-long documents</text>
  <text class="text small" x="369" y="266" text-anchor="middle">context length becomes</text>
  <text class="text small" x="369" y="290" text-anchor="middle">a data-mix choice too</text>

  <rect class="col3" x="494" y="82" width="202" height="270"/>
  <text class="text label" x="595" y="116" text-anchor="middle">Gemma 2</text>
  <text class="text small" x="595" y="150" text-anchor="middle">smaller models via distillation</text>
  <text class="text small" x="595" y="178" text-anchor="middle">large model trains first</text>
  <text class="text small" x="595" y="202" text-anchor="middle">small siblings learn from it</text>
  <text class="text small" x="595" y="266" text-anchor="middle">best when a strong teacher</text>
  <text class="text small" x="595" y="290" text-anchor="middle">already exists</text>

  <rect class="col4" x="720" y="82" width="202" height="270"/>
  <text class="text label" x="821" y="116" text-anchor="middle">Gemma 4</text>
  <text class="text small" x="821" y="150" text-anchor="middle">multimodal base pretraining</text>
  <text class="text small" x="821" y="178" text-anchor="middle">separate instruction-tuned line</text>
  <text class="text small" x="821" y="202" text-anchor="middle">140 languages</text>
  <text class="text small" x="821" y="226" text-anchor="middle">text, code, math, image, audio</text>
  <text class="text small" x="821" y="266" text-anchor="middle">clear split between</text>
  <text class="text small" x="821" y="290" text-anchor="middle">base capability and chat behavior</text>

  <text class="text" x="42" y="58">The common pattern across labs: the recipe is never "just more data." Each family pushes on a different lever.</text>
</svg>
