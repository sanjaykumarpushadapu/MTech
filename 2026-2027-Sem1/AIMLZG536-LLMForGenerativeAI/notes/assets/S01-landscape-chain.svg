<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">LLM landscape causal chain</title>
  <desc id="desc">Transformer success led to scaling laws, expensive pretraining, adaptation-first workflows, and strategic openness choices.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1280" height="660" fill="#fff"/>
  <text x="640" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">Why the LLM Landscape Looks This Way</text>
  <g font-family="Georgia, serif" font-size="20" text-anchor="middle">
    <rect x="65" y="160" width="180" height="90" rx="14" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="155" y="195" font-weight="700">Transformer</text>
    <text x="155" y="223">2017</text>
    <rect x="290" y="160" width="180" height="90" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="380" y="195" font-weight="700">Scale works</text>
    <text x="380" y="223">predictably</text>
    <rect x="515" y="160" width="210" height="90" rx="14" fill="#fde8f1" stroke="#222" stroke-width="2"/>
    <text x="620" y="195" font-weight="700">Pretraining is</text>
    <text x="620" y="223">capital intensive</text>
    <rect x="770" y="160" width="180" height="90" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="860" y="195" font-weight="700">Most teams</text>
    <text x="860" y="223">adapt models</text>
    <rect x="995" y="160" width="220" height="90" rx="14" fill="#f4e6ff" stroke="#222" stroke-width="2"/>
    <text x="1105" y="195" font-weight="700">536 second half</text>
    <text x="1105" y="223">prompt, RAG, PEFT</text>
    <line x1="245" y1="205" x2="290" y2="205" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="470" y1="205" x2="515" y2="205" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="725" y1="205" x2="770" y2="205" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="950" y1="205" x2="995" y2="205" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, serif" font-size="20" text-anchor="middle">
    <line x1="620" y1="250" x2="620" y2="335" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="460" y="335" width="320" height="70" rx="14" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="620" y="378" font-weight="700">Openness becomes strategy</text>
    <rect x="190" y="475" width="230" height="80" rx="14" fill="#fde8f1" stroke="#222" stroke-width="2"/>
    <text x="305" y="507" font-weight="700">Closed API</text>
    <text x="305" y="533">access only</text>
    <rect x="525" y="475" width="230" height="80" rx="14" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="640" y="507" font-weight="700">Open weights</text>
    <text x="640" y="533">run, not reproduce</text>
    <rect x="860" y="475" width="230" height="80" rx="14" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="975" y="507" font-weight="700">Open source</text>
    <text x="975" y="533">weights + data path</text>
    <line x1="560" y1="405" x2="350" y2="475" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="620" y1="405" x2="640" y2="475" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="680" y1="405" x2="930" y2="475" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
