<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" role="img" aria-labelledby="title desc">
  <title id="title">Regular FFN versus Gated FFN (GLU/SwiGLU)</title>
  <desc id="desc">A regular feed-forward layer runs one path: linear, activation, linear. A gated FFN splits into two parallel paths, a gate path through W and an activation and a value path through V, multiplies them elementwise, then projects with W2. SwiGLU uses Swish as the gate activation.</desc>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1300" height="500" fill="#fff"/>
  <text x="650" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700">Regular FFN vs Gated FFN (SwiGLU)</text>

  <!-- Regular FFN -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="230" y="80" font-size="19" font-weight="700">Regular FFN — one path</text>

    <rect x="120" y="100" width="220" height="46" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="230" y="128" font-size="14">x</text>
    <line x1="230" y1="146" x2="230" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="120" y="175" width="220" height="46" rx="10" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="230" y="203" font-size="14">x W1</text>
    <line x1="230" y1="221" x2="230" y2="245" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="120" y="250" width="220" height="46" rx="10" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="230" y="278" font-size="14">GELU / Swish (act)</text>
    <line x1="230" y1="296" x2="230" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="120" y="325" width="220" height="46" rx="10" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="230" y="353" font-size="14">W2 -&gt; output</text>
  </g>

  <line x1="470" y1="240" x2="470" y2="240" stroke="#333"/>
  <line x1="450" y1="240" x2="450" y2="240" stroke="#333"/>
  <!-- divider -->
  <line x1="480" y1="70" x2="480" y2="440" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Gated FFN -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="900" y="80" font-size="19" font-weight="700">Gated FFN (GLU / SwiGLU) — two paths</text>

    <rect x="800" y="100" width="200" height="42" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <text x="900" y="126" font-size="14">x</text>
    <line x1="850" y1="142" x2="770" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>
    <line x1="950" y1="142" x2="1030" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="650" y="185" width="220" height="46" rx="10" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="760" y="205" font-size="13">gate path: x W</text>
    <text x="760" y="222" font-size="13">then Swish (SwiGLU)</text>

    <rect x="930" y="185" width="220" height="46" rx="10" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="1040" y="205" font-size="13">value path: x V</text>
    <text x="1040" y="222" font-size="13">(no activation)</text>

    <line x1="800" y1="231" x2="880" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>
    <line x1="1000" y1="231" x2="920" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="800" y="275" width="200" height="46" rx="10" fill="#fff7c8" stroke="#222" stroke-width="2"/>
    <text x="900" y="298" font-size="13">elementwise multiply</text>
    <text x="900" y="313" font-size="11">gate (x) value</text>

    <line x1="900" y1="321" x2="900" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="800" y="350" width="200" height="46" rx="10" fill="#f6d3d6" stroke="#222" stroke-width="2"/>
    <text x="900" y="378" font-size="14">W2 -&gt; output</text>
  </g>

  <text x="650" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic">Gate decides "how much" of each dimension passes; value path decides "of what" — two weight matrices instead of one filter.</text>
</svg>
