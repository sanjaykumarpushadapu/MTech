<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">LLM architecture families</title>
  <desc id="desc">Encoder-only, decoder-only, and encoder-decoder transformer families differ by what tokens can see and what objective they optimize.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1260" height="760" fill="#fff"/>
  <text x="630" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">Three Transformer Architecture Families</text>
  <g font-family="Georgia, serif" text-anchor="middle">
    <rect x="60" y="110" width="330" height="490" rx="16" fill="#e8eefc" stroke="#222" stroke-width="2"/>
    <text x="225" y="152" font-size="28" font-weight="700">Encoder-only</text>
    <text x="225" y="184" font-size="20">BERT, RoBERTa</text>
    <rect x="125" y="235" width="200" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="225" y="278" font-size="22">Encoder block</text>
    <line x1="145" y1="365" x2="305" y2="365" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="305" y1="398" x2="145" y2="398" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="225" y="440" font-size="20" font-weight="700">Bidirectional context</text>
    <text x="225" y="478" font-size="19">best for classification</text>
    <text x="225" y="506" font-size="19">NER, sentiment, retrieval</text>
  </g>
  <g font-family="Georgia, serif" text-anchor="middle">
    <rect x="465" y="110" width="330" height="490" rx="16" fill="#fde8f1" stroke="#222" stroke-width="2"/>
    <text x="630" y="152" font-size="28" font-weight="700">Decoder-only</text>
    <text x="630" y="184" font-size="20">GPT, Llama</text>
    <rect x="530" y="235" width="200" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="630" y="278" font-size="22">Decoder block</text>
    <line x1="560" y1="382" x2="700" y2="382" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="630" y="440" font-size="20" font-weight="700">Causal left-to-right</text>
    <text x="630" y="478" font-size="19">best for generation</text>
    <text x="630" y="506" font-size="19">chat, code, completion</text>
  </g>
  <g font-family="Georgia, serif" text-anchor="middle">
    <rect x="870" y="110" width="330" height="490" rx="16" fill="#e9f7e7" stroke="#222" stroke-width="2"/>
    <text x="1035" y="152" font-size="28" font-weight="700">Encoder-decoder</text>
    <text x="1035" y="184" font-size="20">T5, BART</text>
    <rect x="915" y="235" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="980" y="278" font-size="20">Encoder</text>
    <rect x="1065" y="235" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="1130" y="278" font-size="20">Decoder</text>
    <line x1="1045" y1="270" x2="1065" y2="270" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1035" y="440" font-size="20" font-weight="700">Encode input, decode output</text>
    <text x="1035" y="478" font-size="19">best for seq2seq</text>
    <text x="1035" y="506" font-size="19">translation, summarization</text>
  </g>
  <rect x="120" y="650" width="1020" height="58" rx="10" fill="#f7f1fb" stroke="#c8b3d8" stroke-width="2"/>
  <text x="630" y="687" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-style="italic">
    The key question: what is each token allowed to see?
  </text>
</svg>
