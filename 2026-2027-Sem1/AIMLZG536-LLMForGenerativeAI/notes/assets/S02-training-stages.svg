<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Three training stages for an LLM</title>
  <desc id="desc">Pre-training builds raw capability, instruction tuning teaches instruction following, and alignment shapes preference and safety behavior.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#263238"/>
    </marker>
    <style>
      .bg{fill:#f7f3e8}.card{fill:#fffdf7;stroke:#b99d63;stroke-width:2;rx:22}.num{fill:#27465c;font:700 18px Georgia,serif}.h{fill:#1f3340;font:700 24px Georgia,serif}.t{fill:#40545e;font:500 15px Georgia,serif}.arrow{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#arrow)}.tag{fill:#e8f0ed;stroke:#8aa39a;stroke-width:1.5;rx:14}.tagt{fill:#27465c;font:700 14px Georgia,serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="360"/>
  <text class="h" x="560" y="48" text-anchor="middle">LLM capability is built in stages, not in one training pass</text>
  <rect class="card" x="60" y="105" width="270" height="160"/>
  <text class="num" x="85" y="140">1</text>
  <text class="h" x="195" y="140" text-anchor="middle">Pre-training</text>
  <text class="t" x="195" y="176" text-anchor="middle">huge unlabeled corpus</text>
  <text class="t" x="195" y="202" text-anchor="middle">next-token / mask objective</text>
  <rect class="tag" x="112" y="224" width="166" height="34"/>
  <text class="tagt" x="195" y="247" text-anchor="middle">raw capability</text>
  <path class="arrow" d="M340 185 H450"/>
  <rect class="card" x="460" y="105" width="270" height="160"/>
  <text class="num" x="485" y="140">2</text>
  <text class="h" x="595" y="140" text-anchor="middle">Instruction Tuning</text>
  <text class="t" x="595" y="176" text-anchor="middle">instruction to response pairs</text>
  <text class="t" x="595" y="202" text-anchor="middle">same CE shape, narrower data</text>
  <rect class="tag" x="512" y="224" width="166" height="34"/>
  <text class="tagt" x="595" y="247" text-anchor="middle">follows tasks</text>
  <path class="arrow" d="M740 185 H850"/>
  <rect class="card" x="860" y="105" width="220" height="160"/>
  <text class="num" x="885" y="140">3</text>
  <text class="h" x="970" y="140" text-anchor="middle">Alignment</text>
  <text class="t" x="970" y="176" text-anchor="middle">preference data</text>
  <text class="t" x="970" y="202" text-anchor="middle">RLHF / DPO style loss</text>
  <rect class="tag" x="897" y="224" width="146" height="34"/>
  <text class="tagt" x="970" y="247" text-anchor="middle">safer behavior</text>
  <text class="t" x="560" y="315" text-anchor="middle">Session 02 focuses on stage 1; later sessions refine the pretrained base model.</text>
</svg>
