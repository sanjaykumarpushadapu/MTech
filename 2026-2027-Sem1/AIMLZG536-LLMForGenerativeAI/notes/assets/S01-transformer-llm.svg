<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" role="img" aria-labelledby="title desc">
  <title id="title">Transformer LLM components</title>
  <desc id="desc">A prompt enters a Transformer LLM. The model contains a tokenizer, stack of transformer blocks, and LM head, and emits one next token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="dotArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect x="28" y="28" width="1094" height="390" fill="#fff" stroke="#555" stroke-width="2"/>

  <rect x="65" y="65" width="430" height="92" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2.2"/>
  <text x="90" y="98" font-family="Georgia, serif" font-size="22" fill="#111">Write an email apologizing to Sarah</text>
  <text x="90" y="127" font-family="Georgia, serif" font-size="22" fill="#111">for the tragic gardening mishap.</text>

  <line x1="280" y1="157" x2="280" y2="205" stroke="#444" stroke-width="2.6" marker-end="url(#arrow)"/>
  <rect x="120" y="205" width="320" height="98" fill="#fde8f1" stroke="#222" stroke-width="2.2"/>
  <text x="280" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#e64b8a">Transformer LLM</text>
  <line x1="280" y1="303" x2="280" y2="350" stroke="#444" stroke-width="2.6" marker-end="url(#arrow)"/>
  <rect x="240" y="352" width="80" height="56" rx="9" fill="#e9c3f3" stroke="#222" stroke-width="2.2"/>
  <text x="280" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#111">Dear</text>

  <line x1="440" y1="230" x2="560" y2="92" stroke="#555" stroke-width="3" stroke-dasharray="5 8" marker-end="url(#dotArrow)"/>
  <line x1="440" y1="272" x2="560" y2="372" stroke="#555" stroke-width="3" stroke-dasharray="5 8" marker-end="url(#dotArrow)"/>

  <rect x="560" y="65" width="510" height="320" fill="#fde8f1" stroke="#222" stroke-width="2.2"/>
  <rect x="580" y="92" width="470" height="54" rx="8" fill="#efc3c8" stroke="#222" stroke-width="2.2"/>
  <text x="815" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#111">Tokenizer</text>

  <rect x="580" y="154" width="470" height="162" rx="8" fill="#edf5fa" stroke="#00a2df" stroke-width="4"/>
  <text x="675" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#111">Stack of</text>
  <text x="675" y="249" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#111">transformer</text>
  <text x="675" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#111">blocks</text>
  <rect x="770" y="174" width="245" height="39" rx="8" fill="#d8eef8" stroke="#222" stroke-width="2"/>
  <rect x="770" y="225" width="245" height="39" rx="8" fill="#d8eef8" stroke="#222" stroke-width="2"/>
  <rect x="770" y="276" width="245" height="39" rx="8" fill="#d8eef8" stroke="#222" stroke-width="2"/>
  <text x="892" y="201" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Transformer block 1</text>
  <text x="892" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Transformer block 2</text>
  <text x="892" y="303" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#111">Transformer block N</text>

  <rect x="580" y="326" width="470" height="42" rx="8" fill="#efc3c8" stroke="#222" stroke-width="2.2"/>
  <text x="815" y="354" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#111">LM head</text>

  <text x="70" y="480" font-family="Georgia, serif" font-size="23" font-style="italic" fill="#111">
    Transformer LLM = tokenizer + Transformer block stack + language-modeling head.
  </text>
</svg>
