<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <defs><marker id="bm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker></defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">BM25's term-frequency saturation vs. TF-IDF's linear growth</text>

  <!-- axes -->
  <line x1="90" y1="290" x2="620" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#bm)"/>
  <line x1="90" y1="290" x2="90" y2="60" stroke="#334155" stroke-width="1.5" marker-end="url(#bm)"/>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#475569">term frequency (occurrences of the word)  →</text>
  <text x="56" y="175" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 56 175)">score contribution  →</text>

  <!-- TF-IDF linear -->
  <line x1="90" y1="290" x2="560" y2="80" stroke="#dc2626" stroke-width="2.5"/>
  <text x="500" y="95" font-size="11.5" font-weight="700" fill="#dc2626">TF-IDF (linear)</text>
  <text x="470" y="112" font-size="10" fill="#dc2626">10× the words ⇒ 10× the score</text>

  <!-- BM25 saturating curve -->
  <path d="M90,290 C 200,140 340,110 610,105" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="120" y1="112" x2="610" y2="112" stroke="#16a34a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="430" y="150" font-size="11.5" font-weight="700" fill="#16a34a">BM25 (saturates)</text>
  <text x="500" y="128" font-size="10" fill="#166534">ceiling ≈ (k₁+1)/(k₁·norm)</text>

  <text x="360" y="344" text-anchor="middle" font-size="11.5" fill="#334155">Going 1→2 occurrences helps a lot; 10→11 barely moves — like a smoke alarm: one beep says "fire", a hundred says nothing more.</text>
</svg>
