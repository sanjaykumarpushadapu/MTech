<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Intelligent model routing — cheapest model that clears the bar</text>

  <rect x="40" y="150" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#334155"/>
  <text x="100" y="172" text-anchor="middle" font-size="12" font-weight="600">request</text>
  <text x="100" y="189" text-anchor="middle" font-size="10.5" fill="#475569">complexity classifier</text>

  <!-- lanes -->
  <g font-size="11">
    <rect x="250" y="60"  width="290" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="265" y="80" font-size="11.5" font-weight="700" fill="#166534">Simple → SLM 1–3B</text>
    <text x="265" y="98" font-size="10.5" fill="#166534">intent, NER, slot-filling · Phi-4-mini · ~$0.01/1K</text>

    <rect x="250" y="128" width="290" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="265" y="148" font-size="11.5" font-weight="700" fill="#92400e">Medium → MoE mid</text>
    <text x="265" y="166" font-size="10.5" fill="#92400e">summarise, QA, RAG · Mixtral / DeepSeek-V3 · ~$0.08/1K</text>

    <rect x="250" y="196" width="290" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="265" y="216" font-size="11.5" font-weight="700" fill="#5b21b6">Complex → Dense LLM</text>
    <text x="265" y="234" font-size="10.5" fill="#5b21b6">reasoning, code-gen, planning · Claude 3.7 / GPT-4o · ~$0.80/1K</text>
  </g>
  <line x1="160" y1="172" x2="248" y2="86"  stroke="#16a34a" stroke-width="1.6" marker-end="url(#a5)"/>
  <line x1="160" y1="175" x2="248" y2="154" stroke="#d97706" stroke-width="1.6" marker-end="url(#a5)"/>
  <line x1="160" y1="178" x2="248" y2="222" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#a5)"/>

  <!-- traffic split labels -->
  <text x="575" y="90"  font-size="11" font-weight="700" fill="#16a34a">80%</text>
  <text x="575" y="158" font-size="11" font-weight="700" fill="#d97706">15%</text>
  <text x="575" y="226" font-size="11" font-weight="700" fill="#7c3aed">5%</text>

  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">80/15/5 split → $0.06/1K vs $0.80/1K flat GPT-4o (~92% cheaper), CSAT held, P50 −40%.</text>
  <text x="360" y="312" text-anchor="middle" font-size="11" fill="#b91c1c">Risk: misrouting a hard query to an SLM → confidently wrong. Tune to escalate when unsure.</text>
</svg>
