<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">Approximate nearest neighbor indexing</title><desc id="desc">A vector collection is indexed so queries visit promising regions only and return approximate top k with high recall and low latency.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.idx{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1080" height="500"/><text class="t" x="54" y="55">ANN indexing: search promising regions, not every vector</text><rect class="box" x="70" y="215" width="170" height="72"/><text class="l" x="155" y="258" text-anchor="middle">Vector collection</text><rect class="idx" x="320" y="215" width="150" height="72"/><text class="l" x="395" y="258" text-anchor="middle">Build index</text><rect class="idx" x="550" y="130" width="180" height="72"/><text class="l" x="640" y="173" text-anchor="middle">Query enters</text><rect class="idx" x="550" y="300" width="180" height="72"/><text class="l" x="640" y="335" text-anchor="middle">Visit promising</text><text class="s" x="640" y="357" text-anchor="middle">regions only</text><rect class="out" x="815" y="215" width="190" height="72"/><text class="l" x="910" y="247" text-anchor="middle">Approx top k</text><text class="s" x="910" y="270" text-anchor="middle">high recall, low latency</text><path class="arr" d="M240 251 L320 251"/><path class="arr" d="M470 235 C510 205 520 170 550 166"/><path class="arr" d="M640 202 L640 300"/><path class="arr" d="M730 336 C780 325 800 280 815 255"/></svg>
