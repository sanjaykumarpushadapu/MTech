<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc">
  <title id="title">Context window as shared token budget</title>
  <desc id="desc">System prompt, conversation, retrieved documents, tool results, safety instructions, and answer all compete for the same finite context window; recall is weakest in the middle.</desc>
  <rect x="24" y="24" width="1112" height="492" rx="20" fill="#fffdf7" stroke="#c7b56f" stroke-width="2"/>
  <text x="580" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17213a">Context is a shared token budget</text>
  <g font-family="Georgia,serif" fill="#17213a">
    <rect x="90" y="130" width="980" height="74" rx="14" fill="#eef4ff" stroke="#315a99" stroke-width="2"/>
    <rect x="100" y="142" width="165" height="50" rx="8" fill="#e4f2f4" stroke="#1f6570"/><text x="182" y="173" text-anchor="middle" font-size="15">system prompt</text>
    <rect x="270" y="142" width="210" height="50" rx="8" fill="#fff2bd" stroke="#8a6400"/><text x="375" y="173" text-anchor="middle" font-size="15">conversation</text>
    <rect x="485" y="142" width="250" height="50" rx="8" fill="#f7e4e7" stroke="#914252"/><text x="610" y="173" text-anchor="middle" font-size="15">retrieved docs</text>
    <rect x="740" y="142" width="150" height="50" rx="8" fill="#fff" stroke="#24304a"/><text x="815" y="173" text-anchor="middle" font-size="15">tools</text>
    <rect x="895" y="142" width="165" height="50" rx="8" fill="#e4f2f4" stroke="#1f6570"/><text x="978" y="173" text-anchor="middle" font-size="15">answer room</text>
    <text x="580" y="247" text-anchor="middle" font-size="20" font-weight="700">Lost in the middle</text>
    <path d="M150 330 C300 230 430 420 580 420 C730 420 860 230 1010 330" fill="none" stroke="#914252" stroke-width="5"/>
    <text x="150" y="365" text-anchor="middle" font-size="17">start recalled well</text>
    <text x="580" y="455" text-anchor="middle" font-size="17">middle often missed</text>
    <text x="1010" y="365" text-anchor="middle" font-size="17">end recalled well</text>
  </g>
</svg>
