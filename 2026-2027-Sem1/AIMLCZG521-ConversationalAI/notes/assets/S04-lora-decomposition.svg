<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">LoRA: freeze W, learn a small correction B·A alongside it</text>

  <!-- input -->
  <rect x="40" y="150" width="80" height="40" rx="6" fill="#e2e8f0" stroke="#334155"/>
  <text x="80" y="175" text-anchor="middle" font-size="12" font-weight="600">input x</text>

  <!-- frozen path -->
  <rect x="180" y="80" width="180" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="270" y="102" text-anchor="middle" font-size="12.5" font-weight="700">W (frozen)</text>
  <text x="270" y="120" text-anchor="middle" font-size="10.5" fill="#3730a3">d×d — not updated · 🔒</text>

  <!-- lora path -->
  <rect x="180" y="200" width="80" height="46" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="220" y="221" text-anchor="middle" font-size="12" font-weight="700">A</text>
  <text x="220" y="237" text-anchor="middle" font-size="10" fill="#9d174d">d×r</text>
  <rect x="290" y="200" width="80" height="46" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="330" y="221" text-anchor="middle" font-size="12" font-weight="700">B</text>
  <text x="330" y="237" text-anchor="middle" font-size="10" fill="#9d174d">r×d</text>
  <line x1="260" y1="223" x2="288" y2="223" stroke="#475569" stroke-width="1.4" marker-end="url(#a3)"/>
  <text x="275" y="270" text-anchor="middle" font-size="10.5" fill="#db2777">ΔW = B·A  (rank r ≪ d, trainable)</text>

  <line x1="120" y1="168" x2="178" y2="106" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="120" y1="172" x2="178" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- sum -->
  <circle cx="470" cy="150" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">+</text>
  <line x1="360" y1="106" x2="450" y2="144" stroke="#4338ca" stroke-width="1.5" marker-end="url(#a3)"/>
  <line x1="370" y1="223" x2="452" y2="160" stroke="#db2777" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="540" y="130" width="120" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="155" text-anchor="middle" font-size="12" font-weight="700">output y</text>
  <line x1="492" y1="150" x2="538" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>

  <text x="360" y="308" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">r=8 on a 4096×4096 weight: 65K params vs 16.7M — a 256× cut. Adapter ≈ 32–64 MB, not 28 GB.</text>
  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#64748b">Like correcting a printed book with a page of sticky notes instead of reprinting it.</text>
</svg>
