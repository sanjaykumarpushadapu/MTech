<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Encoder decoder architecture choice</title><desc id="desc">Encoder-only models understand full input, decoder-only models generate next tokens, and encoder-decoder models transform source to target.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.panel{fill:#fff8e8;stroke:#d8c79f;stroke-width:2;rx:22}.enc{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.dec{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2;rx:18}.both{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 17px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1120" height="520"/><text class="t" x="54" y="55">Architecture decides the natural task</text><rect class="panel" x="65" y="120" width="300" height="285"/><text class="l" x="215" y="155" text-anchor="middle">Encoder-only</text><rect class="enc" x="115" y="205" width="200" height="58"/><text class="l" x="215" y="240" text-anchor="middle">See full input</text><path class="arr" d="M215 263 L215 315"/><rect class="enc" x="115" y="315" width="200" height="58"/><text class="l" x="215" y="350" text-anchor="middle">Embed / classify</text><rect class="panel" x="410" y="120" width="300" height="285"/><text class="l" x="560" y="155" text-anchor="middle">Decoder-only</text><rect class="dec" x="460" y="205" width="200" height="58"/><text class="l" x="560" y="240" text-anchor="middle">See left context</text><path class="arr" d="M560 263 L560 315"/><rect class="dec" x="460" y="315" width="200" height="58"/><text class="l" x="560" y="350" text-anchor="middle">Generate token</text><rect class="panel" x="755" y="120" width="300" height="285"/><text class="l" x="905" y="155" text-anchor="middle">Encoder-decoder</text><rect class="both" x="790" y="205" width="120" height="58"/><text class="l" x="850" y="240" text-anchor="middle">Encode</text><path class="arr" d="M910 234 L945 234"/><rect class="both" x="945" y="205" width="80" height="58"/><text class="l" x="985" y="240" text-anchor="middle">Decode</text><text class="s" x="905" y="335" text-anchor="middle">translation, summarization, text-to-text</text></svg>
