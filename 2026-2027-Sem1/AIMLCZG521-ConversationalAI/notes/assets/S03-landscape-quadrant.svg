<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">The four model families — cost vs. capability</text>
  <!-- axes -->
  <line x1="90" y1="370" x2="670" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="90" y1="370" x2="90" y2="60" stroke="#334155" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="400" text-anchor="middle" font-size="13" fill="#475569">Cost per token  →</text>
  <text x="60" y="215" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 60 215)">Reasoning capability (MMLU)  →</text>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <!-- bubbles -->
  <g font-size="13" fill="#0f172a">
    <circle cx="180" cy="300" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="180" y="298" text-anchor="middle" font-weight="700" font-size="12">Small LM</text>
    <text x="180" y="314" text-anchor="middle" font-size="10.5" fill="#166534">1–14B · edge</text>

    <circle cx="330" cy="215" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="330" y="210" text-anchor="middle" font-weight="700" font-size="12">MoE</text>
    <text x="330" y="226" text-anchor="middle" font-size="10.5" fill="#1e40af">few active / many stored</text>

    <circle cx="560" cy="120" r="42" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="560" y="115" text-anchor="middle" font-weight="700" font-size="12">Dense</text>
    <text x="560" y="131" text-anchor="middle" font-size="10.5" fill="#5b21b6">all params active</text>

    <circle cx="250" cy="140" r="38" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="250" y="135" text-anchor="middle" font-weight="700" font-size="12">SSM / hybrid</text>
    <text x="250" y="151" text-anchor="middle" font-size="10.5" fill="#92400e">1M+ context, O(n)</text>
  </g>
  <text x="360" y="424" text-anchor="middle" font-size="11" fill="#64748b">Pick the cheapest family that clears the task's quality bar — the landscape ends in a router, not one winner.</text>
</svg>
