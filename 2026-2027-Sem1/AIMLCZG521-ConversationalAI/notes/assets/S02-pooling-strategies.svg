<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Pooling strategies</title><desc id="desc">Contextual token vectors can be pooled by CLS, mean, or max pooling into one sentence vector.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.in{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 17px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1000" height="500"/><text class="t" x="54" y="55">Pooling compresses token vectors into one searchable vector</text><rect class="in" x="70" y="210" width="210" height="86"/><text class="l" x="175" y="245" text-anchor="middle">Contextual</text><text class="s" x="175" y="270" text-anchor="middle">token vectors</text><rect class="box" x="430" y="115" width="155" height="62"/><text class="l" x="508" y="153" text-anchor="middle">CLS pooling</text><rect class="box" x="430" y="220" width="155" height="62"/><text class="l" x="508" y="258" text-anchor="middle">Mean pooling</text><rect class="box" x="430" y="325" width="155" height="62"/><text class="l" x="508" y="363" text-anchor="middle">Max pooling</text><rect class="out" x="735" y="220" width="170" height="62"/><text class="l" x="820" y="258" text-anchor="middle">One vector</text><path class="arr" d="M280 245 C350 230 370 150 430 146"/><path class="arr" d="M280 253 L430 251"/><path class="arr" d="M280 260 C350 285 370 360 430 356"/><path class="arr" d="M585 146 C650 165 690 220 735 245"/><path class="arr" d="M585 251 L735 251"/><path class="arr" d="M585 356 C650 335 690 285 735 260"/></svg>
