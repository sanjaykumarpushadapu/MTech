<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Reciprocal Rank Fusion</title><desc id="desc">BM25 and dense retrieval produce rank lists; RRF fuses ranks into a final top k list.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.q{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.list{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.rrf{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2.5;rx:20}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 17px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1000" height="500"/><text class="t" x="54" y="55">RRF fuses rankings, not incompatible raw scores</text><rect class="q" x="70" y="215" width="130" height="68"/><text class="l" x="135" y="256" text-anchor="middle">Query</text><rect class="list" x="320" y="125" width="180" height="72"/><text class="l" x="410" y="155" text-anchor="middle">BM25 rank list</text><text class="s" x="410" y="178" text-anchor="middle">exact evidence</text><rect class="list" x="320" y="305" width="180" height="72"/><text class="l" x="410" y="335" text-anchor="middle">Dense rank list</text><text class="s" x="410" y="358" text-anchor="middle">semantic evidence</text><rect class="rrf" x="625" y="215" width="150" height="68"/><text class="l" x="700" y="256" text-anchor="middle">RRF fusion</text><rect class="out" x="850" y="215" width="110" height="68"/><text class="l" x="905" y="256" text-anchor="middle">Top k</text><path class="arr" d="M200 235 C260 210 285 165 320 161"/><path class="arr" d="M200 265 C260 290 285 335 320 341"/><path class="arr" d="M500 161 C570 175 600 220 625 242"/><path class="arr" d="M500 341 C570 325 600 280 625 260"/><path class="arr" d="M775 249 L850 249"/></svg>
