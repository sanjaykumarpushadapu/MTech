<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of conversational AI</title>
  <desc id="desc">Seven eras of conversational AI progress from rule-based systems to statistical ML, deep learning, transformers, LLMs, agentic AI, and on-device multi-modal systems.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24304a"/></marker></defs>
  <rect x="24" y="24" width="1152" height="512" rx="20" fill="#fffdf7" stroke="#c7b56f" stroke-width="2"/>
  <text x="600" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#17213a">Evolution: each era fixes the previous limitation</text>
  <g font-family="Georgia,serif" fill="#17213a">
    <rect x="70" y="118" width="220" height="94" rx="13" fill="#e4f2f4" stroke="#1f6570" stroke-width="2"/><text x="180" y="148" text-anchor="middle" font-size="18" font-weight="700">1960s-1990s</text><text x="180" y="175" text-anchor="middle" font-size="17">Rule-based</text><text x="180" y="198" text-anchor="middle" font-size="14">limit: no learning/context</text>
    <rect x="350" y="118" width="220" height="94" rx="13" fill="#eaf2ff" stroke="#315a99" stroke-width="2"/><text x="460" y="148" text-anchor="middle" font-size="18" font-weight="700">2000-2010</text><text x="460" y="175" text-anchor="middle" font-size="17">Statistical ML</text><text x="460" y="198" text-anchor="middle" font-size="14">limit: handcrafted features</text>
    <rect x="630" y="118" width="220" height="94" rx="13" fill="#eaf2ff" stroke="#315a99" stroke-width="2"/><text x="740" y="148" text-anchor="middle" font-size="18" font-weight="700">2010-2017</text><text x="740" y="175" text-anchor="middle" font-size="17">Deep learning</text><text x="740" y="198" text-anchor="middle" font-size="14">limit: task-specific</text>
    <rect x="910" y="118" width="220" height="94" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="1020" y="148" text-anchor="middle" font-size="18" font-weight="700">2017-2020</text><text x="1020" y="175" text-anchor="middle" font-size="17">Transformers</text><text x="1020" y="198" text-anchor="middle" font-size="14">limit: fine-tuning</text>
    <rect x="210" y="330" width="220" height="94" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="320" y="360" text-anchor="middle" font-size="18" font-weight="700">2020-2023</text><text x="320" y="387" text-anchor="middle" font-size="17">LLMs + GenAI</text><text x="320" y="410" text-anchor="middle" font-size="14">limit: no actions</text>
    <rect x="490" y="330" width="220" height="94" rx="13" fill="#f7e4e7" stroke="#914252" stroke-width="2"/><text x="600" y="360" text-anchor="middle" font-size="18" font-weight="700">2023-2025</text><text x="600" y="387" text-anchor="middle" font-size="17">Agentic AI</text><text x="600" y="410" text-anchor="middle" font-size="14">limit: cost/orchestration</text>
    <rect x="770" y="330" width="220" height="94" rx="13" fill="#f7e4e7" stroke="#914252" stroke-width="2"/><text x="880" y="360" text-anchor="middle" font-size="18" font-weight="700">2025-2026</text><text x="880" y="387" text-anchor="middle" font-size="17">On-device &amp; multi-modal</text><text x="880" y="410" text-anchor="middle" font-size="13">limit: hardware, fragmentation</text>
  </g>
  <g stroke="#24304a" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="290" y1="165" x2="340" y2="165"/><line x1="570" y1="165" x2="620" y2="165"/><line x1="850" y1="165" x2="900" y2="165"/>
    <path d="M1020 212 C1020 270 320 270 320 320"/><line x1="430" y1="377" x2="480" y2="377"/><line x1="710" y1="377" x2="760" y2="377"/>
  </g>
</svg>
