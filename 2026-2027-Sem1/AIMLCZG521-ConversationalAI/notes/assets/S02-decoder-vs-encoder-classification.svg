<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
  <title id="title">Fine-tuning closes the decoder-vs-encoder gap</title>
  <desc id="desc">Bar chart of F1-macro scores on a six-way humor classification task, from lowest to highest: encoder-decoder zero/few-shot, decoder zero-shot, decoder few-shot, decoder fine-tuned, and encoder fine-tuned. The fine-tuned decoder and fine-tuned encoder bars are nearly equal, both close to a dashed reference line at 0.86.</desc>
  <defs>
    <style>
      .bg{fill:#f8f4ea}
      .frame{fill:none;stroke:#c7b56f;stroke-width:2}
      .t{font:700 23px Georgia,serif;fill:#17213a}
      .s{font:italic 14px Georgia,serif;fill:#5a5540}
      .axis{stroke:#4a4636;stroke-width:2}
      .grid{stroke:#d8d3bd;stroke-width:1;stroke-dasharray:3 4}
      .gridLbl{font:13px Georgia,serif;fill:#6b6650}
      .catLbl{font:700 13px Georgia,serif;fill:#17213a}
      .valLbl{font:700 16px Georgia,serif;fill:#17213a}
      .ref{stroke:#8e6aa5;stroke-width:2;stroke-dasharray:6 5}
      .refLbl{font:italic 13px Georgia,serif;fill:#6a4f7a}
      .bar1{fill:#d7c6e3;stroke:#8e6aa5;stroke-width:2}
      .bar2{fill:#cfe1e8;stroke:#4c8191;stroke-width:2}
      .bar3{fill:#a9cbd8;stroke:#28536b;stroke-width:2}
      .bar4{fill:#7bafc4;stroke:#17313d;stroke-width:2.5}
      .bar5{fill:#bfe0cf;stroke:#3b856d;stroke-width:2.5}
    </style>
  </defs>
  <rect class="bg" width="1100" height="550"/>
  <rect class="frame" x="14" y="14" width="1072" height="522" rx="18"/>

  <text class="t" x="50" y="50">Zero/few-shot decoders lag far behind — fine-tuning closes the gap</text>
  <text class="s" x="50" y="72">F1-macro, six-way humor classification (Borodach et al. 2025)</text>

  <!-- axis -->
  <line class="axis" x1="90" y1="430" x2="1030" y2="430"/>
  <line class="axis" x1="90" y1="100" x2="90" y2="430"/>

  <!-- gridlines at 0.2 .. 1.0 -->
  <g>
    <line class="grid" x1="90" y1="360" x2="1030" y2="360"/><text class="gridLbl" x="78" y="365" text-anchor="end">0.2</text>
    <line class="grid" x1="90" y1="290" x2="1030" y2="290"/><text class="gridLbl" x="78" y="295" text-anchor="end">0.4</text>
    <line class="grid" x1="90" y1="220" x2="1030" y2="220"/><text class="gridLbl" x="78" y="225" text-anchor="end">0.6</text>
    <line class="grid" x1="90" y1="150" x2="1030" y2="150"/><text class="gridLbl" x="78" y="155" text-anchor="end">0.8</text>
    <text class="gridLbl" x="78" y="435" text-anchor="end">0.0</text>
  </g>

  <!-- reference line at 0.86 (best fine-tuned encoder, RoBERTa) -->
  <line class="ref" x1="90" y1="129" x2="1030" y2="129"/>
  <text class="refLbl" x="95" y="121" text-anchor="start">RoBERTa reference — 0.86</text>

  <!-- bars: value*350 px tall, baseline y=430 -->
  <!-- 1: Encoder-Decoder zero/few-shot ~0.15 -->
  <rect class="bar1" x="110" y="377" width="130" height="53"/>
  <text class="valLbl" x="175" y="368" text-anchor="middle">0.15</text>
  <text class="catLbl" x="175" y="452" text-anchor="middle">Encoder–Decoder</text>
  <text class="catLbl" x="175" y="469" text-anchor="middle">(zero/few-shot)</text>

  <!-- 2: Decoder zero-shot (best: GPT-4) ~0.50 -->
  <rect class="bar2" x="285" y="255" width="130" height="175"/>
  <text class="valLbl" x="350" y="246" text-anchor="middle">0.50</text>
  <text class="catLbl" x="350" y="452" text-anchor="middle">Decoder</text>
  <text class="catLbl" x="350" y="469" text-anchor="middle">(zero-shot, best)</text>

  <!-- 3: Decoder few-shot (best: GPT-4) ~0.60 -->
  <rect class="bar3" x="460" y="220" width="130" height="210"/>
  <text class="valLbl" x="525" y="211" text-anchor="middle">0.60</text>
  <text class="catLbl" x="525" y="452" text-anchor="middle">Decoder</text>
  <text class="catLbl" x="525" y="469" text-anchor="middle">(few-shot, best)</text>

  <!-- 4: Decoder fine-tuned (GPT-4o) ~0.85 -->
  <rect class="bar4" x="635" y="132" width="130" height="298"/>
  <text class="valLbl" x="700" y="123" text-anchor="middle">0.85</text>
  <text class="catLbl" x="700" y="452" text-anchor="middle">Decoder</text>
  <text class="catLbl" x="700" y="469" text-anchor="middle">(fine-tuned, GPT-4o)</text>

  <!-- 5: Encoder fine-tuned (RoBERTa) ~0.86 -->
  <rect class="bar5" x="810" y="129" width="130" height="301"/>
  <text class="valLbl" x="875" y="120" text-anchor="middle">0.86</text>
  <text class="catLbl" x="875" y="452" text-anchor="middle">Encoder</text>
  <text class="catLbl" x="875" y="469" text-anchor="middle">(fine-tuned, RoBERTa)</text>

  <text class="s" x="90" y="500">Same architecture family (decoder), four training regimes:</text>
  <text class="s" x="90" y="519">the jump from 0.60 to 0.85 is what fine-tuning buys, not a bigger model.</text>
</svg>
