<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc"><title id="title">Vector database architecture</title><desc id="desc">Documents are chunked, embedded, stored, indexed, filtered, retrieved, reranked, and passed as context to an agent.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:16}.vec{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:16}.meta{fill:#fff2d7;stroke:#c98937;stroke-width:2;rx:16}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:16}.agent{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2;rx:16}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 15px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1180" height="760"/><text class="t" x="54" y="55">Vector database architecture: retrieval is a system, not one table</text><rect class="box" x="70" y="135" width="140" height="58"/><text class="l" x="140" y="170" text-anchor="middle">Documents</text><rect class="box" x="270" y="135" width="140" height="58"/><text class="l" x="340" y="170" text-anchor="middle">Chunking</text><rect class="vec" x="470" y="105" width="160" height="58"/><text class="l" x="550" y="140" text-anchor="middle">Embedding model</text><rect class="vec" x="695" y="105" width="150" height="58"/><text class="l" x="770" y="140" text-anchor="middle">Vector store</text><rect class="vec" x="910" y="105" width="150" height="58"/><text class="l" x="985" y="140" text-anchor="middle">ANN index</text><rect class="meta" x="470" y="235" width="160" height="58"/><text class="l" x="550" y="270" text-anchor="middle">Metadata store</text><rect class="meta" x="695" y="235" width="150" height="58"/><text class="l" x="770" y="270" text-anchor="middle">Filters</text><rect class="box" x="70" y="475" width="140" height="58"/><text class="l" x="140" y="510" text-anchor="middle">Query</text><rect class="vec" x="270" y="475" width="160" height="58"/><text class="l" x="350" y="510" text-anchor="middle">Query embedding</text><rect class="out" x="695" y="475" width="150" height="58"/><text class="l" x="770" y="510" text-anchor="middle">Candidates</text><rect class="out" x="910" y="475" width="150" height="58"/><text class="l" x="985" y="510" text-anchor="middle">Rerank / fuse</text><rect class="agent" x="910" y="610" width="150" height="58"/><text class="l" x="985" y="645" text-anchor="middle">Agent context</text><path class="arr" d="M210 164 L270 164"/><path class="arr" d="M410 164 C440 150 450 140 470 134"/><path class="arr" d="M630 134 L695 134"/><path class="arr" d="M845 134 L910 134"/><path class="arr" d="M410 178 C440 225 450 250 470 264"/><path class="arr" d="M630 264 L695 264"/><path class="arr" d="M210 504 L270 504"/><path class="arr" d="M430 504 C560 420 820 285 985 163"/><path class="arr" d="M770 293 L770 475"/><path class="arr" d="M985 163 C990 300 900 430 845 504"/><path class="arr" d="M845 504 L910 504"/><path class="arr" d="M985 533 L985 610"/></svg>
