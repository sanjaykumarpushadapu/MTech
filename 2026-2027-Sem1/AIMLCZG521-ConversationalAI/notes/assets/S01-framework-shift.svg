<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Framework shift from intents to tools</title>
  <desc id="desc">Traditional frameworks enumerate intents in advance; agentic frameworks describe tools and let the model infer intent at runtime.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24304a"/></marker></defs>
  <rect x="24" y="24" width="1072" height="452" rx="20" fill="#fffdf7" stroke="#c7b56f" stroke-width="2"/>
  <text x="560" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17213a">The framework assumption that flipped</text>
  <g font-family="Georgia,serif" fill="#17213a">
    <rect x="70" y="120" width="430" height="245" rx="18" fill="#e4f2f4" stroke="#1f6570" stroke-width="2.2"/>
    <text x="285" y="158" text-anchor="middle" font-size="24" font-weight="700">Traditional · intents first</text>
    <text x="285" y="205" text-anchor="middle" font-size="18">enumerate intents in advance</text>
    <text x="285" y="240" text-anchor="middle" font-size="18">train classifier per intent</text>
    <text x="285" y="275" text-anchor="middle" font-size="18">write dialogue policies</text>
    <text x="285" y="320" text-anchor="middle" font-size="17">unlisted intent = loud failure</text>
    <rect x="620" y="120" width="430" height="245" rx="18" fill="#f7e4e7" stroke="#914252" stroke-width="2.2"/>
    <text x="835" y="158" text-anchor="middle" font-size="24" font-weight="700">Agentic · tools first</text>
    <text x="835" y="205" text-anchor="middle" font-size="18">describe tools and schemas</text>
    <text x="835" y="240" text-anchor="middle" font-size="18">model infers intent at runtime</text>
    <text x="835" y="275" text-anchor="middle" font-size="18">model plans the path</text>
    <text x="835" y="320" text-anchor="middle" font-size="17">unlisted intent = plausible attempt</text>
    <text x="560" y="426" text-anchor="middle" font-size="18">Old stack fails predictably; new stack handles more but needs guardrails and traces.</text>
  </g>
  <line x1="505" y1="242" x2="615" y2="242" stroke="#24304a" stroke-width="2.8" marker-end="url(#a)"/>
</svg>
