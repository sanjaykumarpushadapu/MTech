<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Linear scan computational wall</title><desc id="desc">A query vector is compared with every document vector, all scores are sorted, and top k is returned.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.q{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.doc{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:16}.warn{fill:#ffe7dd;stroke:#c85a3d;stroke-width:2;rx:18}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1120" height="520"/><text class="t" x="54" y="55">Linear scan: exact, simple, and too expensive at scale</text><rect class="q" x="70" y="220" width="160" height="76"/><text class="l" x="150" y="265" text-anchor="middle">Query vector</text><rect class="doc" x="350" y="105" width="210" height="50"/><text class="l" x="455" y="136" text-anchor="middle">Document 1</text><rect class="doc" x="350" y="180" width="210" height="50"/><text class="l" x="455" y="211" text-anchor="middle">Document 2</text><rect class="doc" x="350" y="255" width="210" height="50"/><text class="l" x="455" y="286" text-anchor="middle">...</text><rect class="doc" x="350" y="330" width="210" height="50"/><text class="l" x="455" y="361" text-anchor="middle">Document 10M</text><rect class="warn" x="690" y="190" width="180" height="76"/><text class="l" x="780" y="223" text-anchor="middle">Sort all scores</text><text class="s" x="780" y="247" text-anchor="middle">O(N x dimension)</text><rect class="out" x="950" y="190" width="120" height="76"/><text class="l" x="1010" y="235" text-anchor="middle">Top k</text><path class="arr" d="M230 250 C280 225 310 130 350 130"/><path class="arr" d="M230 255 C285 250 310 205 350 205"/><path class="arr" d="M230 260 L350 280"/><path class="arr" d="M230 268 C285 315 310 355 350 355"/><path class="arr" d="M560 130 C620 145 650 190 690 215"/><path class="arr" d="M560 205 L690 225"/><path class="arr" d="M560 280 L690 235"/><path class="arr" d="M560 355 C620 335 650 270 690 245"/><path class="arr" d="M870 228 L950 228"/></svg>
