<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">HNSW search process</title><desc id="desc">HNSW starts at a sparse top layer, greedily walks to closer neighbors, drops to denser layers, and performs beam search at layer zero.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.layer{fill:#fff8e8;stroke:#e0cda5;stroke-width:2;rx:24}.node{fill:#e8f3f6;stroke:#4c8191;stroke-width:2}.target{fill:#ffe7dd;stroke:#c85a3d;stroke-width:2}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}.edge{stroke:#839ba6;stroke-width:2}</style></defs><rect class="bg" width="1080" height="620"/><text class="t" x="54" y="55">HNSW: highways above, local streets below</text><rect class="layer" x="80" y="110" width="920" height="95"/><text class="l" x="120" y="142">Sparse top layer</text><rect class="layer" x="80" y="255" width="920" height="95"/><text class="l" x="120" y="287">Middle layer</text><rect class="layer" x="80" y="400" width="920" height="125"/><text class="l" x="120" y="432">Dense layer 0</text><circle class="node" cx="250" cy="160" r="18"/><circle class="node" cx="510" cy="160" r="18"/><circle class="node" cx="780" cy="160" r="18"/><line class="edge" x1="250" y1="160" x2="510" y2="160"/><line class="edge" x1="510" y1="160" x2="780" y2="160"/><circle class="node" cx="210" cy="305" r="18"/><circle class="node" cx="390" cy="305" r="18"/><circle class="node" cx="575" cy="305" r="18"/><circle class="node" cx="760" cy="305" r="18"/><circle class="node" cx="900" cy="305" r="18"/><line class="edge" x1="210" y1="305" x2="390" y2="305"/><line class="edge" x1="390" y1="305" x2="575" y2="305"/><line class="edge" x1="575" y1="305" x2="760" y2="305"/><line class="edge" x1="760" y1="305" x2="900" y2="305"/><circle class="node" cx="180" cy="470" r="16"/><circle class="node" cx="300" cy="470" r="16"/><circle class="node" cx="420" cy="470" r="16"/><circle class="target" cx="540" cy="470" r="18"/><circle class="node" cx="660" cy="470" r="16"/><circle class="node" cx="780" cy="470" r="16"/><circle class="node" cx="900" cy="470" r="16"/><line class="edge" x1="180" y1="470" x2="300" y2="470"/><line class="edge" x1="300" y1="470" x2="420" y2="470"/><line class="edge" x1="420" y1="470" x2="540" y2="470"/><line class="edge" x1="540" y1="470" x2="660" y2="470"/><line class="edge" x1="660" y1="470" x2="780" y2="470"/><line class="edge" x1="780" y1="470" x2="900" y2="470"/><path class="arr" d="M250 160 C340 130 420 130 510 160"/><path class="arr" d="M510 178 C525 220 545 250 575 287"/><path class="arr" d="M575 305 C630 285 705 285 760 305"/><path class="arr" d="M760 323 C720 375 625 425 540 452"/><text class="s" x="540" y="570" text-anchor="middle">Greedy search gets close quickly; layer 0 beam search refines the approximate top k.</text></svg>
