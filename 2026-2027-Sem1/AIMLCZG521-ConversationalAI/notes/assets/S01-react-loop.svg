<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
  <title id="title">ReAct loop</title>
  <desc id="desc">The ReAct pattern alternates Thought, Action, and Observation until the agent has enough information to produce a final answer.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24304a"/></marker></defs>
  <rect x="24" y="24" width="1032" height="412" rx="20" fill="#fffdf7" stroke="#c7b56f" stroke-width="2"/>
  <text x="540" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17213a">ReAct = reason, act, observe, repeat</text>
  <g font-family="Georgia,serif" fill="#17213a">
    <rect x="80" y="185" width="160" height="74" rx="13" fill="#fff" stroke="#24304a" stroke-width="2"/><text x="160" y="229" text-anchor="middle" font-size="19" font-weight="700">Question</text>
    <rect x="310" y="135" width="170" height="74" rx="13" fill="#e4f2f4" stroke="#1f6570" stroke-width="2"/><text x="395" y="165" text-anchor="middle" font-size="19" font-weight="700">Thought</text><text x="395" y="190" text-anchor="middle" font-size="14">what do I need?</text>
    <rect x="560" y="135" width="170" height="74" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="645" y="165" text-anchor="middle" font-size="19" font-weight="700">Action</text><text x="645" y="190" text-anchor="middle" font-size="14">call tool</text>
    <rect x="560" y="285" width="170" height="74" rx="13" fill="#eaf2ff" stroke="#315a99" stroke-width="2"/><text x="645" y="315" text-anchor="middle" font-size="19" font-weight="700">Observation</text><text x="645" y="340" text-anchor="middle" font-size="14">tool result</text>
    <rect x="820" y="185" width="180" height="74" rx="13" fill="#f7e4e7" stroke="#914252" stroke-width="2"/><text x="910" y="229" text-anchor="middle" font-size="19" font-weight="700">Final answer</text>
    <text x="540" y="410" text-anchor="middle" font-size="15" font-style="italic" fill="#5a5540">Like a cook tasting a dish while cooking &#8212; taste, add salt, taste again &#8212; instead of dumping everything in at once.</text>
  </g>
  <g stroke="#24304a" stroke-width="2.6" fill="none" marker-end="url(#a)">
    <line x1="240" y1="222" x2="300" y2="182"/><line x1="480" y1="172" x2="550" y2="172"/><line x1="645" y1="209" x2="645" y2="275"/>
    <path d="M560 322 C420 322 395 255 395 219"/><path d="M730 322 C820 315 870 285 895 267"/>
  </g>
</svg>
