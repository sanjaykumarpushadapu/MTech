<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Quadratic attention vs. linear State Space Model</text>

  <!-- left: attention -->
  <text x="185" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">Full attention — O(n²)</text>
  <text x="185" y="80" text-anchor="middle" font-size="11" fill="#64748b">every token sees every token</text>
  <g>
    <circle cx="90"  cy="150" r="16" fill="#ede9fe" stroke="#7c3aed"/><text x="90" y="154" text-anchor="middle" font-size="11">t₁</text>
    <circle cx="185" cy="120" r="16" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="124" text-anchor="middle" font-size="11">t₂</text>
    <circle cx="280" cy="150" r="16" fill="#ede9fe" stroke="#7c3aed"/><text x="280" y="154" text-anchor="middle" font-size="11">t₃</text>
    <circle cx="185" cy="220" r="16" fill="#ede9fe" stroke="#7c3aed"/><text x="185" y="224" text-anchor="middle" font-size="11">t₄</text>
    <g stroke="#a78bfa" stroke-width="1.2">
      <line x1="106" y1="150" x2="169" y2="120"/><line x1="106" y1="150" x2="264" y2="150"/><line x1="106" y1="150" x2="169" y2="220"/>
      <line x1="201" y1="120" x2="264" y2="150"/><line x1="185" y1="136" x2="185" y2="204"/>
      <line x1="264" y1="150" x2="201" y2="220"/>
    </g>
  </g>
  <text x="185" y="270" text-anchor="middle" font-size="11.5" fill="#7c3aed" font-weight="600">128K tokens → 16.4B pair-scores/layer</text>

  <!-- divider -->
  <line x1="370" y1="55" x2="370" y2="285" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- right: SSM -->
  <text x="545" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">State Space Model — O(n)</text>
  <text x="545" y="80" text-anchor="middle" font-size="11" fill="#64748b">fixed-size state carried forward</text>
  <g font-size="11">
    <rect x="410" y="130" width="52" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="436" y="154" text-anchor="middle">x₁</text>
    <rect x="500" y="130" width="52" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="526" y="154" text-anchor="middle">x₂</text>
    <rect x="590" y="130" width="52" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="616" y="154" text-anchor="middle">x₃</text>
    <rect x="410" y="205" width="232" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="526" y="227" text-anchor="middle" font-size="11" fill="#92400e">hidden state hₜ  (fixed size, d_state=16)</text>
  </g>
  <line x1="436" y1="170" x2="436" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="526" y1="170" x2="526" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="616" y1="170" x2="616" y2="203" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="462" y1="222" x2="498" y2="222" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="552" y1="222" x2="588" y2="222" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="545" y="270" text-anchor="middle" font-size="11.5" fill="#d97706" font-weight="600">state never grows → ~10× cheaper memory at 128K</text>

  <text x="360" y="330" text-anchor="middle" font-size="11.5" fill="#334155">Like a running bank balance: keep one number, adjust per token — don't re-add the whole past.</text>
</svg>
