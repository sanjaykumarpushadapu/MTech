<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">Embedding training objectives</title><desc id="desc">Contrastive learning, masked language modeling, and RetroMAE train embedding models for different strengths.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.root{fill:#e8f3f6;stroke:#4c8191;stroke-width:2.5;rx:22}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1080" height="540"/><text class="t" x="54" y="55">Training objective decides what “similar” means</text><rect class="root" x="420" y="105" width="240" height="70"/><text class="l" x="540" y="147" text-anchor="middle">Training objective</text><rect class="box" x="70" y="245" width="260" height="82"/><text class="l" x="200" y="278" text-anchor="middle">Contrastive learning</text><text class="s" x="200" y="303" text-anchor="middle">pull positives close</text><rect class="box" x="410" y="245" width="260" height="82"/><text class="l" x="540" y="278" text-anchor="middle">Masked LM</text><text class="s" x="540" y="303" text-anchor="middle">predict hidden tokens</text><rect class="box" x="750" y="245" width="260" height="82"/><text class="l" x="880" y="278" text-anchor="middle">RetroMAE</text><text class="s" x="880" y="303" text-anchor="middle">reconstruct masked input</text><rect class="out" x="70" y="385" width="260" height="62"/><text class="l" x="200" y="423" text-anchor="middle">Retrieval-ready similarity</text><rect class="out" x="410" y="385" width="260" height="62"/><text class="l" x="540" y="423" text-anchor="middle">Bidirectional understanding</text><rect class="out" x="750" y="385" width="260" height="62"/><text class="l" x="880" y="423" text-anchor="middle">Robust compressed vectors</text><path class="arr" d="M470 175 L200 245"/><path class="arr" d="M540 175 L540 245"/><path class="arr" d="M610 175 L880 245"/><path class="arr" d="M200 327 L200 385"/><path class="arr" d="M540 327 L540 385"/><path class="arr" d="M880 327 L880 385"/></svg>
