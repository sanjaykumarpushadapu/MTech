<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">Embedding retrieval flow</title><desc id="desc">Documents and a user query are embedded into dense vectors; the vector index returns nearest documents.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.model{fill:#e8f3f6;stroke:#4c8191;stroke-width:2.5;rx:20}.store{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.out{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2;rx:18}.t{font:700 26px Georgia,serif;fill:#17313d}.l{font:700 18px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1080" height="520"/><text class="t" x="54" y="55">Embedding retrieval: turn meaning into nearest-neighbor search</text><rect class="box" x="75" y="135" width="170" height="72"/><text class="l" x="160" y="178" text-anchor="middle">Raw text</text><rect class="box" x="75" y="315" width="170" height="72"/><text class="l" x="160" y="358" text-anchor="middle">User query</text><rect class="model" x="355" y="225" width="210" height="86"/><text class="l" x="460" y="260" text-anchor="middle">Embedding model</text><text class="s" x="460" y="285" text-anchor="middle">same vector space</text><rect class="store" x="675" y="225" width="160" height="86"/><text class="l" x="755" y="260" text-anchor="middle">Dense vector</text><text class="s" x="755" y="285" text-anchor="middle">numbers = meaning</text><rect class="store" x="875" y="135" width="150" height="72"/><text class="l" x="950" y="178" text-anchor="middle">Vector index</text><rect class="out" x="875" y="315" width="150" height="72"/><text class="l" x="950" y="358" text-anchor="middle">Nearest docs</text><path class="arr" d="M245 171 C300 190 320 235 355 250"/><path class="arr" d="M245 351 C300 330 320 295 355 285"/><path class="arr" d="M565 268 L675 268"/><path class="arr" d="M835 248 C865 220 875 190 875 171"/><path class="arr" d="M950 207 L950 315"/></svg>
