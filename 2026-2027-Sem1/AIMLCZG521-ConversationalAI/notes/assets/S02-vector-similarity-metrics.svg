<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Vector similarity metrics</title><desc id="desc">Cosine similarity, Euclidean distance, and dot product measure vector closeness differently.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.axis{stroke:#9aa7a8;stroke-width:2}.vec{stroke:#28536b;stroke-width:4;fill:none;marker-end:url(#a)}.vec2{stroke:#c85a3d;stroke-width:4;fill:none;marker-end:url(#a)}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}</style></defs><rect class="bg" width="1100" height="560"/><text class="t" x="54" y="55">Similarity metrics define what “near” means</text><line class="axis" x1="95" y1="410" x2="430" y2="410"/><line class="axis" x1="120" y1="440" x2="120" y2="135"/><path class="vec" d="M120 410 L340 210"/><path class="vec2" d="M120 410 L370 300"/><text class="s" x="350" y="205">A</text><text class="s" x="382" y="300">B</text><path d="M205 333 A120 120 0 0 1 230 380" stroke="#8e6aa5" stroke-width="3" fill="none"/><text class="l" x="250" y="350">angle = cosine</text><rect class="box" x="525" y="140" width="230" height="82"/><text class="l" x="640" y="173" text-anchor="middle">Cosine similarity</text><text class="s" x="640" y="198" text-anchor="middle">direction / angle</text><rect class="box" x="800" y="140" width="230" height="82"/><text class="l" x="915" y="173" text-anchor="middle">Euclidean distance</text><text class="s" x="915" y="198" text-anchor="middle">physical distance</text><rect class="box" x="665" y="295" width="230" height="82"/><text class="l" x="780" y="328" text-anchor="middle">Dot product</text><text class="s" x="780" y="353" text-anchor="middle">alignment plus magnitude</text><text class="s" x="780" y="455" text-anchor="middle">For normalized text embeddings, dot product behaves like cosine.</text></svg>
