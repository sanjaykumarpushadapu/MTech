<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Six components of modern conversational AI</title>
  <desc id="desc">Conversational AI systems understand language, manage dialogue, retrieve knowledge, execute actions, generate responses, and maintain memory.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24304a"/></marker></defs>
  <rect x="24" y="24" width="1072" height="512" rx="20" fill="#fffdf7" stroke="#c7b56f" stroke-width="2"/>
  <text x="560" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17213a">Six components: LLM core plus outside-world engineering</text>
  <g font-family="Georgia,serif" fill="#17213a">
    <rect x="80" y="130" width="230" height="78" rx="13" fill="#e4f2f4" stroke="#1f6570" stroke-width="2"/><text x="195" y="161" text-anchor="middle" font-size="19" font-weight="700">1 NLU</text><text x="195" y="187" text-anchor="middle" font-size="15">intent + entities</text>
    <rect x="445" y="130" width="230" height="78" rx="13" fill="#e4f2f4" stroke="#1f6570" stroke-width="2"/><text x="560" y="161" text-anchor="middle" font-size="19" font-weight="700">2 Dialogue</text><text x="560" y="187" text-anchor="middle" font-size="15">state + turn flow</text>
    <rect x="810" y="130" width="230" height="78" rx="13" fill="#e4f2f4" stroke="#1f6570" stroke-width="2"/><text x="925" y="161" text-anchor="middle" font-size="19" font-weight="700">5 Response</text><text x="925" y="187" text-anchor="middle" font-size="15">controlled generation</text>
    <rect x="80" y="320" width="230" height="78" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="195" y="351" text-anchor="middle" font-size="19" font-weight="700">3 Knowledge</text><text x="195" y="377" text-anchor="middle" font-size="15">vector DB · RAG</text>
    <rect x="445" y="320" width="230" height="78" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="560" y="351" text-anchor="middle" font-size="19" font-weight="700">4 Actions</text><text x="560" y="377" text-anchor="middle" font-size="15">tools · APIs · code</text>
    <rect x="810" y="320" width="230" height="78" rx="13" fill="#fff2bd" stroke="#8a6400" stroke-width="2"/><text x="925" y="351" text-anchor="middle" font-size="19" font-weight="700">6 Memory</text><text x="925" y="377" text-anchor="middle" font-size="15">profile · episodic · semantic</text>
    <rect x="270" y="232" width="580" height="58" rx="14" fill="#f7e4e7" stroke="#914252" stroke-width="2"/>
    <text x="560" y="268" text-anchor="middle" font-size="19" font-weight="700">The expensive half touches the outside world</text>
    <text x="560" y="460" text-anchor="middle" font-size="18">Understanding, dialogue and response are mostly absorbed by the LLM;</text>
    <text x="560" y="484" text-anchor="middle" font-size="18">knowledge, actions and memory need real systems.</text>
  </g>
  <g stroke="#24304a" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="310" y1="169" x2="435" y2="169"/><line x1="675" y1="169" x2="800" y2="169"/>
    <path d="M560 208 L560 222"/><line x1="310" y1="359" x2="435" y2="359"/><line x1="675" y1="359" x2="800" y2="359"/>
  </g>
</svg>
