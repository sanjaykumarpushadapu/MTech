<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-labelledby="title desc">
  <title id="title">The model as the brain of conversational AI</title>
  <desc id="desc">Transformer to conversational agent flow: transformer, pre-training, LLM, fine-tuning or instruction tuning, then tools, memory, and planning lead to a conversational agent.</desc>
  <rect x="0" y="0" width="1600" height="180" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <rect x="20" y="34" width="220" height="96" fill="#d7eef5"/>
    <text x="130" y="82" text-anchor="middle" font-size="20" font-weight="700">Transformer</text>
    <text x="130" y="108" text-anchor="middle" font-size="20" font-weight="700">(2017)</text>

    <rect x="280" y="34" width="220" height="96" fill="#d7eef5"/>
    <text x="390" y="76" text-anchor="middle" font-size="20" font-weight="700">Pre-training</text>
    <text x="390" y="104" text-anchor="middle" font-size="20" font-weight="700">on Massive Data</text>

    <rect x="540" y="34" width="220" height="96" fill="#d7eef5"/>
    <text x="650" y="72" text-anchor="middle" font-size="20" font-weight="700">LLM</text>
    <text x="650" y="98" text-anchor="middle" font-size="20" font-weight="700">(GPT / BERT /</text>
    <text x="650" y="122" text-anchor="middle" font-size="20" font-weight="700">T5)</text>

    <rect x="800" y="34" width="240" height="96" fill="#d7eef5"/>
    <text x="920" y="72" text-anchor="middle" font-size="20" font-weight="700">Fine-tuning /</text>
    <text x="920" y="98" text-anchor="middle" font-size="20" font-weight="700">Instruction</text>
    <text x="920" y="122" text-anchor="middle" font-size="20" font-weight="700">Tuning</text>

    <rect x="1080" y="34" width="220" height="96" fill="#d7eef5"/>
    <text x="1190" y="72" text-anchor="middle" font-size="20" font-weight="700">Tools + Memory</text>
    <text x="1190" y="98" text-anchor="middle" font-size="20" font-weight="700">+ Planning</text>

    <rect x="1340" y="34" width="240" height="96" fill="#d7eef5"/>
    <text x="1460" y="82" text-anchor="middle" font-size="20" font-weight="700">Conversational</text>
    <text x="1460" y="108" text-anchor="middle" font-size="20" font-weight="700">Agent</text>
  </g>
  <g fill="#ef9e59">
    <rect x="240" y="76" width="40" height="8"/>
    <rect x="500" y="76" width="40" height="8"/>
    <rect x="760" y="76" width="40" height="8"/>
    <rect x="1040" y="76" width="40" height="8"/>
    <rect x="1300" y="76" width="40" height="8"/>
  </g>
</svg>
