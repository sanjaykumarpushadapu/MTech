<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Embedding model selection criteria</title><desc id="desc">Embedding model choice depends on quality, context length, dimensions and storage, latency and cost, and open versus API deployment.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.center{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2.5;rx:22}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1080" height="560"/><text class="t" x="54" y="55">Choose an embedding model like a production component</text><rect class="center" x="420" y="225" width="240" height="92"/><text class="l" x="540" y="260" text-anchor="middle">Embedding model</text><text class="s" x="540" y="285" text-anchor="middle">choice</text><rect class="box" x="80" y="120" width="190" height="70"/><text class="l" x="175" y="162" text-anchor="middle">Quality</text><rect class="box" x="445" y="115" width="190" height="70"/><text class="l" x="540" y="157" text-anchor="middle">Context length</text><rect class="box" x="810" y="120" width="190" height="70"/><text class="l" x="905" y="157" text-anchor="middle">Dimension</text><text class="s" x="905" y="178" text-anchor="middle">storage and RAM</text><rect class="box" x="175" y="385" width="210" height="70"/><text class="l" x="280" y="427" text-anchor="middle">Latency and cost</text><rect class="box" x="700" y="385" width="210" height="70"/><text class="l" x="805" y="427" text-anchor="middle">Open vs API</text><path class="arr" d="M270 155 C350 175 395 220 420 250"/><path class="arr" d="M540 185 L540 225"/><path class="arr" d="M810 155 C730 175 685 220 660 250"/><path class="arr" d="M385 420 C435 370 455 330 475 317"/><path class="arr" d="M700 420 C650 370 625 330 605 317"/></svg>
