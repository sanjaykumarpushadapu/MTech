<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">Semantic keyword hybrid retrieval</title><desc id="desc">A query goes to semantic retrieval and keyword retrieval; semantic finds paraphrases, keyword finds exact terms, and hybrid combines both.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.q{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.sem{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.kw{fill:#fff2d7;stroke:#c98937;stroke-width:2;rx:18}.hy{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 17px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1040" height="520"/><text class="t" x="54" y="55">Hybrid retrieval combines meaning and exact evidence</text><rect class="q" x="80" y="220" width="140" height="70"/><text class="l" x="150" y="262" text-anchor="middle">Query</text><rect class="sem" x="350" y="130" width="210" height="76"/><text class="l" x="455" y="160" text-anchor="middle">Semantic retrieval</text><text class="s" x="455" y="184" text-anchor="middle">finds paraphrases</text><rect class="kw" x="350" y="310" width="210" height="76"/><text class="l" x="455" y="340" text-anchor="middle">Keyword retrieval</text><text class="s" x="455" y="364" text-anchor="middle">finds IDs, names, terms</text><rect class="hy" x="710" y="220" width="210" height="76"/><text class="l" x="815" y="250" text-anchor="middle">Hybrid retrieval</text><text class="s" x="815" y="274" text-anchor="middle">safer production default</text><path class="arr" d="M220 245 C280 220 300 170 350 168"/><path class="arr" d="M220 265 C280 295 300 345 350 348"/><path class="arr" d="M560 168 C640 180 670 220 710 248"/><path class="arr" d="M560 348 C640 330 670 295 710 268"/></svg>
