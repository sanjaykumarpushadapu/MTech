<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc"><title id="title">BERT style embedding pipeline</title><desc id="desc">Text is tokenized, mapped to IDs, embedded with position, passed through encoder layers, then pooled into one sentence vector.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:16}.enc{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:16}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:16}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 15px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1180" height="560"/><text class="t" x="54" y="55">BERT-style sentence embedding is a pipeline, not one magic step</text><rect class="box" x="50" y="240" width="120" height="64"/><text class="l" x="110" y="278" text-anchor="middle">Text</text><rect class="box" x="210" y="220" width="150" height="104"/><text class="l" x="285" y="255" text-anchor="middle">Tokenize</text><text class="s" x="285" y="280" text-anchor="middle">[CLS] ... [SEP]</text><rect class="box" x="400" y="240" width="120" height="64"/><text class="l" x="460" y="278" text-anchor="middle">Token IDs</text><rect class="box" x="560" y="220" width="145" height="104"/><text class="l" x="632" y="255" text-anchor="middle">Embedding</text><text class="s" x="632" y="280" text-anchor="middle">lookup table</text><rect class="box" x="745" y="220" width="145" height="104"/><text class="l" x="818" y="255" text-anchor="middle">Add position</text><text class="s" x="818" y="280" text-anchor="middle">token + position</text><rect class="enc" x="930" y="220" width="145" height="104"/><text class="l" x="1002" y="252" text-anchor="middle">Encoder</text><text class="s" x="1002" y="277" text-anchor="middle">contextual</text><text class="s" x="1002" y="296" text-anchor="middle">token vectors</text><rect class="out" x="930" y="390" width="145" height="64"/><text class="l" x="1002" y="428" text-anchor="middle">Pool vector</text><path class="arr" d="M170 272 L210 272"/><path class="arr" d="M360 272 L400 272"/><path class="arr" d="M520 272 L560 272"/><path class="arr" d="M705 272 L745 272"/><path class="arr" d="M890 272 L930 272"/><path class="arr" d="M1002 324 L1002 390"/></svg>
