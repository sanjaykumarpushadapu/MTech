<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Self-attention resolving "its" back to "Law"</title>
  <desc id="desc">A token sequence from "The Law will never be perfect, but its application should be just" showing an attention head attending from "its" back to "Law" across intervening tokens, with a much weaker attention link to the adjacent word "application".</desc>
  <defs>
    <marker id="attentiona_strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a3b23"/></marker>
    <marker id="attentiona_weak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a9a86"/></marker>
    <style>
      .bg{fill:#fffdf7}
      .frame{fill:none;stroke:#c7b56f;stroke-width:2}
      .tok{fill:#fff;stroke:#24304a;stroke-width:2}
      .tokHi{fill:#f7e9d8;stroke:#8a3b23;stroke-width:2.5}
      .gap{fill:#f2f0e6;stroke:#b8b39a;stroke-width:1.5;stroke-dasharray:5 4}
      .t{font:700 24px Georgia,serif;fill:#17213a}
      .s{font:italic 14px Georgia,serif;fill:#5a5540}
      .lbl{font:700 17px Georgia,serif;fill:#17213a}
      .gapLbl{font:italic 14px Georgia,serif;fill:#7a755f}
      .arcLbl{font:700 14px Georgia,serif;fill:#8a3b23}
      .weakLbl{font:14px Georgia,serif;fill:#726d5a}
      .cap{font:14px Georgia,serif;fill:#3a4256}
    </style>
  </defs>
  <rect class="bg" width="1000" height="440"/>
  <rect class="frame" x="14" y="14" width="972" height="412" rx="18"/>

  <text class="t" x="50" y="56">Self-attention resolving "its" back to "Law"</text>
  <text class="s" x="50" y="80">encoder self-attention, layer 5 of 6 (Vaswani et al. 2017, Fig. 4)</text>
  <text class="s" x="50" y="99">authored illustration of the reported pattern — not a reproduction of the figure</text>

  <!-- token row -->
  <g>
    <rect class="tok" x="50" y="245" width="70" height="56" rx="10"/><text class="lbl" x="85" y="279" text-anchor="middle">The</text>
    <rect class="tokHi" x="140" y="245" width="80" height="56" rx="10"/><text class="lbl" x="180" y="279" text-anchor="middle">Law</text>

    <rect class="gap" x="240" y="253" width="260" height="40" rx="10"/>
    <text class="gapLbl" x="370" y="278" text-anchor="middle">will never be perfect, but</text>

    <rect class="tokHi" x="520" y="245" width="70" height="56" rx="10"/><text class="lbl" x="555" y="279" text-anchor="middle">its</text>
    <rect class="tok" x="610" y="245" width="150" height="56" rx="10"/><text class="lbl" x="685" y="279" text-anchor="middle">application</text>
    <rect class="tok" x="780" y="245" width="90" height="56" rx="10"/><text class="lbl" x="825" y="279" text-anchor="middle">should</text>
  </g>

  <!-- strong long-range arc: its -> Law -->
  <path d="M545 241 C 480 135 260 125 185 239" fill="none" stroke="#8a3b23" stroke-width="3" marker-end="url(#attentiona_strong)"/>
  <text class="arcLbl" x="365" y="135" text-anchor="middle">attention weight: high — resolves the reference</text>

  <!-- weak short arc: its -> application -->
  <path d="M592 265 C 600 220 615 220 618 243" fill="none" stroke="#9a9a86" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#attentiona_weak)"/>
  <text class="weakLbl" x="700" y="220" text-anchor="middle">weight: low (mere adjacency ≠ relevance)</text>

  <text class="cap" x="50" y="360">Different heads specialise on different jobs from training alone — no coreference module was hand-built.</text>
  <text class="cap" x="50" y="383">A separate head, elsewhere in the same layer, was found tracking a long-range verb phrase the same way.</text>
</svg>
