<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc"><title id="title">BM25 scoring components</title><desc id="desc">BM25 combines term frequency, rarity across the collection, and document length normalization into keyword ranking.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.score{fill:#e8f3f6;stroke:#4c8191;stroke-width:2.5;rx:20}.out{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.t{font:700 25px Georgia,serif;fill:#17313d}.l{font:700 16px Georgia,serif;fill:#17313d}.s{font:500 12px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1040" height="520"/><text class="t" x="54" y="55">BM25: exact terms, rarity, and length normalization</text><rect class="box" x="80" y="105" width="235" height="70"/><text class="l" x="198" y="147" text-anchor="middle">Query terms</text><rect class="box" x="80" y="220" width="235" height="70"/><text class="l" x="198" y="252" text-anchor="middle">Term frequency</text><text class="s" x="198" y="274" text-anchor="middle">saturates, not unlimited</text><rect class="box" x="80" y="335" width="235" height="70"/><text class="l" x="198" y="367" text-anchor="middle">Collection rarity</text><text class="s" x="198" y="389" text-anchor="middle">IDF boosts rare terms</text><rect class="box" x="390" y="335" width="235" height="70"/><text class="l" x="508" y="367" text-anchor="middle">Length normalization</text><text class="s" x="508" y="389" text-anchor="middle">long docs do not auto-win</text><rect class="score" x="430" y="200" width="180" height="86"/><text class="l" x="520" y="235" text-anchor="middle">BM25 score</text><text class="s" x="520" y="260" text-anchor="middle">keyword relevance</text><rect class="out" x="745" y="220" width="170" height="70"/><text class="l" x="830" y="262" text-anchor="middle">Keyword ranking</text><path class="arr" d="M315 140 C385 150 410 195 430 222"/><path class="arr" d="M315 255 L430 245"/><path class="arr" d="M315 370 C390 350 410 285 430 260"/><path class="arr" d="M508 335 L520 286"/><path class="arr" d="M610 243 L745 255"/></svg>
