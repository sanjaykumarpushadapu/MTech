<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning pipeline</title>
  <desc id="desc">ML pipeline organized into prepare data, learn and judge, run in production, and feedback decisions.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#28536b"/></marker><style>.bg{fill:#f8f4ea}.lane{fill:#fff8e8;stroke:#e0cda5;stroke-width:2;rx:28}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.run{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.judge{fill:#e8f3f6;stroke:#4c8191;stroke-width:2;rx:18}.fbbox{fill:#ffe7dd;stroke:#c85a3d;stroke-width:2;rx:18}.t{font:700 26px Georgia,serif;fill:#17313d}.lt{font:700 16px Georgia,serif;fill:#8a6424}.l{font:700 17px Georgia,serif;fill:#17313d}.s{font:500 13px Georgia,serif;fill:#3f5861}.arr{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#a)}.fb{stroke:#c85a3d;stroke-width:2.7;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1180" height="760"/>
  <text class="t" x="54" y="55">Machine-learning pipeline: main flow plus explicit feedback decisions</text>

  <rect class="box" x="70" y="105" width="200" height="70"/><text class="l" x="170" y="134" text-anchor="middle">Model requirements</text><text class="s" x="170" y="157" text-anchor="middle">goal, constraints, metric</text>

  <rect class="lane" x="70" y="220" width="860" height="120"/><text class="lt" x="105" y="252">PREPARE DATA</text>
  <rect class="box" x="135" y="270" width="160" height="52"/><text class="l" x="215" y="302" text-anchor="middle">Collect</text>
  <rect class="box" x="365" y="270" width="160" height="52"/><text class="l" x="445" y="302" text-anchor="middle">Label</text>
  <rect class="box" x="595" y="270" width="220" height="52"/><text class="l" x="705" y="302" text-anchor="middle">Clean and feature</text>

  <rect class="lane" x="70" y="385" width="860" height="120"/><text class="lt" x="105" y="417">LEARN AND JUDGE</text>
  <rect class="judge" x="260" y="435" width="200" height="52"/><text class="l" x="360" y="467" text-anchor="middle">Train model</text>
  <rect class="judge" x="590" y="435" width="200" height="52"/><text class="l" x="690" y="467" text-anchor="middle">Evaluate</text>

  <rect class="lane" x="70" y="550" width="860" height="120"/><text class="lt" x="105" y="582">RUN IN PRODUCTION</text>
  <rect class="run" x="260" y="600" width="200" height="52"/><text class="l" x="360" y="632" text-anchor="middle">Deploy</text>
  <rect class="run" x="590" y="600" width="200" height="52"/><text class="l" x="690" y="632" text-anchor="middle">Monitor</text>

  <rect class="fbbox" x="975" y="250" width="155" height="330"/>
  <text class="l" x="1052" y="288" text-anchor="middle">Feedback</text>
  <text class="l" x="1052" y="312" text-anchor="middle">decisions</text>
  <text class="s" x="1052" y="355" text-anchor="middle">Need more data?</text>
  <text class="s" x="1052" y="385" text-anchor="middle">Relabel examples?</text>
  <text class="s" x="1052" y="415" text-anchor="middle">Change features?</text>
  <text class="s" x="1052" y="445" text-anchor="middle">Try algorithm or</text>
  <text class="s" x="1052" y="465" text-anchor="middle">hyperparameters?</text>
  <text class="s" x="1052" y="505" text-anchor="middle">Did production drift?</text>

  <path class="arr" d="M170 175 C170 220 200 240 215 270"/>
  <path class="arr" d="M295 296 L365 296"/><path class="arr" d="M525 296 L595 296"/>
  <path class="arr" d="M705 322 C625 380 465 405 360 435"/>
  <path class="arr" d="M460 461 L590 461"/>
  <path class="arr" d="M690 487 C620 545 465 575 360 600"/>
  <path class="arr" d="M460 626 L590 626"/>

  <path class="fb" d="M790 461 C875 461 920 415 975 415"/>
  <path class="fb" d="M790 626 C875 626 920 505 975 505"/>
</svg>
