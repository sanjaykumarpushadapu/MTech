<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">Secrets are injected at run time, never stored in code</title>
  <desc id="desc">A secret store holds credentials; the pipeline's identity is granted least-privilege access, and secrets are injected at run time rather than written into code or config.</desc>
  <defs><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker></defs>
  <style>
    .bg{fill:#f8f4ea} .title{font:700 18px Georgia,serif;fill:#17313d}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2} .head{font:700 11.5px Georgia,serif;fill:#17313d}
    .body{font:9.5px Georgia,serif;fill:#5a4a1e} .arrow{stroke:#24465a;stroke-width:2;fill:none;marker-end:url(#a10)}
    .vault{fill:#f8e3a3;stroke:#a97e17;stroke-width:2} .bad{fill:#f6d9c9;stroke:#c96a3c;stroke-width:2}
  </style>
  <rect class="bg" width="1040" height="280"/>
  <text class="title" x="40" y="32">Identity requests access; the secret store injects credentials at run time</text>
  <rect class="vault" x="60" y="80" width="220" height="70" rx="8"/><text class="head" x="170" y="110" text-anchor="middle">Secret store</text><text class="body" x="170" y="128" text-anchor="middle">holds credentials</text>
  <path class="arrow" d="M280 115 L350 115"/>
  <rect class="box" x="360" y="80" width="240" height="70" rx="8"/><text class="head" x="480" y="105" text-anchor="middle">Pipeline identity</text><text class="body" x="480" y="123" text-anchor="middle">least-privilege role</text><text class="body" x="480" y="139" text-anchor="middle">requests only what it needs</text>
  <path class="arrow" d="M600 115 L670 115"/>
  <rect class="box" x="680" y="80" width="260" height="70" rx="8"/><text class="head" x="810" y="110" text-anchor="middle">Injected at run time</text><text class="body" x="810" y="128" text-anchor="middle">never in code or config</text>
  <rect class="bad" x="360" y="190" width="580" height="50" rx="8"/><text class="body" x="650" y="220" text-anchor="middle">Never: credentials hard-coded, committed, or logged in plain text</text>
</svg>
