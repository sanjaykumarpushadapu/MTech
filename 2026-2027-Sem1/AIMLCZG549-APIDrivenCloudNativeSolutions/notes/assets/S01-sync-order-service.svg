<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous order service calls</title>
  <desc id="desc">A client waits while the order service calls consumer and restaurant services directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#254b5f"/>
    </marker>
    <style>
      .bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbf9d;stroke-width:2;rx:22}.service{fill:#e8f4f7;stroke:#4f8293;stroke-width:2;rx:22}
      .title{font:700 26px Georgia,serif;fill:#16313d}.label{font:700 21px Georgia,serif;fill:#16313d}.small{font:500 16px Georgia,serif;fill:#415861}
      .arrow{stroke:#254b5f;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1050" height="360"/>
  <text class="title" x="50" y="54">Synchronous API call: caller waits for every downstream answer</text>
  <rect class="box" x="70" y="142" width="170" height="90"/><text class="label" x="155" y="195" text-anchor="middle">Client</text>
  <rect class="service" x="395" y="132" width="230" height="110"/><text class="label" x="510" y="180" text-anchor="middle">Order Service</text><text class="small" x="510" y="208" text-anchor="middle">blocks until replies</text>
  <rect class="box" x="790" y="82" width="210" height="78"/><text class="label" x="895" y="128" text-anchor="middle">Consumer Service</text>
  <rect class="box" x="790" y="218" width="210" height="78"/><text class="label" x="895" y="264" text-anchor="middle">Restaurant Service</text>
  <path class="arrow" d="M240 187 L395 187"/><text class="small" x="318" y="166" text-anchor="middle">POST /orders</text>
  <path class="arrow" d="M625 170 C690 170 715 121 790 121"/><text class="small" x="700" y="122" text-anchor="middle">GET /consumers/id</text>
  <path class="arrow" d="M625 205 C690 205 715 257 790 257"/><text class="small" x="705" y="282" text-anchor="middle">GET /restaurant/id</text>
  <text class="small" x="510" y="320" text-anchor="middle">Good when the user needs a truthful answer now; fragile when any dependency is slow or down.</text>
</svg>
