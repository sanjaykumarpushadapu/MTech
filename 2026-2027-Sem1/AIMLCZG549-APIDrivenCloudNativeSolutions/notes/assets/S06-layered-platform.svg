<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">The data platform, layered</title>
  <desc id="desc">Sources generate files, events, database changes, and API responses. Ingestion captures data reliably. Storage separates raw, validated, and curated zones. Transformation applies business logic. Serving exposes trusted datasets. Orchestration connects and observes every layer.</desc>
  <defs>
    <marker id="arrLy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 19px Georgia,serif;fill:#17313d}
    .layer{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 12.5px Georgia,serif;fill:#17313d}
    .body{font:10.5px Georgia,serif;fill:#5a4a1e}
    .arrow{stroke:#24465a;stroke-width:2;fill:none;marker-end:url(#arrLy)}
    .orch{fill:none;stroke:#9c3f6f;stroke-width:2;stroke-dasharray:6 5}
    .orchtext{font:700 12px Georgia,serif;fill:#9c3f6f}
    .zone{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:1.2}
  </style>
  <rect class="bg" width="1120" height="360"/>
  <text class="title" x="40" y="34">Six layers, connected and observed by orchestration</text>

  <rect class="layer" x="40" y="180" width="150" height="90" rx="8"/><text class="head" x="115" y="210" text-anchor="middle">Sources</text><text class="body" x="115" y="228" text-anchor="middle">files, events, DB</text><text class="body" x="115" y="244" text-anchor="middle">changes, API responses</text>

  <path class="arrow" d="M190 225 L232 225"/>
  <rect class="layer" x="242" y="180" width="150" height="90" rx="8"/><text class="head" x="317" y="210" text-anchor="middle">Ingestion</text><text class="body" x="317" y="228" text-anchor="middle">captures reliably,</text><text class="body" x="317" y="244" text-anchor="middle">arrival metadata</text>

  <path class="arrow" d="M392 225 L434 225"/>
  <rect class="layer" x="444" y="150" width="180" height="150" rx="8"/><text class="head" x="534" y="175" text-anchor="middle">Storage</text>
  <rect class="zone" x="460" y="188" width="150" height="30" rx="5"/><text class="body" x="535" y="208" text-anchor="middle">raw</text>
  <rect class="zone" x="460" y="224" width="150" height="30" rx="5"/><text class="body" x="535" y="244" text-anchor="middle">validated</text>
  <rect class="zone" x="460" y="260" width="150" height="30" rx="5"/><text class="body" x="535" y="280" text-anchor="middle">curated</text>

  <path class="arrow" d="M624 225 L666 225"/>
  <rect class="layer" x="676" y="180" width="150" height="90" rx="8"/><text class="head" x="751" y="210" text-anchor="middle">Transformation</text><text class="body" x="751" y="228" text-anchor="middle">reusable business</text><text class="body" x="751" y="244" text-anchor="middle">logic</text>

  <path class="arrow" d="M826 225 L868 225"/>
  <rect class="layer" x="878" y="180" width="200" height="90" rx="8"/><text class="head" x="978" y="210" text-anchor="middle">Serving</text><text class="body" x="978" y="228" text-anchor="middle">trusted datasets,</text><text class="body" x="978" y="244" text-anchor="middle">features, or APIs</text>

  <rect class="orch" x="30" y="60" width="1058" height="60" rx="10"/>
  <text class="orchtext" x="550" y="95" text-anchor="middle">Orchestration connects every layer and observes every run</text>
</svg>
