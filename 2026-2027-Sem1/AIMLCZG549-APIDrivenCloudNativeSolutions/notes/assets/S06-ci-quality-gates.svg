<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260" role="img" aria-labelledby="title desc">
  <title id="title">A CI pipeline runs quality gates before code can merge</title>
  <desc id="desc">Committed code passes through lint, test, and build gates in sequence; any failure blocks the merge rather than allowing it through.</desc>
  <defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker></defs>
  <style>
    .bg{fill:#f8f4ea} .title{font:700 18px Georgia,serif;fill:#17313d}
    .gate{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:2} .head{font:700 11px Georgia,serif;fill:#17313d}
    .body{font:9px Georgia,serif;fill:#5a4a1e} .arrow{stroke:#24465a;stroke-width:2;fill:none;marker-end:url(#a12)}
    .merge{fill:#cdeadd;stroke:#2f7d68;stroke-width:2} .block{fill:#f6d9c9;stroke:#c96a3c;stroke-width:2}
  </style>
  <rect class="bg" width="1080" height="260"/>
  <text class="title" x="40" y="32">Any gate failure blocks the merge — none can be skipped</text>
  <rect class="gate" x="40" y="80" width="160" height="60" rx="6"/><text class="head" x="120" y="115" text-anchor="middle">Lint</text>
  <path class="arrow" d="M200 110 L250 110"/>
  <rect class="gate" x="260" y="80" width="160" height="60" rx="6"/><text class="head" x="340" y="115" text-anchor="middle">Unit tests</text>
  <path class="arrow" d="M420 110 L470 110"/>
  <rect class="gate" x="480" y="80" width="160" height="60" rx="6"/><text class="head" x="560" y="115" text-anchor="middle">Build</text>
  <path class="arrow" d="M640 110 L690 110"/>
  <rect class="merge" x="700" y="80" width="180" height="60" rx="6"/><text class="head" x="790" y="115" text-anchor="middle">Merge allowed</text>
  <rect class="block" x="260" y="170" width="400" height="50" rx="6"/><text class="body" x="460" y="200" text-anchor="middle">Any single failure stops the pipeline here — merge is blocked</text>
</svg>
