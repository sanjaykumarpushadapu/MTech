<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">A cache key built from three components</title>
  <desc id="desc">A cache key combines code version, parameters, and input version. A change to any one component forces a cache miss and a fresh computation.</desc>
  <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker></defs>
  <style>
    .bg{fill:#f8f4ea} .title{font:700 18px Georgia,serif;fill:#17313d}
    .part{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:1.5} .head{font:700 11.5px Georgia,serif;fill:#17313d}
    .body{font:9.5px Georgia,serif;fill:#5a4a1e} .key{fill:#f8e3a3;stroke:#a97e17;stroke-width:2}
    .arrow{stroke:#24465a;stroke-width:2;fill:none;marker-end:url(#a5)}
    .hit{fill:#cdeadd;stroke:#2f7d68;stroke-width:2} .miss{fill:#f6d9c9;stroke:#c96a3c;stroke-width:2}
  </style>
  <rect class="bg" width="1040" height="280"/>
  <text class="title" x="40" y="32">Any change to code, parameters, or input version forces a cache miss</text>
  <rect class="part" x="40" y="60" width="180" height="55" rx="6"/><text class="head" x="130" y="93" text-anchor="middle">Code version</text>
  <rect class="part" x="40" y="130" width="180" height="55" rx="6"/><text class="head" x="130" y="163" text-anchor="middle">Parameters</text>
  <rect class="part" x="40" y="200" width="180" height="55" rx="6"/><text class="head" x="130" y="233" text-anchor="middle">Input version</text>
  <path class="arrow" d="M220 90 L280 150"/>
  <path class="arrow" d="M220 160 L280 160"/>
  <path class="arrow" d="M220 225 L280 170"/>
  <rect class="key" x="290" y="130" width="180" height="60" rx="8"/><text class="head" x="380" y="165" text-anchor="middle">Cache key</text>
  <path class="arrow" d="M470 160 L530 160"/>
  <rect class="hit" x="540" y="100" width="220" height="55" rx="8"/><text class="head" x="650" y="132" text-anchor="middle">Hit — serve cached result</text>
  <rect class="miss" x="540" y="170" width="220" height="55" rx="8"/><text class="head" x="650" y="202" text-anchor="middle">Miss — recompute fresh</text>
  <text class="body" x="40" y="270">Expiry reflects data-freshness needs; side-effecting operations are never cached.</text>
</svg>
