<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Serverless stack</title>
  <desc id="desc">A serverless application usually combines HTTP gateway, function compute, database, and event sources.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker></defs>
  <style>
    .bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.compute{fill:#e4f4ef;stroke:#2f7d68;stroke-width:2;rx:18}.title{font:700 28px Georgia,serif;fill:#17313d}.head{font:700 19px Georgia,serif;fill:#17313d}.body{font:15px Georgia,serif;fill:#24465a}.arrow{stroke:#24465a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="56" y="54">Serverless stack: run code on demand without managing servers</text>
  <rect class="box" x="80" y="150" width="190" height="100"/><text class="head" x="175" y="188" text-anchor="middle">Client / event</text><text class="body" x="175" y="220" text-anchor="middle">HTTP, file upload, stream</text>
  <rect class="box" x="330" y="150" width="190" height="100"/><text class="head" x="425" y="188" text-anchor="middle">HTTP gateway</text><text class="body" x="425" y="220" text-anchor="middle">route and authorize</text>
  <rect class="compute" x="580" y="125" width="210" height="150"/><text class="head" x="685" y="175" text-anchor="middle">Function compute</text><text class="body" x="685" y="208" text-anchor="middle">AWS Lambda / GCF</text><text class="body" x="685" y="235" text-anchor="middle">charged per execution</text>
  <rect class="box" x="850" y="150" width="190" height="100"/><text class="head" x="945" y="188" text-anchor="middle">Database</text><text class="body" x="945" y="220" text-anchor="middle">DynamoDB / RDS</text>
  <rect class="box" x="580" y="350" width="210" height="80"/><text class="head" x="685" y="382" text-anchor="middle">Monitoring</text><text class="body" x="685" y="410" text-anchor="middle">logs, metrics, traces</text>
  <path class="arrow" d="M270 200 L330 200"/><path class="arrow" d="M520 200 L580 200"/><path class="arrow" d="M790 200 L850 200"/><path class="arrow" d="M685 275 L685 350"/>
</svg>
