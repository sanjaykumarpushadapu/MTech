<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480" role="img" aria-labelledby="title desc">
  <title id="title">Canonical data architecture</title>
  <desc id="desc">Source data, produced cloud or on-prem in a production environment, flows through data engineering into a raw lake, becoming refined data. Refined data feeds data science and data visualization. Data governance wraps the whole chain, which reaches data customers at the end.</desc>
  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a7a52"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 21px Georgia,serif;fill:#17313d}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 13.5px Georgia,serif;fill:#17313d}
    .body{font:11px Georgia,serif;fill:#5a4a1e}
    .arrow{stroke:#8a7a52;stroke-width:2;fill:none;marker-end:url(#arrC)}
    .gov{fill:none;stroke:#9c3f6f;stroke-width:2;stroke-dasharray:6 5}
    .govtext{font:700 13px Georgia,serif;fill:#9c3f6f}
  </style>
  <rect class="bg" width="1160" height="480"/>
  <text class="title" x="40" y="38">Source data flows through engineering into refined data, governed end to end</text>

  <rect class="box" x="40" y="150" width="150" height="90" rx="8"/>
  <text class="head" x="115" y="178" text-anchor="middle">Source Data</text>
  <text class="body" x="115" y="198" text-anchor="middle">Cloud/On-Prem</text>
  <text class="body" x="115" y="214" text-anchor="middle">Production Env.</text>

  <path class="arrow" d="M190 195 L232 195"/>
  <rect class="box" x="242" y="150" width="150" height="90" rx="8"/>
  <text class="head" x="317" y="185" text-anchor="middle">Data</text>
  <text class="head" x="317" y="203" text-anchor="middle">Engineering</text>

  <path class="arrow" d="M392 195 L434 195"/>
  <rect class="box" x="444" y="150" width="150" height="90" rx="8"/>
  <text class="head" x="519" y="195" text-anchor="middle">Raw Lake</text>

  <path class="arrow" d="M594 195 L636 195"/>
  <rect class="box" x="646" y="150" width="150" height="90" rx="8"/>
  <text class="head" x="721" y="195" text-anchor="middle">Refined Data</text>

  <path class="arrow" d="M796 175 L838 130"/>
  <rect class="box" x="848" y="80" width="150" height="70" rx="8"/>
  <text class="head" x="923" y="120" text-anchor="middle">Data Science</text>

  <path class="arrow" d="M796 215 L838 260"/>
  <rect class="box" x="848" y="240" width="150" height="70" rx="8"/>
  <text class="head" x="923" y="280" text-anchor="middle">Data Viz</text>

  <path class="arrow" d="M998 120 L1040 175"/>
  <path class="arrow" d="M998 275 L1040 210"/>
  <rect class="box" x="1050" y="150" width="90" height="90" rx="8"/>
  <text class="head" x="1095" y="188" text-anchor="middle" style="font-size:12px">Data</text>
  <text class="head" x="1095" y="204" text-anchor="middle" style="font-size:12px">Customers</text>

  <rect class="gov" x="230" y="60" width="780" height="330" rx="14"/>
  <text class="govtext" x="250" y="52">Data Governance wraps the pipeline end to end</text>

  <text class="body" x="580" y="420" text-anchor="middle" style="font-style:italic">datakitchen.io/dataops-data-architecture</text>
</svg>
