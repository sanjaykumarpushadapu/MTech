<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">GitOps reconciliation flow</title>
  <desc id="desc">Git stores desired state; an automated reconciler applies it to the cluster and reports drift.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker></defs>
  <style>
    .bg{fill:#f8f4ea}.box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.focus{fill:#e4f4ef;stroke:#2f7d68;stroke-width:2;rx:18}.warn{fill:#fff0e8;stroke:#d86f45;stroke-width:2;rx:18}.title{font:700 28px Georgia,serif;fill:#17313d}.head{font:700 19px Georgia,serif;fill:#17313d}.body{font:15px Georgia,serif;fill:#24465a}.arrow{stroke:#24465a;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#93622a;stroke-width:2.5;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
  </style>
  <rect class="bg" width="1120" height="540"/>
  <text class="title" x="56" y="54">GitOps: Git is the desired state; automation reconciles reality</text>
  <rect class="box" x="70" y="170" width="180" height="100"/><text class="head" x="160" y="208" text-anchor="middle">Engineer</text><text class="body" x="160" y="240" text-anchor="middle">changes YAML/config</text>
  <rect class="focus" x="320" y="145" width="210" height="150"/><text class="head" x="425" y="188" text-anchor="middle">Git repository</text><text class="body" x="425" y="222" text-anchor="middle">single source of truth</text><text class="body" x="425" y="250" text-anchor="middle">reviewed, versioned</text>
  <rect class="box" x="600" y="170" width="190" height="100"/><text class="head" x="695" y="208" text-anchor="middle">Reconciler</text><text class="body" x="695" y="240" text-anchor="middle">pulls and applies</text>
  <rect class="box" x="860" y="145" width="200" height="150"/><text class="head" x="960" y="188" text-anchor="middle">Cluster</text><text class="body" x="960" y="222" text-anchor="middle">running state</text><text class="body" x="960" y="250" text-anchor="middle">apps and infrastructure</text>
  <rect class="warn" x="600" y="365" width="250" height="80"/><text class="head" x="725" y="398" text-anchor="middle">Drift detected?</text><text class="body" x="725" y="425" text-anchor="middle">reconcile back to Git</text>
  <path class="arrow" d="M250 220 L320 220"/><path class="arrow" d="M530 220 L600 220"/><path class="arrow" d="M790 220 L860 220"/><path class="dash" d="M960 295 C950 380 890 405 850 405"/><path class="dash" d="M600 405 C500 400 445 340 425 295"/>
</svg>
