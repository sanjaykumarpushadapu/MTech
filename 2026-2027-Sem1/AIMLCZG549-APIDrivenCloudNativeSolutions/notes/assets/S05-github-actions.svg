<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions vocabulary and the session's own CI/CD workflow</title>
  <desc id="desc">A workflow is triggered by an event, contains jobs, which run on a runner and are made of steps, which may be actions. The session's own main.yaml is triggered by a push or pull request to main, and checks out the repository, sets up Python 3.10, installs dependencies, authenticates with Prefect Cloud using PREFECT_API_KEY and WORKSPACE_KEY secrets, then runs the Prefect deployment.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 19px Georgia,serif;fill:#17313d}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 12.5px Georgia,serif;fill:#17313d}
    .body{font:10.5px Georgia,serif;fill:#5a4a1e}
    .arrow{stroke:#24465a;stroke-width:1.8;fill:none;marker-end:url(#arrG)}
    .step{fill:#cdeadd;stroke:#2f7d68;stroke-width:1.5}
    .stext{font:10.5px Georgia,serif;fill:#17313d}
  </style>
  <rect class="bg" width="1160" height="560"/>
  <text class="title" x="40" y="34">Workflow → job → runner → step → action</text>

  <rect class="box" x="40" y="60" width="180" height="60" rx="8"/><text class="head" x="130" y="94" text-anchor="middle">Event</text><text class="body" x="130" y="110" text-anchor="middle">push, PR, webhook</text>
  <path class="arrow" d="M220 90 L262 90"/>
  <rect class="box" x="272" y="60" width="180" height="60" rx="8"/><text class="head" x="362" y="94" text-anchor="middle">Workflow</text>
  <path class="arrow" d="M452 90 L494 90"/>
  <rect class="box" x="504" y="60" width="180" height="60" rx="8"/><text class="head" x="594" y="94" text-anchor="middle">Job</text><text class="body" x="594" y="110" text-anchor="middle">commands on trigger</text>
  <path class="arrow" d="M684 90 L726 90"/>
  <rect class="box" x="736" y="60" width="180" height="60" rx="8"/><text class="head" x="826" y="94" text-anchor="middle">Runner</text><text class="body" x="826" y="110" text-anchor="middle">GitHub VM, container</text>
  <path class="arrow" d="M916 90 L958 90"/>
  <rect class="box" x="968" y="60" width="150" height="60" rx="8"/><text class="head" x="1043" y="94" text-anchor="middle">Step / Action</text>

  <text class="title" x="40" y="180">main.yaml — Prefect CI/CD Pipeline with Prefect Cloud</text>
  <text class="body" x="40" y="200">triggered on push or pull request to main</text>

  <rect class="step" x="40" y="220" width="200" height="46" rx="6"/><text class="stext" x="140" y="248" text-anchor="middle">Check out repository</text>
  <path class="arrow" d="M240 243 L282 243"/>
  <rect class="step" x="292" y="220" width="220" height="46" rx="6"/><text class="stext" x="402" y="248" text-anchor="middle">Set up Python 3.10</text>
  <path class="arrow" d="M512 243 L554 243"/>
  <rect class="step" x="564" y="220" width="220" height="46" rx="6"/><text class="stext" x="674" y="248" text-anchor="middle">Install dependencies</text>
  <path class="arrow" d="M600 266 L600 300 L 300 300 L300 330"/>
  <rect class="step" x="120" y="330" width="360" height="52" rx="6"/><text class="stext" x="300" y="352" text-anchor="middle">Authenticate with Prefect Cloud</text><text class="stext" x="300" y="370" text-anchor="middle">using PREFECT_API_KEY, WORKSPACE_KEY secrets</text>
  <path class="arrow" d="M480 356 L522 356"/>
  <rect class="step" x="532" y="330" width="420" height="52" rx="6"/><text class="stext" x="742" y="352" text-anchor="middle">prefect deployment run</text><text class="stext" x="742" y="370" text-anchor="middle">'main-flow/covid-ds-workflow'</text>

  <text class="title" x="40" y="440">Job vocabulary</text>
  <text class="body" x="40" y="464">A runner is a GitHub-hosted VM; each job runs inside a container on it.</text>
  <text class="body" x="40" y="484">A step is a shell command or an action; an action is reusable, with inputs and outputs.</text>
  <text class="body" x="40" y="504">GitHub Actions was introduced by GitHub in 2018 and is enabled by default in every repository.</text>
</svg>
