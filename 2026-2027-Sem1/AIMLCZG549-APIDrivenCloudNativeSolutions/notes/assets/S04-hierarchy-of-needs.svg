<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">The Data Science hierarchy of needs</title>
  <desc id="desc">A pyramid from Collect at the base through Move/Store, Explore/Transform, Aggregate/Label, Learn/Optimize, up to AI and Deep Learning at the top, each band matched to the role that mostly owns it, listed in a legend below.</desc>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 24px Georgia,serif;fill:#17313d}
    .b1{fill:#1c3a4a}
    .b2{fill:#2c5468}
    .b3{fill:#3d7185}
    .b4{fill:#5b9aa3}
    .b5{fill:#a9cdb8}
    .b6{fill:#e0c15a}
    .wtext{font:700 15px Georgia,serif;fill:#fffdf7}
    .dtext{font:700 14px Georgia,serif;fill:#17313d}
    .num{font:700 15px Georgia,serif;fill:#fffdf7}
    .legend{font:14px Georgia,serif;fill:#17313d}
    .swatch{stroke:#17313d;stroke-width:1}
  </style>
  <rect class="bg" width="1160" height="700"/>
  <text class="title" x="56" y="42">Reliable infrastructure has to exist before AI can sit on top of it</text>

  <!-- pyramid base at y=580, apex at y=130, centered on x=580 -->
  <polygon class="b1" points="130,580 1030,580 950,500 210,500"/>
  <text class="wtext" x="580" y="530" text-anchor="middle">COLLECT — instrumentation, logging, sensors, external &amp; user-generated data</text>

  <polygon class="b2" points="210,500 950,500 870,420 290,420"/>
  <text class="wtext" x="580" y="450" text-anchor="middle">MOVE / STORE — reliable data flow, pipelines, ETL, structured &amp; unstructured storage</text>

  <polygon class="b3" points="290,420 870,420 790,340 370,340"/>
  <text class="wtext" x="580" y="370" text-anchor="middle">EXPLORE / TRANSFORM — cleaning, anomaly detection, prep</text>

  <polygon class="b4" points="370,340 790,340 710,260 450,260"/>
  <text class="dtext" x="580" y="290" text-anchor="middle">AGGREGATE / LABEL — analytics, metrics, features, training data</text>

  <polygon class="b5" points="450,260 710,260 630,180 530,180"/>
  <text class="dtext" x="580" y="212" text-anchor="middle">LEARN / OPTIMIZE — A/B testing, experimentation</text>

  <polygon class="b6" points="530,180 630,180 580,125"/>

  <text class="dtext" x="580" y="105" text-anchor="middle">AI, DEEP LEARNING</text>

  <!-- legend -->
  <rect class="swatch" x="90" y="620" width="22" height="22" fill="#1c3a4a"/>
  <text class="legend" x="122" y="637">Collect → owned by the Data / Infrastructure Engineer</text>

  <rect class="swatch" x="90" y="650" width="22" height="22" fill="#2c5468"/>
  <text class="legend" x="122" y="667">Move/Store → owned by the Data Engineer</text>

  <rect class="swatch" x="600" y="620" width="22" height="22" fill="#5b9aa3"/>
  <text class="legend" x="632" y="637">Aggregate/Label → Data Scientist / Data Analyst</text>

  <rect class="swatch" x="600" y="650" width="22" height="22" fill="#e0c15a"/>
  <text class="legend" x="632" y="667">AI, Deep Learning (apex) → Machine Learning Engineer</text>
</svg>
