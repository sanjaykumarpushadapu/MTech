<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">DataOps functional architecture</title>
  <desc id="desc">An Orchestrate, Monitor, Test core is driven by automated deployment and environment creation and management, running on a DataOps platform providing storage and version control, history and metadata, auth and permissions, and environment secrets, reported through DataOps metrics and reports to the DataOps team across Dev and Test environments.</desc>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 20px Georgia,serif;fill:#17313d}
    .core{fill:#24465a}
    .coretext{font:700 15px Georgia,serif;fill:#fffdf7}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 12.5px Georgia,serif;fill:#17313d}
    .plat{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:2}
    .team{fill:#cdeadd;stroke:#2f7d68;stroke-width:2}
    .line{stroke:#8a7a52;stroke-width:1.5}
  </style>
  <rect class="bg" width="1160" height="600"/>
  <text class="title" x="40" y="28">Automation and platform services surround one orchestration core</text>

  <circle class="core" cx="580" cy="180" r="95"/>
  <text class="coretext" x="580" y="170" text-anchor="middle">Orchestrate</text>
  <text class="coretext" x="580" y="190" text-anchor="middle">Monitor</text>
  <text class="coretext" x="580" y="210" text-anchor="middle">Test</text>

  <line class="line" x1="500" y1="120" x2="380" y2="90"/>
  <rect class="box" x="200" y="60" width="180" height="60" rx="8"/>
  <text class="head" x="290" y="85" text-anchor="middle">Automated</text>
  <text class="head" x="290" y="102" text-anchor="middle">Deployment</text>

  <line class="line" x1="660" y1="120" x2="780" y2="90"/>
  <rect class="box" x="780" y="60" width="220" height="60" rx="8"/>
  <text class="head" x="890" y="85" text-anchor="middle">Environment Creation</text>
  <text class="head" x="890" y="102" text-anchor="middle">and Management</text>

  <line class="line" x1="580" y1="275" x2="580" y2="285"/>
  <rect class="plat" x="140" y="285" width="880" height="180" rx="10"/>
  <text class="head" x="580" y="308" text-anchor="middle" style="font-size:14px">DataOps Platform</text>

  <rect class="box" x="165" y="330" width="190" height="110" rx="8"/>
  <text class="head" x="260" y="360" text-anchor="middle">Storage and</text>
  <text class="head" x="260" y="378" text-anchor="middle">Version Control</text>

  <rect class="box" x="375" y="330" width="190" height="110" rx="8"/>
  <text class="head" x="470" y="360" text-anchor="middle">History and</text>
  <text class="head" x="470" y="378" text-anchor="middle">Metadata</text>

  <rect class="box" x="595" y="330" width="190" height="110" rx="8"/>
  <text class="head" x="690" y="360" text-anchor="middle">Auth and</text>
  <text class="head" x="690" y="378" text-anchor="middle">Permissions</text>

  <rect class="box" x="805" y="330" width="190" height="110" rx="8"/>
  <text class="head" x="900" y="360" text-anchor="middle">Environment</text>
  <text class="head" x="900" y="378" text-anchor="middle">Secrets</text>

  <text class="head" x="580" y="422" text-anchor="middle" style="font-size:11.5px">spanning Dev and Test environments</text>

  <line class="line" x1="580" y1="465" x2="580" y2="500"/>
  <rect class="team" x="380" y="500" width="400" height="70" rx="8"/>
  <text class="head" x="580" y="528" text-anchor="middle">DataOps Metrics and Reports</text>
  <text class="head" x="580" y="548" text-anchor="middle">→ DataOps Team</text>
</svg>
