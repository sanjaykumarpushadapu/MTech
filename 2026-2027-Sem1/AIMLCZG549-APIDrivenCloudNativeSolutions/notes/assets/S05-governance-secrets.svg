<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc">
  <title id="title">Governance and secrets travel with the pipeline</title>
  <desc id="desc">At each pipeline boundary a governance control is enforced: classify sensitive data, apply least-privilege access, store credentials in a secret manager, encrypt data in transit and at rest, and record an auditable trail — with credentials also using short-lived workload identity and rotation.</desc>
  <defs>
    <marker id="arrGv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 19px Georgia,serif;fill:#17313d}
    .stage{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 11.5px Georgia,serif;fill:#17313d}
    .body{font:9.5px Georgia,serif;fill:#5a4a1e}
    .lock{fill:#9c3f6f}
    .arrow{stroke:#24465a;stroke-width:1.8;fill:none;marker-end:url(#arrGv)}
  </style>
  <rect class="bg" width="1160" height="380"/>
  <text class="title" x="40" y="34">A governance control is enforced at every boundary the pipeline crosses</text>

  <rect class="stage" x="40" y="100" width="190" height="90" rx="8"/><text class="lock" x="135" y="122" text-anchor="middle" style="font-size:16px">🔒</text><text class="head" x="135" y="148" text-anchor="middle">Classify</text><text class="body" x="135" y="166" text-anchor="middle">sensitive data before</text><text class="body" x="135" y="180" text-anchor="middle">processing</text>

  <path class="arrow" d="M230 145 L262 145"/>
  <rect class="stage" x="272" y="100" width="190" height="90" rx="8"/><text class="lock" x="367" y="122" text-anchor="middle" style="font-size:16px">🔒</text><text class="head" x="367" y="148" text-anchor="middle">Least privilege</text><text class="body" x="367" y="166" text-anchor="middle">storage, APIs,</text><text class="body" x="367" y="180" text-anchor="middle">orchestration</text>

  <path class="arrow" d="M462 145 L494 145"/>
  <rect class="stage" x="504" y="100" width="190" height="90" rx="8"/><text class="lock" x="599" y="122" text-anchor="middle" style="font-size:16px">🔒</text><text class="head" x="599" y="148" text-anchor="middle">Secret manager</text><text class="body" x="599" y="166" text-anchor="middle">workload identity,</text><text class="body" x="599" y="180" text-anchor="middle">rotate credentials</text>

  <path class="arrow" d="M694 145 L726 145"/>
  <rect class="stage" x="736" y="100" width="190" height="90" rx="8"/><text class="lock" x="831" y="122" text-anchor="middle" style="font-size:16px">🔒</text><text class="head" x="831" y="148" text-anchor="middle">Encrypt</text><text class="body" x="831" y="166" text-anchor="middle">in transit and</text><text class="body" x="831" y="180" text-anchor="middle">at rest</text>

  <path class="arrow" d="M926 145 L958 145"/>
  <rect class="stage" x="968" y="100" width="150" height="90" rx="8"/><text class="lock" x="1043" y="122" text-anchor="middle" style="font-size:16px">🔒</text><text class="head" x="1043" y="148" text-anchor="middle">Audit</text><text class="body" x="1043" y="166" text-anchor="middle">lineage, approvals,</text><text class="body" x="1043" y="180" text-anchor="middle">access, retention</text>

  <text class="body" x="40" y="250">Secrets never appear in logs or artifacts; unused access is removed and access to</text>
  <text class="body" x="40" y="268">production data and deployments is audited on an ongoing basis.</text>
</svg>
