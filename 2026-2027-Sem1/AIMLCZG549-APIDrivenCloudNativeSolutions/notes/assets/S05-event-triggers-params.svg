<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Event triggers, and parameters kept separate from configuration</title>
  <desc id="desc">An event source (file arrival, message publication, or API request) is validated and deduplicated before triggering a flow run. Parameters — values that change per run — stay separate from configuration, which describes environment and deployment behavior.</desc>
  <defs>
    <marker id="arrEv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 19px Georgia,serif;fill:#17313d}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 12px Georgia,serif;fill:#17313d}
    .body{font:10px Georgia,serif;fill:#5a4a1e}
    .arrow{stroke:#24465a;stroke-width:1.8;fill:none;marker-end:url(#arrEv)}
    .param{fill:#cdeadd;stroke:#2f7d68;stroke-width:1.5}
    .config{fill:#f8e3a3;stroke:#a97e17;stroke-width:1.5}
  </style>
  <rect class="bg" width="1120" height="380"/>
  <text class="title" x="40" y="34">Events are validated and deduplicated before they become a run</text>

  <rect class="box" x="40" y="70" width="200" height="60" rx="8"/><text class="head" x="140" y="105" text-anchor="middle">File arrival / message /</text><text class="body" x="140" y="120" text-anchor="middle" style="display:none"></text>
  <text class="head" x="140" y="120" text-anchor="middle">API request</text>

  <path class="arrow" d="M240 100 L282 100"/>
  <rect class="box" x="292" y="70" width="200" height="60" rx="8"/><text class="head" x="392" y="95" text-anchor="middle">Validate &amp;</text><text class="head" x="392" y="113" text-anchor="middle">deduplicate</text>

  <path class="arrow" d="M492 100 L534 100"/>
  <rect class="box" x="544" y="70" width="220" height="60" rx="8"/><text class="head" x="654" y="95" text-anchor="middle">Flow run</text><text class="body" x="654" y="113" text-anchor="middle">late / out-of-order handled</text>

  <text class="body" x="40" y="180">Schedules remain the right choice when event infrastructure adds no real value.</text>

  <rect class="param" x="40" y="210" width="500" height="70" rx="8"/><text class="head" x="290" y="240" text-anchor="middle">Parameters</text><text class="body" x="290" y="258" text-anchor="middle">values that change per run — event path, run date</text>

  <rect class="config" x="580" y="210" width="500" height="70" rx="8"/><text class="head" x="830" y="240" text-anchor="middle">Configuration</text><text class="body" x="830" y="258" text-anchor="middle">environment &amp; deployment behavior — secrets stored separately</text>
</svg>
