<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">DataOps: the formula and the team</title>
  <desc id="desc">DataOps equals Agile Practices plus Lean Thinking plus Data Analytics plus DevOps. Six roles share ownership around the pipeline: data producers, data engineers, data scientists, analytics engineers, platform and DevOps engineers, and governance and security teams.</desc>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 22px Georgia,serif;fill:#17313d}
    .formula{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .fterm{font:700 17px Georgia,serif;fill:#17313d}
    .fop{font:700 20px Georgia,serif;fill:#8a5a1e}
    .hub{fill:#24465a}
    .hubtext{font:700 16px Georgia,serif;fill:#fffdf7}
    .role{fill:#cdeadd;stroke:#2f7d68;stroke-width:2}
    .rtext{font:12.5px Georgia,serif;fill:#17313d}
    .line{stroke:#8a7a52;stroke-width:1.5}
  </style>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="56" y="42">DataOps brings agile, lean, and analytics practice into DevOps</text>

  <!-- formula row -->
  <rect class="formula" x="40" y="70" width="190" height="56" rx="8"/><text class="fterm" x="135" y="105" text-anchor="middle">DataOps</text>
  <text class="fop" x="250" y="105" text-anchor="middle">=</text>
  <rect class="formula" x="280" y="70" width="190" height="56" rx="8"/><text class="fterm" x="375" y="105" text-anchor="middle">Agile Practices</text>
  <text class="fop" x="490" y="105" text-anchor="middle">+</text>
  <rect class="formula" x="520" y="70" width="190" height="56" rx="8"/><text class="fterm" x="615" y="105" text-anchor="middle">Lean Thinking</text>
  <text class="fop" x="730" y="105" text-anchor="middle">+</text>
  <rect class="formula" x="760" y="70" width="150" height="56" rx="8"/><text class="fterm" x="835" y="97" text-anchor="middle" style="font-size:14px">Data</text><text class="fterm" x="835" y="115" text-anchor="middle" style="font-size:14px">Analytics</text>
  <text class="fop" x="928" y="105" text-anchor="middle">+</text>
  <rect class="formula" x="958" y="70" width="122" height="56" rx="8"/><text class="fterm" x="1019" y="105" text-anchor="middle">DevOps</text>

  <text class="rtext" x="560" y="160" text-anchor="middle" style="font-style:italic">Agile = right things for right people · Lean = remove waste and bottlenecks · DevOps = shared culture · Analytics = descriptive, diagnostic, predictive, prescriptive</text>

  <text class="title" x="56" y="210">DataOps is a team sport — six roles share one pipeline</text>

  <circle class="hub" cx="560" cy="400" r="80"/>
  <text class="hubtext" x="560" y="393" text-anchor="middle">One</text>
  <text class="hubtext" x="560" y="413" text-anchor="middle">pipeline</text>

  <line class="line" x1="560" y1="320" x2="560" y2="270"/>
  <rect class="role" x="440" y="230" width="240" height="46" rx="8"/><text class="rtext" x="560" y="258" text-anchor="middle">Data producers — meaning, freshness, ownership</text>

  <line class="line" x1="625" y1="350" x2="760" y2="290"/>
  <rect class="role" x="770" y="255" width="260" height="46" rx="8"/><text class="rtext" x="900" y="283" text-anchor="middle">Data engineers — ingestion &amp; transformation</text>

  <line class="line" x1="635" y1="440" x2="770" y2="480"/>
  <rect class="role" x="780" y="480" width="260" height="46" rx="8"/><text class="rtext" x="910" y="508" text-anchor="middle">Data scientists — features, experiments, models</text>

  <line class="line" x1="560" y1="480" x2="560" y2="530"/>
  <rect class="role" x="430" y="530" width="260" height="46" rx="8"/><text class="rtext" x="560" y="558" text-anchor="middle">Analytics engineers — trusted datasets</text>

  <line class="line" x1="490" y1="440" x2="360" y2="480"/>
  <rect class="role" x="90" y="480" width="270" height="46" rx="8"/><text class="rtext" x="225" y="508" text-anchor="middle">Platform / DevOps engineers — automation, reliability</text>

  <line class="line" x1="495" y1="350" x2="360" y2="290"/>
  <rect class="role" x="80" y="255" width="280" height="46" rx="8"/><text class="rtext" x="220" y="283" text-anchor="middle">Governance &amp; security — controls without blocking</text>
</svg>
