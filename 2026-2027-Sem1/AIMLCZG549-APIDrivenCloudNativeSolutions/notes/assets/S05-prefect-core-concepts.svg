<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Prefect's six core concepts</title>
  <desc id="desc">A Flow is the complete workflow made of Tasks. A Deployment schedules or triggers the Flow. A Work pool bridges to a Worker, which polls for scheduled work and starts Flow runs. State tracks the observable lifecycle: Scheduled, Running, Completed, or Failed.</desc>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 20px Georgia,serif;fill:#17313d}
    .flow{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:2}
    .task{fill:#fffdf7;stroke:#cdbb90;stroke-width:1.5}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .head{font:700 13px Georgia,serif;fill:#17313d}
    .body{font:10.5px Georgia,serif;fill:#5a4a1e}
    .arrow{stroke:#24465a;stroke-width:2;fill:none;marker-end:url(#arrP)}
    .state{fill:#cdeadd;stroke:#2f7d68;stroke-width:1.5}
    .stext{font:10px Georgia,serif;fill:#17313d}
  </style>
  <rect class="bg" width="1120" height="500"/>
  <text class="title" x="40" y="36">A Deployment schedules a Flow; a Worker in a Work pool runs it; State tracks it</text>

  <rect class="flow" x="40" y="70" width="360" height="180" rx="10"/>
  <text class="head" x="220" y="95" text-anchor="middle">Flow</text>
  <text class="body" x="220" y="112" text-anchor="middle">complete workflow / orchestration boundary</text>
  <rect class="task" x="60" y="130" width="150" height="50" rx="6"/><text class="body" x="135" y="160" text-anchor="middle">Task — state, retries, caching</text>
  <rect class="task" x="230" y="130" width="150" height="50" rx="6"/><text class="body" x="305" y="160" text-anchor="middle">Task — state, retries, caching</text>
  <rect class="task" x="145" y="195" width="150" height="40" rx="6"/><text class="body" x="220" y="220" text-anchor="middle">Task ...</text>

  <path class="arrow" d="M400 160 L440 160"/>
  <rect class="box" x="450" y="120" width="200" height="80" rx="8"/>
  <text class="head" x="550" y="152" text-anchor="middle">Deployment</text>
  <text class="body" x="550" y="170" text-anchor="middle">scheduled / triggered flow config</text>

  <path class="arrow" d="M650 160 L690 160"/>
  <rect class="box" x="700" y="120" width="180" height="80" rx="8"/>
  <text class="head" x="790" y="152" text-anchor="middle">Work pool</text>
  <text class="body" x="790" y="170" text-anchor="middle">orchestration ↔ infra bridge</text>

  <path class="arrow" d="M880 160 L920 160"/>
  <rect class="box" x="930" y="120" width="150" height="80" rx="8"/>
  <text class="head" x="1005" y="152" text-anchor="middle">Worker</text>
  <text class="body" x="1005" y="170" text-anchor="middle">polls, starts runs</text>

  <path class="arrow" d="M550 200 L550 330"/>
  <text class="head" x="550" y="365" text-anchor="middle">State</text>
  <rect class="state" x="120" y="380" width="180" height="50" rx="8"/><text class="stext" x="210" y="410" text-anchor="middle">Scheduled</text>
  <path class="arrow" d="M300 405 L360 405"/>
  <rect class="state" x="370" y="380" width="180" height="50" rx="8"/><text class="stext" x="460" y="410" text-anchor="middle">Running</text>
  <path class="arrow" d="M550 405 L610 405"/>
  <rect class="state" x="620" y="380" width="180" height="50" rx="8"/><text class="stext" x="710" y="410" text-anchor="middle">Completed</text>
  <path class="arrow" d="M460 430 Q460 470 700 470 L950 470 L950 430" fill="none"/>
  <rect class="state" x="870" y="380" width="180" height="50" rx="8"/><text class="stext" x="960" y="410" text-anchor="middle">Failed</text>
  <text class="body" x="710" y="460" text-anchor="middle" style="font-size:9.5px">Running can lead to either Completed or Failed</text>
</svg>
