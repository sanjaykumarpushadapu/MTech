<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="280" viewBox="0 0 1080 280" role="img" aria-labelledby="title desc">
  <title id="title">Blue-green and canary releases limit exposure to a bad deploy</title>
  <desc id="desc">Blue-green keeps two full environments and switches traffic at once; canary shifts a small slice of traffic first and expands only if it stays healthy.</desc>
  <style>
    .bg{fill:#f8f4ea} .title{font:700 18px Georgia,serif;fill:#17313d}
    .box{fill:#fffdf7;stroke:#cdbb90;stroke-width:2} .head{font:700 11.5px Georgia,serif;fill:#17313d}
    .body{font:9.5px Georgia,serif;fill:#5a4a1e} .old{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:2}
    .new{fill:#cdeadd;stroke:#2f7d68;stroke-width:2}
  </style>
  <rect class="bg" width="1080" height="280"/>
  <text class="title" x="40" y="32">Two ways to limit blast radius: switch environments, or shift traffic gradually</text>
  <text class="head" x="40" y="70">Blue-green</text>
  <rect class="old" x="40" y="85" width="200" height="55" rx="6"/><text class="body" x="140" y="118" text-anchor="middle">Blue (live)</text>
  <rect class="new" x="260" y="85" width="200" height="55" rx="6"/><text class="body" x="360" y="118" text-anchor="middle">Green (new, idle)</text>
  <text class="body" x="40" y="160">Traffic switches to green all at once; blue stays ready for instant rollback.</text>
  <text class="head" x="600" y="70">Canary</text>
  <rect class="old" x="600" y="85" width="130" height="55" rx="6"/><text class="body" x="665" y="118" text-anchor="middle">95% old</text>
  <rect class="new" x="740" y="85" width="130" height="55" rx="6"/><text class="body" x="805" y="118" text-anchor="middle">5% new</text>
  <text class="body" x="600" y="160">Small slice takes new traffic first; expands only while healthy, rolls back if not.</text>
</svg>
