<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">The five V's of Big Data</title>
  <desc id="desc">Volume, Velocity, Variety, Veracity and Value arranged around a central Big Data core, each with a one-line meaning.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a7a52"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .core{fill:#24465a}
    .coretext{font:700 26px Georgia,serif;fill:#fffdf7}
    .petal{stroke-width:2}
    .p1{fill:#f6d9c9;stroke:#c96a3c}
    .p2{fill:#cdeadd;stroke:#2f7d68}
    .p3{fill:#d9d3f2;stroke:#5a4a9c}
    .p4{fill:#f8e3a3;stroke:#a97e17}
    .p5{fill:#cfe6f6;stroke:#1f6f9c}
    .label{font:700 20px Georgia,serif;fill:#17313d}
    .body{font:14.5px Georgia,serif;fill:#24465a}
    .title{font:700 26px Georgia,serif;fill:#17313d}
  </style>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="56" y="46">Big Data is defined by five compounding properties, not just size</text>

  <circle class="core" cx="560" cy="330" r="90"/>
  <text class="coretext" x="560" y="322" text-anchor="middle">Big Data</text>
  <text class="coretext" x="560" y="348" text-anchor="middle" style="font-size:16px">5 V's</text>

  <!-- Volume: top -->
  <circle class="petal p1" cx="560" cy="140" r="95"/>
  <text class="label" x="560" y="120" text-anchor="middle">Volume</text>
  <text class="body" x="560" y="145" text-anchor="middle">too large for one</text>
  <text class="body" x="560" y="163" text-anchor="middle">machine to hold</text>

  <!-- Velocity: upper left -->
  <circle class="petal p2" cx="330" cy="220" r="95"/>
  <text class="label" x="330" y="200" text-anchor="middle">Velocity</text>
  <text class="body" x="330" y="225" text-anchor="middle">how fast new</text>
  <text class="body" x="330" y="243" text-anchor="middle">data arrives</text>

  <!-- Variety: lower left -->
  <circle class="petal p3" cx="330" cy="440" r="95"/>
  <text class="label" x="330" y="420" text-anchor="middle">Variety</text>
  <text class="body" x="330" y="445" text-anchor="middle">structured, semi-,</text>
  <text class="body" x="330" y="463" text-anchor="middle">unstructured forms</text>

  <!-- Veracity: bottom -->
  <circle class="petal p4" cx="560" cy="520" r="95"/>
  <text class="label" x="560" y="500" text-anchor="middle">Veracity</text>
  <text class="body" x="560" y="525" text-anchor="middle">how trustworthy</text>
  <text class="body" x="560" y="543" text-anchor="middle">and clean it is</text>

  <!-- Value: upper right -->
  <circle class="petal p5" cx="790" cy="220" r="95"/>
  <text class="label" x="790" y="200" text-anchor="middle">Value</text>
  <text class="body" x="790" y="225" text-anchor="middle">usefulness for the</text>
  <text class="body" x="790" y="243" text-anchor="middle">intended purpose</text>

  <text class="body" x="820" y="440" text-anchor="middle" style="font-style:italic">Veracity and speed</text>
  <text class="body" x="820" y="458" text-anchor="middle" style="font-style:italic">both feed Value</text>
  <path class="petal" d="M700 480 Q760 460 780 320" fill="none" stroke="#8a7a52" stroke-dasharray="4 4" marker-end="url(#arr)"/>
</svg>
