<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc">
  <title id="title">Food delivery microservices topology</title>
  <desc id="desc">Callers enter through API gateway or restaurant web UI, then route to domain services and external adapters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#28536b"/>
    </marker>
    <style>
      .bg{fill:#f8f4ea}.band{fill:#fff8e8;stroke:#e0cda5;stroke-width:2;rx:28}
      .caller{fill:#fffdf7;stroke:#cdbb90;stroke-width:2;rx:18}.entry{fill:#e8f3f6;stroke:#4c8191;stroke-width:2.5;rx:20}
      .route{fill:#fff2d7;stroke:#c98937;stroke-width:2;rx:18}.svc{fill:#eaf5ef;stroke:#3b856d;stroke-width:2;rx:18}.ext{fill:#f3edf7;stroke:#8e6aa5;stroke-width:2;rx:18}
      .title{font:700 26px Georgia,serif;fill:#17313d}.bandTitle{font:700 16px Georgia,serif;fill:#8a6424}.label{font:700 17px Georgia,serif;fill:#17313d}.small{font:500 13px Georgia,serif;fill:#3f5861}
      .arrow{stroke:#28536b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="820"/>
  <text class="title" x="54" y="54">Food-delivery API topology: services expose APIs, data stays private</text>

  <rect class="band" x="55" y="90" width="970" height="135"/>
  <text class="bandTitle" x="90" y="122">CALLERS</text>
  <rect class="caller" x="145" y="140" width="180" height="62"/><text class="label" x="235" y="166" text-anchor="middle">Courier</text><text class="small" x="235" y="187" text-anchor="middle">mobile</text>
  <rect class="caller" x="450" y="140" width="180" height="62"/><text class="label" x="540" y="166" text-anchor="middle">Consumer</text><text class="small" x="540" y="187" text-anchor="middle">mobile</text>
  <rect class="caller" x="755" y="140" width="180" height="62"/><text class="label" x="845" y="166" text-anchor="middle">Restaurant</text><text class="small" x="845" y="187" text-anchor="middle">web UI</text>

  <rect class="band" x="55" y="260" width="970" height="130"/>
  <text class="bandTitle" x="90" y="292">ENTRY POINTS</text>
  <rect class="entry" x="270" y="310" width="210" height="62"/><text class="label" x="375" y="347" text-anchor="middle">API Gateway</text>
  <rect class="entry" x="600" y="310" width="210" height="62"/><text class="label" x="705" y="337" text-anchor="middle">Restaurant</text><text class="small" x="705" y="357" text-anchor="middle">Web UI</text>

  <rect class="band" x="55" y="425" width="970" height="220"/>
  <text class="bandTitle" x="90" y="457">DOMAIN SERVICES</text>
  <rect class="route" x="145" y="470" width="330" height="52"/><text class="label" x="310" y="492" text-anchor="middle">Gateway routes to</text><text class="small" x="310" y="512" text-anchor="middle">Order, Restaurant, Delivery</text>
  <rect class="route" x="605" y="470" width="330" height="52"/><text class="label" x="770" y="492" text-anchor="middle">Restaurant UI routes to</text><text class="small" x="770" y="512" text-anchor="middle">Restaurant, Delivery, Kitchen</text>
  <rect class="svc" x="120" y="550" width="170" height="56"/><text class="label" x="205" y="584" text-anchor="middle">Order Service</text>
  <rect class="svc" x="340" y="550" width="190" height="56"/><text class="label" x="435" y="584" text-anchor="middle">Restaurant Service</text>
  <rect class="svc" x="580" y="550" width="170" height="56"/><text class="label" x="665" y="584" text-anchor="middle">Delivery Service</text>
  <rect class="svc" x="805" y="550" width="170" height="56"/><text class="label" x="890" y="584" text-anchor="middle">Kitchen Service</text>
  <rect class="svc" x="260" y="620" width="170" height="50"/><text class="label" x="345" y="651" text-anchor="middle">Accounting</text>
  <rect class="svc" x="665" y="620" width="170" height="50"/><text class="label" x="750" y="651" text-anchor="middle">Notification</text>

  <rect class="band" x="55" y="700" width="970" height="90"/>
  <text class="bandTitle" x="90" y="728">EXTERNAL ADAPTERS</text>
  <rect class="ext" x="190" y="745" width="170" height="36"/><text class="label" x="275" y="769" text-anchor="middle">Stripe</text>
  <rect class="ext" x="580" y="745" width="150" height="36"/><text class="label" x="655" y="769" text-anchor="middle">Twilio</text>
  <rect class="ext" x="765" y="745" width="170" height="36"/><text class="label" x="850" y="769" text-anchor="middle">Amazon SES</text>

  <path class="arrow" d="M235 202 C235 250 315 262 350 310"/>
  <path class="arrow" d="M540 202 C525 250 440 270 400 310"/>
  <path class="arrow" d="M845 202 C835 252 745 270 720 310"/>
  <path class="arrow" d="M375 372 L310 470"/>
  <path class="arrow" d="M705 372 L770 470"/>
  <path class="arrow" d="M310 522 L310 550"/>
  <path class="arrow" d="M770 522 L770 550"/>
  <path class="arrow" d="M345 670 L275 745"/>
  <path class="arrow" d="M750 670 L655 745"/>
  <path class="arrow" d="M750 670 L850 745"/>
</svg>
