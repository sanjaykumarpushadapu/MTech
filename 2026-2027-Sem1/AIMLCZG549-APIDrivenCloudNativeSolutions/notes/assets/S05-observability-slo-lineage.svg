<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Observability signals, an SLO with an error budget, and lineage</title>
  <desc id="desc">Five observability signals: freshness, volume, distribution, lineage, reliability. An SLO sets a target with an error budget for acceptable unreliability. A lineage graph traces a bad output back through its transformations to its source, identifying which downstream consumers are affected.</desc>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24465a"/></marker>
  </defs>
  <style>
    .bg{fill:#f8f4ea}
    .title{font:700 19px Georgia,serif;fill:#17313d}
    .sig{fill:#cfe6f6;stroke:#1f6f9c;stroke-width:1.8}
    .head{font:700 11.5px Georgia,serif;fill:#17313d}
    .body{font:9.5px Georgia,serif;fill:#5a4a1e}
    .slo{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .budget{fill:#cdeadd;stroke:#2f7d68;stroke-width:1.5}
    .used{fill:#f6d9c9;stroke:#c96a3c;stroke-width:1.5}
    .lin{fill:#fffdf7;stroke:#cdbb90;stroke-width:2}
    .arrow{stroke:#8a7a52;stroke-width:1.8;fill:none;marker-end:url(#arrO)}
    .bad{stroke:#c96a3c;stroke-width:2.4;fill:none;marker-end:url(#arrO)}
  </style>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="40" y="34">Five signals feed an SLO's error budget; lineage traces an incident to its source</text>

  <rect class="sig" x="40" y="60" width="210" height="60" rx="8"/><text class="head" x="145" y="85" text-anchor="middle">Freshness</text><text class="body" x="145" y="103" text-anchor="middle">arrived on time?</text>
  <rect class="sig" x="260" y="60" width="210" height="60" rx="8"/><text class="head" x="365" y="85" text-anchor="middle">Volume</text><text class="body" x="365" y="103" text-anchor="middle">row counts as expected?</text>
  <rect class="sig" x="480" y="60" width="210" height="60" rx="8"/><text class="head" x="585" y="85" text-anchor="middle">Distribution</text><text class="body" x="585" y="103" text-anchor="middle">values shifted?</text>
  <rect class="sig" x="700" y="60" width="210" height="60" rx="8"/><text class="head" x="805" y="85" text-anchor="middle">Lineage</text><text class="body" x="805" y="103" text-anchor="middle">what changed upstream?</text>
  <rect class="sig" x="920" y="60" width="210" height="60" rx="8"/><text class="head" x="1025" y="85" text-anchor="middle">Reliability</text><text class="body" x="1025" y="103" text-anchor="middle">succeed &amp; recover?</text>

  <text class="title" x="40" y="180">SLO with an error budget</text>
  <rect class="slo" x="40" y="200" width="500" height="60" rx="8"/>
  <rect class="budget" x="50" y="212" width="420" height="36" rx="6"/>
  <rect class="used" x="470" y="212" width="60" height="36" rx="6"/>
  <text class="body" x="290" y="235" text-anchor="middle">success rate, freshness, duration — target met</text>
  <text class="body" x="500" y="285" text-anchor="middle">error budget</text>

  <text class="title" x="40" y="400">Lineage graph — tracing an incident back to its source</text>
  <rect class="lin" x="40" y="440" width="180" height="60" rx="8"/><text class="head" x="130" y="475" text-anchor="middle">Source</text>
  <path class="arrow" d="M220 470 L262 470"/>
  <rect class="lin" x="272" y="440" width="200" height="60" rx="8"/><text class="head" x="372" y="475" text-anchor="middle">Transformation</text>
  <path class="arrow" d="M472 470 L514 470"/>
  <rect class="lin" x="524" y="440" width="200" height="60" rx="8"/><text class="head" x="624" y="475" text-anchor="middle">Output dataset</text>
  <path class="arrow" d="M724 470 L766 470"/>
  <rect class="lin" x="776" y="410" width="190" height="55" rx="8"/><text class="head" x="871" y="442" text-anchor="middle">Consumer A</text>
  <path class="arrow" d="M724 480 L766 520"/>
  <rect class="lin" x="776" y="495" width="190" height="55" rx="8"/><text class="head" x="871" y="527" text-anchor="middle">Consumer B</text>

  <path class="bad" d="M624 440 Q450 355 200 460"/>
  <text class="body" x="340" y="345" text-anchor="middle" style="font-style:italic;fill:#c96a3c">bad output traced back to its source</text>
</svg>
